{q:"8. Which skill requires students to understand and organize oral instructions?", o:["A. Listening | مهارة الاستماع", "B. Speaking | مهارة التحدث", "C. Writing | مهارة الكتابة", "D. Reading | مهارة القراءة"], c:0, t:"أي مهارة تتطلب من الطلاب فهم وتنظيم التعليمات الشفهية؟", e:"<div class='box-hint'>فهم التعليمات الشفوية/المنطوقة (Oral) يعتمد بشكل أساسي على مهارة الاستماع (Listening).</div>"},
{q:"9. Which of the following language teaching methods is most closely aligned to the behaviorist theory?", o:["A. The natural method | الطريقة الطبيعية", "B. The silent way method | الطريقة الصامتة", "C. The Audio-lingual method | الطريقة السمعية الشفوية", "D. The communicative method | الطريقة التواصلية"], c:2, t:"أي من طرق تدريس اللغة التالية هي الأقرب توافقاً مع النظرية السلوكية؟", e:"<div class='box-hint'>الطريقة السمعية الشفوية (Audio-lingual) بُنيت كلياً على المدرسة السلوكية عبر التكرار وتكوين العادات.</div>"},
{q:"10. Which of the following is considered a key factor in determining a student's success or failures", o:["A. Motivation | الدافعية والتحفيز", "B. Attrition | التناقص/التآكل اللغوي", "C. Fluency | الطلاقة", "D.  | (خيار فارغ)"], c:0, t:"أي مما يلي يُعتبر عاملاً رئيسياً في تحديد نجاح الطالب أو فشله؟", e:"<div class='box-hint'>الدافعية (Motivation) هي المحرك الأساسي والأهم لنجاح المتعلم في اكتساب اللغة.</div>"},
{q:"11. A term used to describe the possible harmful effects of the second language on the first language usually results in a decrease in language proficiency compared to what was previously acquired. This term is Language ........", o:["A. Shift | تحول", "B. Attrition | تآكل/فقدان اللغة", "C. Retention | احتفاظ", "D. Acquisition | اكتساب"], c:1, t:"مصطلح يصف الانخفاض في كفاءة اللغة الأولى بسبب تأثير اللغة الثانية. هذا المصطلح هو ........ اللغة.", e:"<div class='box-hint'>نسيان أو تدهور مهارات اللغة الأولى بسبب عدم الاستخدام أو تأثير لغة أخرى يُسمى التآكل اللغوي (Attrition).</div>"},
{q:"12. The Cornell method is a ........ technique that helps in listening skill", o:["A. note-taking | تدوين الملاحظات", "B. previewing | مراجعة مسبقة", "C. summarizing | تلخيص", "D. paraphrasing | إعادة صياغة"], c:0, t:"طريقة كورنيل هي تقنية لـ ........ تساعد في مهارة الاستماع.", e:"<div class='box-hint'>طريقة كورنيل مصممة لتقسيم الصفحة وترتيب تدوين الملاحظات (Note-taking) أثناء الاستماع للمحاضرات.</div>"},
{q:"13. Which sequence is used to describe events in a specific order, such as first, second, and third?", o:["A. Time sequence | تسلسل زمني (عام)", "B. Chronological order sequence | تسلسل الترتيب الزمني (التاريخي)", "C. Cause and effect sequence | تسلسل السبب والنتيجة", "D. Problem and solution sequence | تسلسل المشكلة والحل"], c:1, t:"أي تسلسل يُستخدم لوصف الأحداث بترتيب محدد، مثل أولاً، ثانياً، وثالثاً؟", e:"<div class='box-hint'>الترتيب الذي يسرد الأحداث حسب تسلسل حدوثها الزمني يُسمى الترتيب الزمني (Chronological order).</div>"},
{q:"14. ........ serve both to make a rough check on students' progress and to keep students on their toes.", o:["A. Proficiency tests | اختبارات الكفاءة", "B. Placement tests | اختبارات تحديد المستوى", "C. Pop quizzes | الاختبارات القصيرة المفاجئة", "D. Achievement tests | الاختبارات التحصيلية"], c:2, t:"........ تخدم غرضين: فحص سريع لتقدم الطلاب، وإبقائهم في حالة تأهب واستعداد دائم.", e:"<div class='box-hint'>الاختبارات المفاجئة (Pop quizzes) تُجبر الطلاب على المذاكرة المستمرة والبقاء في حالة تأهب.</div>"},
{q:"15. What does syntax study?", o:["A. Words | الكلمات", "B. Sentences | الجمل وتراكيبها", "C. Meaning | المعنى", "D. Grammar Structure | الهيكل النحوي"], c:1, t:"ماذا يدرس علم النحو (Syntax)؟", e:"<div class='box-hint'>علم النحو (Syntax) يختص بدراسة كيفية ترتيب الكلمات لتكوين جُمل صحيحة (Sentences formation).</div>"},
{q:"16. Teaching social norms like greetings for Arab students can be included through...", o:["A. Culture | الثقافة", "B. Social skills | المهارات الاجتماعية", "C. Speaking | التحدث", "D. Writing | الكتابة"], c:0, t:"تعليم الأعراف الاجتماعية مثل التحيات للطلاب العرب يمكن تضمينه من خلال...", e:"<div class='box-hint'>طريقة إلقاء التحية والتفاعل الاجتماعي هي جزء لا يتجزأ من الثقافة (Culture) المرتبطة باللغة.</div>"},
{q:"17. Ahmed can remember the names of people once he sees them. Also, he can know the names of shapes when he sees shapes like circle and triangle. We can discover that Ahmed is ...", o:["A. Kinesthetic | حركي/لمسي", "B. Visual | بصري", "C. Audio | سمعي", "D. Analytic | تحليلي"], c:1, t:"أحمد يتذكر الأسماء والأشكال بمجرد رؤيتها. يمكننا أن نكتشف أن أحمد متعلم ...", e:"<div class='box-hint'>الاعتماد على الرؤية والصور لتذكر المعلومات هو من سمات المتعلم البصري (Visual).</div>"},
{q:"18. Look up the word 'sailor' in the dictionary. Which technique are you using?", o:["A. Scanning | المسح السريع للبحث عن كلمة", "B. Skimming | التصفح لأخذ الفكرة العامة", "C. Reading in detail | القراءة بالتفصيل", "D. Guessing from context | التخمين من السياق"], c:0, t:"ابحث عن كلمة 'sailor' في القاموس. ما هي التقنية التي تستخدمها؟", e:"<div class='box-hint'>البحث السريع عن معلومة محددة أو كلمة معينة (مثل البحث في القاموس) يسمى Scanning.</div>"},
{q:"19. What do we call a language that was originally a pidgin, but over time has become the first language of many people?", o:["A. Pidgins | لغة هجينة مبسطة", "B. Creole | كريول (لغة هجينة أصبحت لغة أم)", "C. Dialects | لهجات", "D. Vernaculars | لغات عامية محلية"], c:1, t:"ماذا نسمي اللغة التي كانت في الأصل لغة مبسطة (pidgin)، ولكن بمرور الوقت أصبحت اللغة الأولى للكثيرين؟", e:"<div class='box-hint'>عندما يتوارث الأبناء لغة الـ Pidgin وتصبح لغتهم الأم تكتمل قواعدها وتُسمى (Creole).</div>"},
{q:"20. Which stage involves correcting grammar and spelling errors?", o:["A. Drafting | كتابة المسودة", "B. Proofreading | التدقيق اللغوي", "C. Brainstorming | العصف الذهني", "D. Publishing | النشر"], c:1, t:"أي مرحلة (في الكتابة) تتضمن تصحيح الأخطاء النحوية والإملائية؟", e:"<div class='box-hint'>التدقيق النهائي بحثاً عن أخطاء الإملاء والقواعد قبل التسليم يُسمى Proofreading.</div>"},
{q:"21. For an intermediate-level student preparing a short presentation about the coronavirus, which of the following sources would be most appropriate?", o:["A. Academic Journals | دوريات أكاديمية متخصصة", "B. Medical Books | كتب طبية معقدة", "C. News Websites | مواقع إخبارية", "D. Social Media Posts | منشورات وسائل التواصل"], c:2, t:"بالنسبة لطالب بمستوى متوسط يُعد عرضاً قصيراً عن كورونا، أي المصادر التالية ستكون الأنسب؟", e:"<div class='box-hint'>طالب المستوى المتوسط يحتاج لمصادر واضحة وموثوقة كالمواقع الإخبارية (News Websites)، فالأكاديمية صعبة جداً والاجتماعية غير موثوقة.</div>"},
{q:"22. One of the most common sources of new words in English. For example, 'alcohol' has been adopted from Arabic", o:["A. Compounding | تركيب الكلمات", "B. Borrowing | الاقتراض/الاستعارة", "C. Blending | المزج", "D. Clipping | الاقتطاع"], c:1, t:"أحد المصادر الشائعة للكلمات الجديدة بالإنجليزية. مثلاً كلمة 'alcohol' تم تبنيها من العربية عبر عملية:", e:"<div class='box-hint'>أخذ كلمة من لغة أجنبية وإدخالها للغة أخرى يسمى الاقتراض اللغوي (Borrowing).</div>"},
{q:"23. Morphology is the study of:", o:["A. Sound of speech | أصوات الكلام", "B. Sound patterns | الأنماط الصوتية", "C. Structure and meaning of words | بنية ومعنى الكلمات", "D. Sentence formation | تكوين الجمل"], c:2, t:"علم الصرف (Morphology) هو دراسة:", e:"<div class='box-hint'>علم الصرف يدرس البنية الداخلية للكلمات وكيف تتشكل عبر اللواحق والجذور (Structure of words).</div>"},
{q:"24. In essays, introductions should be........", o:["A. detailed | مفصلة جداً", "B. irritating | مزعجة", "C. engaging | جذابة ومثيرة للاهتمام", "D. confusing | مربكة"], c:2, t:"في المقالات، يجب أن تكون المقدمات ........", e:"<div class='box-hint'>المقدمة يجب أن تجذب انتباه القارئ وتشده لإكمال النص، لذا يجب أن تكون جذابة (Engaging).</div>"},
{q:"25. The components of an essay are:", o:["A. Topic sentences, conclusion | جمل الموضوع والخاتمة", "B. Introduction, body, conclusion | مقدمة، متن، وخاتمة", "C. Body, thesis statement, conclusion | متن، أطروحة، وخاتمة", "D. Introduction, body, thesis statement, conclusion | مقدمة، متن، أطروحة، خاتمة"], c:1, t:"مكونات المقال هي:", e:"<div class='box-hint'>الهيكل التنظيمي الأساسي للمقال يتكون من 3 أجزاء رئيسية: Introduction, body, conclusion.</div>"},
{q:"26. How many syllables in a word 'information'", o:["A. 3 | ثلاثة مقاطع", "B. 4 | أربعة مقاطع", "C. 5 | خمسة مقاطع", "D. 2 | مقطعان"], c:1, t:"كم عدد المقاطع الصوتية في كلمة 'information'؟", e:"<div class='box-hint'>تُقسم الكلمة صوتياً إلى 4 مقاطع: in-for-ma-tion.</div>"},
{q:"27. To increase the reading comprehension and retention for learners, it is best", o:["A. Read aloud for the students | القراءة بصوت عالٍ للطلاب", "B. give very short passages | إعطاء قطع قصيرة جداً", "C. provide a text with simple language | توفير نص بلغة بسيطة جداً", "D. identify the purpose of reading the text | تحديد الغرض من قراءة النص"], c:3, t:"لزيادة فهم القراءة والاحتفاظ بالمعلومات للمتعلمين، من الأفضل:", e:"<div class='box-hint'>تحديد الهدف (Purpose) قبل القراءة يوجه تركيز الطالب ويجعله يقرأ بوعي مما يزيد استيعابه.</div>"},
{q:"28. The ........ instructional environment in which the focus is the language itself. The only goal for the teacher is to make sure that students are taught vocabulary and grammar.", o:["A. communicative | بيئة تواصلية", "B. task-based | قائمة على المهام", "C. structure based | بيئة قائمة على البنية/التركيب اللغوي", "D. Direct method | الطريقة المباشرة"], c:2, t:"في البيئة التعليمية ........ يكون التركيز على اللغة نفسها (حفظ القواعد والمفردات) كهدف وحيد.", e:"<div class='box-hint'>البيئة التي تُعنى بتدريس القواعد والتراكيب الجافة بمعزل عن التواصل تسمى (Structure-based).</div>"},
{q:"29. Which term can describe a person who has fluency in two languages?", o:["A. Bilingual | ثنائي اللغة", "B. Multilingual | متعدد اللغات", "C. Monolingual | أحادي اللغة", "D. (خيار غير واضح)"], c:0, t:"أي مصطلح يمكن أن يصف شخصاً لديه طلاقة في لغتين؟", e:"<div class='box-hint'>الشخص الذي يتحدث لغتين بطلاقة يُسمى ثنائي اللغة (Bilingual).</div>"},
{q:"30. When the relevant unit or structure of both languages is the same, linguistic interference can result in correct language production called? ", o:["A. negative transfer | نقل سلبي", "B. positive transfer | نقل إيجابي", "C. isolation | عزل", "D. fossilisation | تحجر"], c:1, t:"عندما يكون التركيب في كلتا اللغتين متماثلاً، فإن التداخل اللغوي يؤدي إلى إنتاج لغوي صحيح يسمى:", e:"<div class='box-hint'>التشابه بين لغة الأم واللغة الثانية يسهل التعلم ويُنتج دقة لغوية، وهذا يُسمى النقل الإيجابي (Positive transfer).</div>"},
{q:"31. The way in which individual modify or replace his previous cognitive structures in order to absorb new experiences? ", o:["A. organisation | تنظيم", "B. assimilation | استيعاب/دمج (دون تعديل)", "C. accommodation | المواءمة والتكييف (تعديل البنية)", "D. adaptation | التكيف العام"], c:2, t:"الطريقة التي يقوم بها الفرد بتعديل أو استبدال بنيته المعرفية السابقة لاستيعاب تجارب جديدة تسمى:", e:"<div class='box-hint'>وفقاً لبياجيه، تعديل المخططات الذهنية القديمة لتناسب معلومة جديدة كلياً يُسمى المواءمة (Accommodation).</div>"},
{q:"32. When a teacher asks his students to complete the homework and send it via email, the teacher here applied education by ........", o:["A. blended | مدمج", "B. asynchronous | غير متزامن", "C. synchronous | متزامن", "D. programmed | مبرمج"], c:1, t:"عندما يطلب المعلم من الطلاب إكمال الواجب وإرساله عبر البريد الإلكتروني، فهو يطبق تعليماً ........", e:"<div class='box-hint'>التواصل عبر البريد الإلكتروني لا يتطلب تواجداً في نفس اللحظة، لذا فهو اتصال غير متزامن (Asynchronous).</div>"},
{q:"33. According to Krashen's Theory, second language acquisition is very similar to the process children use when acquiring their first language.", o:["A. hypothesis acquisition | فرضية الاكتساب", "B. comprehensible input | مدخلات مفهومة", "C. modelling | نمذجة", "D. linguistic competence | كفاءة لغوية"], c:1, t:"وفقاً لنظرية كراشن، اكتساب اللغة الثانية يشبه عملية اكتساب الأطفال للغتهم الأولى وذلك يعتمد على:", e:"<div class='box-hint'>التشابه يكمن في تعرض الطفل/المتعلم لمدخلات مفهومة (Comprehensible input) تؤدي لاكتساب تلقائي لاواعي.</div>"},
{q:"34. The more ........ a word is encountered, the faster it will be remembered by students.", o:["A. Difficulty | بصعوبة", "B. Academic | أكاديمياً", "C. Scientifically | علمياً", "D. Frequently | بشكل متكرر"], c:3, t:"كلما تم مصادفة الكلمة بشكل ........ أكثر، كلما تذكرها الطلاب بشكل أسرع.", e:"<div class='box-hint'>التكرار وكثرة التعرض للكلمة (Frequently) يرسخها في الذاكرة ويسهل استرجاعها.</div>"},
{q:"35. The technique of ........ is an activity where a student needs information from others to complete a particular task", o:["A. Matching | المطابقة", "B. Critical reading | القراءة النقدية", "C. Information gap | فجوة المعلومات", "D. Filling in the blanks | ملء الفراغات"], c:2, t:"تقنية ........ هي نشاط يحتاج فيه الطالب إلى معلومات من الآخرين لإكمال مهمة معينة.", e:"<div class='box-hint'>عندما يمتلك كل طالب جزءاً من المعلومة ويحتاج للتواصل مع زميله لاكتمال الصورة، يُسمى هذا فجوة المعلومات (Information gap).</div>"},
{q:"36. Suffixes do not usually change the grammatical class of the words to which they are attached.", o:["A. Morphological | صرفية", "B. Functional | وظيفية", "C. Inflectional | إعرابية/تصريفية", "D. Derivational | اشتقاقية"], c:2, t:"اللواحق ........ لا تغير عادة الفئة النحوية (قسم الكلام) للكلمات التي تتصل بها.", e:"<div class='box-hint'>اللواحق التصريفية (Inflectional) مثل s الجمع أو ed الماضي لا تغير الكلمة من فعل لاسم، بل تغير زمنها أو عددها فقط.</div>"},
{q:"37. Which of the following is not a characteristic of input?", o:["A. Comprehensive | شامل", "B. Clear | واضح", "C. Appropriate | مناسب", "D. Ambiguous | غامض ومبهم"], c:3, t:"أي مما يلي ليس من خصائص المدخلات (Input) الجيدة؟", e:"<div class='box-hint'>المدخلات يجب أن تكون مفهومة، لذا الغموض (Ambiguous) ليس من صفاتها بل يعيق التعلم.</div>"},
{q:"38. The study of sound production is known as ........ phonetic.", o:["A. Auditory | إدراكية سمعية", "B. Articulatory | نطقية (تشريحية)", "C. Acoustic | فيزيائية", "D. (خيار فارغ)"], c:1, t:"دراسة كيفية إنتاج وإصدار الأصوات تُعرف بالصوتيات ........", e:"<div class='box-hint'>دراسة حركة أعضاء النطق (اللسان، الشفاه) لإنتاج الصوت تسمى Articulatory phonetics.</div>"},
{q:"39. The notion that the ability to acquire language is biologically linked to age is called ........ hypothesis.", o:["A. the critical period | الفترة الحرجة", "B. multilingualism | التعدد اللغوي", "C. Krashen's theory | نظرية كراشن", "D. bilingualism | الثنائية اللغوية"], c:0, t:"الفكرة القائلة بأن القدرة على اكتساب اللغة مرتبطة بيولوجياً بالعمر تسمى فرضية ........", e:"<div class='box-hint'>الفرضية التي تنص على أن هناك نافذة زمنية محدودة لاكتساب اللغة بطلاقة تسمى (Critical period).</div>"},
{q:"40. The process of taking words from another language is known as", o:["A. borrowing | الاستعارة/الاقتراض", "B. clipping | الاقتطاع", "C. backformation | التشكيل العكسي", "D. acquisition | الاكتساب"], c:0, t:"عملية أخذ كلمات من لغة أخرى تُعرف بـ:", e:"<div class='box-hint'>أخذ كلمة من لغة أجنبية واستخدامها في لغتك (مثل تليفزيون، راديو) يسمى الاقتراض اللغوي (Borrowing).</div>"},
{q:"41. For secondary school students, a less stressful alternative to traditional essay writing is to have:", o:["A. Keep a portfolio of article clippings | الاحتفاظ بملف قصاصات مقالات", "B. Take frequent composition quizzes | إجراء اختبارات تعبير متكررة", "C. Write only one essay per term | كتابة مقال واحد فقط في الفصل", "D. Maintain a personal journal | الاحتفاظ بمذكرات يومية شخصية"], c:3, t:"لطلاب المرحلة الثانوية، البديل الأقل توتراً لكتابة المقالات التقليدية هو:", e:"<div class='box-hint'>كتابة اليوميات (Journal) توفر مساحة حرة وخالية من ضغط التقييم الصارم للتعبير عن الأفكار.</div>"},
{q:"42. The silent way' is a method used in teaching English as a second language Using 'The Silent way' means that ...", o:["A. Teachers speak more than their students | المعلمون يتحدثون أكثر", "B. Students speak more than their teachers | الطلاب يتحدثون أكثر من معلميهم", "C. Students learn only through body language | التعلم بلغة الجسد فقط", "D. Teachers are not allowed to speak in the classroom | يُمنع المعلمون من التحدث كلياً"], c:1, t:"في 'الطريقة الصامتة' لتدريس اللغة، هذا يعني أن ...", e:"<div class='box-hint'>في الطريقة الصامتة، يقلل المعلم كلامه لأقصى حد ليمنح الطلاب فرصة للتحدث واكتشاف اللغة (Students speak more).</div>"},
{q:"43. Fluency, accuracy, and complexity of language production when L2 learners engage in communicative tasks are considered ........ factors", o:["A. sociolinguistic | عوامل اجتماعية لغوية", "B. cognitive | عوامل معرفية ذهنية", "C. affective | عوامل وجدانية", "D. relational | عوامل علائقية"], c:1, t:"الطلاقة، والدقة، وتعقيد الإنتاج اللغوي أثناء مهام التواصل تُعتبر عوامل ........", e:"<div class='box-hint'>هذه العناصر تتعلق بالمعالجة العقلية والذهنية للغة، لذا تُصنف كعوامل معرفية (Cognitive).</div>"},

let synth = window.speechSynthesis, isExam = false, tooltip = document.getElementById('word-tooltip');

function formatInteractive(text) {
    return text.split(/([a-zA-Z0-9'-]+)/).map(tok => {
        if(/^[a-zA-Z0-9'-]+$/.test(tok)) {
            let clean = tok.toLowerCase();
            return `<b class="w-int" onclick="spk(this, event, '${clean}')">${tok}</b>`;
        }
        return tok;
    }).join('');
}

window.spk = function(el, ev, word) {
    ev.stopPropagation();
    if(!synth) return;
    synth.cancel();
    document.querySelectorAll('.w-int.active-speak').forEach(e => e.classList.remove('active-speak'));
    el.classList.add('active-speak');
    tooltip.textContent = dict[word] || "معنى سياقي";
    let rect = el.getBoundingClientRect();
    tooltip.style.left = (rect.left + window.scrollX) + 'px';
    tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
    tooltip.style.display = 'block';
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
        el.classList.remove('active-speak');
        setTimeout(() => { tooltip.style.display = 'none'; }, 1200);
    };
    synth.speak(u);
};

function build() {
    let cont = document.getElementById('q-container'); cont.innerHTML = '';
    db.forEach((qObj, idx) => {
        let row = document.createElement('div');
        row.className = 'question-row';
        row.setAttribute('data-ans', qObj.c);
        row.setAttribute('data-orig', idx);
        let opts = qObj.o.map((opt, i) => {
            let p = opt.split('|');
            return `<div class="opt-item" data-i="${i}" onclick="sel(this, event)"><div class="choice-badge">${["A","B","C","D"][i]}</div><div class="choice-content"><div class="choice-en" dir="ltr">${formatInteractive(p[0].trim())}</div>${p[1]?`<div class="choice-ar" dir="rtl">${p[1].trim()}</div>`:''}</div></div>`;
        }).join('');
        row.innerHTML = `<div class="q-text-container"><div class="q-number-lbl">${idx + 1}. </div><div class="q-text" dir="ltr">${formatInteractive(qObj.q.replace(/^\d+\.\s*/, ''))}</div></div>${qObj.t?`<div class="full-sentence-translation">📝 ${qObj.t}</div>`:''}<div class="options-inline">${opts}</div><button class="btn-answer" onclick="rev(this)">👁️ إظهار الشرح والمفاتيح</button><div class="answer-box"><div class="grammar-explanation">${qObj.e}</div></div>`;
        cont.appendChild(row);
    });
}

window.sel = function(optItem, event) {
    if(event.target.classList.contains('w-int')) return;
    let row = optItem.closest('.question-row');
    if(row.classList.contains('answered')) return; 
    let correctIndex = row.getAttribute('data-ans');
    let selectedIndex = optItem.getAttribute('data-i');
    row.classList.add('answered'); optItem.classList.add('selected');
    row.querySelectorAll('.opt-item').forEach(item => { if (item.getAttribute('data-i') === correctIndex) item.classList.add('correct'); });
    if (selectedIndex !== correctIndex) optItem.classList.add('wrong');
    if (!isExam) { let btn = row.querySelector('.btn-answer'); if (btn) btn.click(); }
};

window.rev = function(btn) {
    let box = btn.nextElementSibling;
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; btn.innerHTML = '🙈 إخفاء الشرح والمفاتيح'; } 
    else { box.style.display = 'none'; btn.innerHTML = '👁️ إظهار الشرح والمفاتيح'; }
};

window.setMode = function(m) {
    isExam = (m === 'exam');
    let c = document.getElementById('q-container');
    document.getElementById('btn-study').className = `mode-btn btn-study ${!isExam?'active-mode':''}`;
    document.getElementById('btn-exam').className = `mode-btn btn-exam ${isExam?'active-mode':''}`;
    document.getElementById('btn-result').style.display = isExam ? 'block' : 'none';
    document.getElementById('res-box').style.display = 'none';
    c.className = isExam ? 'questions-container exam-mode' : 'questions-container train-mode';
    if(synth) synth.cancel(); tooltip.style.display = 'none';
    
    let rows = Array.from(c.querySelectorAll('.question-row'));
    rows.forEach(r => {
        r.classList.remove('answered');
        r.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected','correct','wrong'));
        r.querySelector('.answer-box').style.display = 'none';
        r.querySelector('.btn-answer').innerHTML = '👁️ إظهار الشرح والمفاتيح';
    });

    if(isExam) {
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort(() => Math.random() - 0.5).forEach(o => optsCont.appendChild(o));
        });
        rows.sort(() => Math.random() - 0.5).forEach(r => c.appendChild(r));
    } else {
        rows.sort((a,b) => a.getAttribute('data-orig') - b.getAttribute('data-orig'));
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort((a,b) => a.getAttribute('data-i') - b.getAttribute('data-i')).forEach(o => optsCont.appendChild(o));
            c.appendChild(r);
        });
    }
};

window.showResult = function() {
    let rows = document.querySelectorAll('.question-row'), corr = 0, ans = 0;
    rows.forEach(r => { let s = r.querySelector('.opt-item.selected'); if(s) { ans++; if(s.classList.contains('correct')) corr++; } });
    let res = document.getElementById('res-box');
    res.innerHTML = ans < rows.length ? `⚠️ أجبت على ${ans} من ${rows.length}.<br> نتيجتك: ${corr} / ${rows.length}` : `النتيجة النهائية: ${corr} / ${rows.length}<br>🏆 ممتاز يا أستاذ حمادة!`;
    res.style.display = "block"; window.scrollTo({ top: res.offsetTop - 100, behavior: 'smooth' });
};

document.addEventListener('click', e => { if(!e.target.classList.contains('w-int')) { tooltip.style.display = 'none'; if(document.querySelector('.w-int.active-speak')) document.querySelector('.w-int.active-speak').classList.remove('active-speak'); } });
build();
})();
</script>
