        .control-buttons-row { display: flex; gap: 15px; justify-content: center; width: 100%; flex-wrap: wrap;}

        /* عناوين الأقسام */
        .exam-section-title { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); color: #facc15; padding: 12px 20px; border-radius: 8px; margin: 35px 0 20px 0; font-size: 1.5em; font-weight: 900; text-align: right; border-right: 6px solid #facc15; }

        .audio-bar { background: #e0f2fe; border: 2px solid #bae6fd; padding: 15px 20px; border-radius: 10px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;}
        .dialogue-box { background: #ffffff; padding: 15px; border-radius: 8px; border: 1px dashed #7dd3fc; margin-top: 8px; font-size: 1.1em; line-height: 2.2; direction: ltr; text-align: left; }

        .speaker-1 { color: #1e3a8a; font-weight: bold; }
        .speaker-2 { color: #059669; font-weight: bold; }
        
        .btn-toggle { background-color: #0ea5e9; color: white; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Tajawal'; font-weight: bold; font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 8px; width: fit-content;}
        .btn-toggle:hover { background-color: #0284c7; transform: translateY(-2px);}
        .btn-toggle.playing { background-color: #e11d48; }

        .q-text-container { display: flex; align-items: flex-start; gap: 15px; width: 100%; direction: ltr;}
        .q-number-span { font-size: 26px; font-weight: 900; color: #dc2626; flex-shrink: 0; padding-top: 15px; min-width: 40px; text-align: left; font-family: Arial, sans-serif;}

        .full-sentence-translation { color: #b91c1c; font-size: 1.2em; font-weight: 900; background-color: #fef2f2; border-right: 4px solid #ef4444; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; direction: rtl; text-align: right; }

        .options-inline { display: flex; gap: 15px; direction: ltr; width: 100%; margin-top: 10px; flex-wrap: nowrap; overflow-x: auto;}

        .choice-badge { background: #e2e8f0; color: #1e293b; padding: 15px; font-weight: bold; font-size: 1.2em; border-right: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; min-width: 50px; border-radius: 8px 0 0 8px;}

        .opt-item.selected .choice-badge { background-color: #3b82f6 !important; color: white !important; }
        
        .opt-item.correct { background-color: #22c55e !important; border-color: #16a34a !important; }
        .opt-item.correct .choice-badge, .opt-item.correct .choice-text, .opt-item.correct .word-group .en { color: white !important; background: transparent !important; }
        .opt-item.correct .word-group .ar { color: #fef08a !important; } 
        
        .opt-item.wrong { background-color: #ef4444 !important; border-color: #dc2626 !important; }
        .opt-item.wrong .choice-badge, .opt-item.wrong .choice-text, .opt-item.wrong .word-group .en { color: white !important; background: transparent !important; }

        .exam-mode .btn-toggle { display: flex !important; } 
        .exam-mode .word-group .ar { display: none !important; }

        function buildExamApp() {
            let container = document.getElementById('exam-container');
            container.innerHTML = '';

            let allQs = [];

            // 1. قسم الاستماع
            let lHeader = document.createElement('div');
            lHeader.className = 'exam-section-title';
            lHeader.innerText = "Listening Section (9 Questions) - الاستماع (حوارات ثنائية حصرية جديدة)";
            container.appendChild(lHeader);

            examData.listening.forEach((pass, pIdx) => {
                let audioBar = document.createElement('div');
                audioBar.className = 'audio-bar';
                let audioId = `audio-m6-${pIdx}`;
                
                let dialogueHtml = `<div class="dialogue-box">`;
                pass.dialogue.forEach(line => {
                    let speakerClass = line.speaker === pass.dialogue[0].speaker ? 'speaker-1' : 'speaker-2';
                    dialogueHtml += `<div class="dialogue-line"><span class="${speakerClass}">${line.speaker}:</span> ${renderClickableHtml(line.text)}</div>`;
                });
                dialogueHtml += `</div>`;

                audioBar.innerHTML = `
                    <div style="font-weight:bold; color:#0369a1; margin-bottom:5px;">🎧 ${pass.title}</div>
                    <button class="audio-btn btn-toggle" id="audio-btn-${audioId}" onclick="toggleAudio('${audioId}', \`${pass.audioText}\`)">🔊 تشغيل الحوار صوتياً (Play Audio)</button>
                    ${dialogueHtml}
                `;
                container.appendChild(audioBar);

                pass.questions.forEach((q, qIdx) => {
                    let globalId = `l-m6-${pIdx}-${qIdx}-${Math.random().toString(36).substr(2,4)}`;
                    q.globalId = globalId;
                    container.appendChild(createQuestionCard(q, qIdx));
                    allQs.push(q);
                });
            });

            // 2. قسم القراءة
            let rHeader = document.createElement('div');
            rHeader.className = 'exam-section-title';
            rHeader.innerText = "Reading Section (16 Questions) - القراءة (قطع حصرية جديدة)";
            container.appendChild(rHeader);

            examData.reading.forEach((pass, pIdx) => {
                let pBox = document.createElement('div');

                });
                pBox.innerHTML = pHtml;
                container.appendChild(pBox);

                let detailQs = pass.questions.filter(q => q.type === 'detail');
                let mainIdeaQs = pass.questions.filter(q => q.type === 'mainIdea');

                let subHeaderD = document.createElement('div');

                container.appendChild(subHeaderM);

                mainIdeaQs.forEach((q, qIdx) => {
                    let globalId = `r-m-m6-${pIdx}-${qIdx}-${Math.random().toString(36).substr(2,4)}`;
                    q.globalId = globalId;
                    container.appendChild(createQuestionCard(q, qIdx));
                    allQs.push(q);
                });
            });

            // 3. قسم القواعد
            let gHeader = document.createElement('div');
            gHeader.className = 'exam-section-title';
            gHeader.innerText = "Grammar Section (8 Questions) - قواعد اللغة (أسئلة حصرية جديدة)";
            container.appendChild(gHeader);

            examData.grammar.forEach((q, idx) => {
                let globalId = `g-m6-${idx}-${Math.random().toString(36).substr(2,4)}`;
                q.globalId = globalId;
                container.appendChild(createQuestionCard(q, idx));
                allQs.push(q);
            });

            // 4. قسم المفردات
            let vHeader = document.createElement('div');
            vHeader.className = 'exam-section-title';
            vHeader.innerText = "Vocabulary Section (7 Questions) - المفردات والكلمات (أسئلة حصرية جديدة)";
            container.appendChild(vHeader);

            examData.vocab.forEach((q, idx) => {
                let globalId = `v-m6-${idx}-${Math.random().toString(36).substr(2,4)}`;
                q.globalId = globalId;
                container.appendChild(createQuestionCard(q, idx));
                allQs.push(q);
            });

            // 5. قسم مهارات الكتابة الأكاديمية
            let wHeader = document.createElement('div');
            wHeader.className = 'exam-section-title';
            wHeader.innerText = "Academic Writing Skills (5 Questions) - توصيل أنصاف الجمل (أسئلة حصرية جديدة)";
            container.appendChild(wHeader);

            examData.writing.forEach((q, idx) => {
                let globalId = `w-m6-${idx}-${Math.random().toString(36).substr(2,4)}`;
                q.globalId = globalId;
                container.appendChild(createQuestionCard(q, idx));
                allQs.push(q);
            });
        }

        function renderClickableHtml(text) {
            let pairs = text.split(' ').map(p => p.trim()).filter(p => p !== '');
            return pairs.map(pair => {
                let cleanW = pair.replace(/[^a-zA-Z0-9'-]/g, '');
                let arW = getTranslation(cleanW);
                let safeWord = cleanW.replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                let arHtml = arW !== "" ? `<span class="ar">${arW}</span>` : `<span class="ar" style="display:none;"></span>`;
                return `<span class="word-group" data-speak="${safeWord}">${arHtml}<span class="en">${pair}</span></span>`;
            }).join(' ');
        }

        function createQuestionCard(qObj, index) {
            let block = document.createElement('div');
            block.className = 'question-row';
            block.id = `q-${qObj.globalId}`;
            
            let originalCorrectOptStr = qObj.o[qObj.correctIdx].split('|')[0].replace(/_/g, ' ').trim();
            block.setAttribute('data-ans', originalCorrectOptStr);

            let pairs = qObj.q.split(' ').map(p => p.trim()).filter(p => p !== '');
            let wordsHtml = pairs.map(pair => {
                let pSplit = pair.split('|');
                let enW = pSplit[0]; 
                let cleanW = enW.replace(/[^a-zA-Z0-9'-]/g, ''); 
                let arW = getTranslation(cleanW); 
                let safeWord = cleanW.replace(/"/g, '&quot;').replace(/'/g, '&apos;'); 
                
                if(enW === '........' || enW === '........|........') {
                    return `<span class="word-group" data-speak=""><span class="ar" style="display:none;"></span><span class="en blank-space">........</span></span>`;
                }
                let missingHtml = enW.replace(/_/g, '<span class="missing-letter">_</span>');
                let arHtml = arW !== "" ? `<span class="ar">${arW}</span>` : `<span class="ar" style="display:none;"></span>`;
                return `<span class="word-group" data-speak="${safeWord}">${arHtml}<span class="en">${missingHtml}</span></span>`;
            }).join(' ');

            let indexedOpts = qObj.o.map((opt, idx) => ({ optStr: opt, isCorrect: (idx === qObj.correctIdx) }));
            indexedOpts.sort(() => Math.random() - 0.5);

            let letters = ["A", "B", "C", "D"];
            let optsHtml = `<div class="options-inline" id="opts-area-${qObj.globalId}">` + indexedOpts.map((item, i) => {
                let optPairs = item.optStr.trim().split('|')[0].split(' ').filter(p => p !== '');
                let optWordsHtml = optPairs.map(op => {
                    let cw = op.replace(/[^a-zA-Z0-9'-]/g, '');
                    let arTrans = getTranslation(cw);
                    let safeWord = cw.replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                    let arHtml = arTrans !== "" ? `<span class="ar">${arTrans}</span>` : `<span class="ar" style="display:none;"></span>`;
                    return `<span class="word-group" data-speak="${safeWord}">${arHtml}<span class="en">${op.replace(/_/g, ' ')}</span></span>`;
                }).join(' ');
                
                let isCorrAttr = item.isCorrect ? 'true' : 'false';
                let cleanOptVal = item.optStr.split('|')[0].replace(/_/g, ' ').trim();
                return `<div class="opt-item" data-correct="${isCorrAttr}" data-opt-val="${cleanOptVal}" onclick="selectOption(this, event)"><div class="choice-badge">${letters[i]}</div><div class="choice-text">${optWordsHtml}</div></div>`;
            }).join('') + `</div>`;

            let translationHtml = (qObj.t) ? `<div class="full-sentence-translation">📝 ${qObj.t}</div>` : '';
            
            block.innerHTML = `
                <div class="q-text-container">
                    <span class="q-number-span" id="num-${qObj.globalId}">${index + 1}. </span>
                    <div class="q-text">${wordsHtml}</div>
                </div>
                ${translationHtml}
                ${optsHtml}
                <div class="answer-action-container">
                    <button class="btn-answer" id="btn-ans-${qObj.globalId}" onclick="window.revealAnswer('${qObj.globalId}')">👁️ إظهار الإجابة والشرح</button>
                </div>
                <div class="answer-box" id="ans-box-${qObj.globalId}">
                    <div class="correct-word-text">الإجابة الصحيحة: <span class="en-ans" style="color:#059669; font-weight:bold;">${originalCorrectOptStr}</span></div>
                    <div class="grammar-explanation">💡 <strong>الشرح:</strong> <span dir="rtl">${qObj.e}</span></div>
                </div>
            `;
            return block;
        }

        window.toggleAudio = function(audioId, text) {
            if(!synth) return;
            let btn = document.getElementById(`audio-btn-${audioId}`);
            if (synth.speaking) {
                synth.cancel();
                btn.innerHTML = '🔊 تشغيل الحوار صوتياً (Play Audio)';
                btn.classList.remove('playing');
                return;
            }
            synth.cancel();
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.85;
            btn.innerHTML = '⏹ إيقاف الحوار (Stop)';
            btn.classList.add('playing');
            u.onend = () => { btn.innerHTML = '🔊 تشغيل الحوار صوتياً (Play Audio)'; btn.classList.remove('playing'); };
            u.onerror = () => { btn.innerHTML = '🔊 تشغيل الحوار صوتياً (Play Audio)'; btn.classList.remove('playing'); };
            synth.speak(u);
        };

        window.setMode = function(mode) {
            let pageEl = document.querySelector('.page');
            let btnStudy = document.getElementById('btn-study');
            let btnExam = document.getElementById('btn-exam');
            
            if(synth) synth.cancel();
            document.getElementById('res-box').style.display = 'none';

            if (mode === 'exam') {
                pageEl.classList.add('exam-mode');
                btnExam.classList.add('active-mode');
                btnStudy.classList.remove('active-mode');
            } else {
                pageEl.classList.remove('exam-mode');
                btnStudy.classList.add('active-mode');
                btnExam.classList.remove('active-mode');
            }
        };

        window.selectOption = function(optItem, event) {
            if (event && event.target.closest('.word-group')) return;
            let row = optItem.closest('.question-row');
            if(row.classList.contains('answered')) return; 
            
            let isCorrectChoice = (optItem.getAttribute('data-correct') === 'true');
            row.classList.add('answered'); 
            optItem.classList.add('selected');
            
            row.querySelectorAll('.opt-item').forEach(item => {
                if (item.getAttribute('data-correct') === 'true') item.classList.add('correct');
            });
            if (!isCorrectChoice) optItem.classList.add('wrong');
        };

        document.addEventListener('click', function(e) {
            if(document.querySelector('.page').classList.contains('exam-mode')) return;
            let wg = e.target.closest('.word-group');
            if (wg) {
                let speakTextAttr = wg.getAttribute('data-speak');
                if (speakTextAttr && synth) {
                    synth.cancel();
                    document.querySelectorAll('.word-group.highlight').forEach(el => el.classList.remove('highlight'));
                    wg.classList.add('highlight');
                    let txt = speakTextAttr.replace(/[\._]/g, '').trim();
                    if(txt) {
                        let u = new SpeechSynthesisUtterance(txt);
                        u.lang = 'en-US'; u.rate = 0.85;
                        u.onend = () => wg.classList.remove('highlight');
                        synth.speak(u);
                        setTimeout(() => wg.classList.remove('highlight'), 1200);
                    }
                }
            }
        });

        window.revealAnswer = function(id) {
            let box = document.getElementById(`ans-box-${id}`); 
            let btn = document.getElementById(`btn-ans-${id}`);
            if (box.style.display === 'none' || !box.style.display) { 
                box.style.display = 'block'; 
                btn.innerHTML = '🙈 إخفاء الإجابة والشرح'; 
            } else { 
                box.style.display = 'none'; 
                btn.innerHTML = '👁️ إظهار الإجابة والشرح'; 
            }
        };

        window.showExamResult = function() {
            let rows = document.querySelectorAll('.question-row');
            let correctCount = 0; let answeredCount = 0; let totalCount = rows.length;
            
            rows.forEach(row => {
                let selectedOpt = row.querySelector('.opt-item.selected');
                if (selectedOpt) {
                    answeredCount++;
                    if(selectedOpt.getAttribute('data-correct') === 'true') correctCount++;
                }
            });
            
            let resEl = document.getElementById('res-box');
            let msg = `النتيجة النهائية: ${correctCount} من ${totalCount}<br>`;
            if(correctCount === totalCount) msg += "🏆 أداء مذهل! إجابات مثالية!";
            else if(correctCount >= totalCount/2) msg += "🌟 أداء ممتاز! استمر هكذا!";
            else msg += "💪 حاول مجدداً لرفع درجتك!";
            
            resEl.innerHTML = msg;
            resEl.style.display = "block";
            resEl.scrollIntoView({behavior: 'smooth'});
        };

        buildExamApp();

    } catch (e) {
        document.body.innerHTML += '<div style="color:white; background:#e74c3c; padding:20px; font-size:18px; text-align:right; direction:rtl; margin-top:20px; border-radius:10px;"><b>خطأ برمجي:</b><br>' + e.message + '</div>';
    }
})();
</script>

</body>
