<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق كود الديب الماسي</title>
    <style>
        :root {
            --primary-blue: #004085;
            --primary-red: #dc3545;
            --success-green: #28a745;
            --info-cyan: #17a2b8;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .app-container {
            width: 100%; max-width: 800px; background: var(--card-bg);
            border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden; margin-top: 20px; margin-bottom: 30px;
        }
        .header {
            background-color: var(--primary-blue); color: white; padding: 20px; text-align: center;
        }
        .header h2 { margin: 0 0 10px 0; font-size: 1.8rem; }
        .header p { margin: 0; font-size: 1.1rem; opacity: 0.9; }
        .header select {
            padding: 10px; font-size: 1.2rem; border-radius: 5px; border: 2px solid white;
            background: var(--primary-blue); color: white; margin-top: 15px; cursor: pointer;
        }
        .control-panel {
            display: flex; justify-content: space-between; padding: 15px 20px;
            background-color: #e9ecef; border-bottom: 2px solid #ddd;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .score-board { display: flex; gap: 15px; font-size: 1.2rem; font-weight: bold; }
        .score-correct { color: var(--success-green); }
        .score-wrong { color: var(--primary-red); }
        .mode-toggle {
            padding: 8px 15px; font-size: 1rem; background-color: #6c757d; color: white;
            border: none; border-radius: 5px; cursor: pointer;
        }
        .mode-toggle.auto { background-color: var(--primary-blue); }
        .flashcard { padding: 30px 20px; text-align: center; position: relative; }
        .progress-badge {
            background-color: var(--info-cyan); color: white; padding: 8px 20px;
            border-radius: 25px; font-size: 1.2rem; font-weight: bold;
            display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .word-container {
            display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 20px;
        }
        .english-word {
            font-size: 3.5rem; color: var(--primary-blue); font-weight: bold; margin: 0; direction: ltr;
        }
        .audio-btn {
            font-size: 2rem; background: none; border: none; cursor: pointer;
            color: var(--primary-blue); transition: transform 0.2s;
        }
        .audio-btn:hover { transform: scale(1.1); }
        .sentence-wrapper {
            font-size: 2rem; color: #333; margin-bottom: 30px; direction: ltr; font-weight: bold;
            padding: 15px; border-radius: 10px; border-left: 5px solid var(--primary-blue);
            transition: background-color 0.3s ease; background-color: #f8f9fa;
        }
        .target-word { color: var(--primary-red); font-weight: bold; }
        .reading-highlight { background-color: yellow !important; }
        
        .choices {
            display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto;
        }
        .choice-btn {
            padding: 15px; font-size: 1.3rem; font-weight: bold; background-color: var(--primary-blue);
            color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .choice-btn:hover { background-color: #0056b3; }
        .choice-btn.correct { background-color: var(--success-green) !important; }
        .choice-btn.wrong { background-color: var(--primary-red) !important; }

        .nav-buttons {
            display: flex; justify-content: center; gap: 20px; margin-top: 30px;
        }
        .nav-btn {
            padding: 12px 30px; font-size: 1.2rem; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        #prev-btn { background-color: #6c757d; color: white; }
        #next-btn { background-color: #ffc107; color: #333; }
        .nav-btn:hover:not(:disabled) { opacity: 0.8; transform: scale(1.05); }
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .footer { text-align: center; padding: 15px; background: var(--primary-blue); color: white; margin-top: 20px; }
    </style>
</head>

            <p>مدارس آفاق الهداية الحديثة للبنين - جدة</p>

        </div>

        <div class="control-panel">
            <div class="score-board">
                <span class="score-correct">صح: <span id="correct-counter">0</span></span> | 
                <span class="score-wrong">خطأ: <span id="wrong-counter">0</span></span>
            </div>
            <button id="mode-btn" class="mode-toggle auto" onclick="toggleMode()">الوضع: تلقائي ⚡</button>
        </div>

        <div class="flashcard">
            <div class="progress-badge">الكلمة: <span id="current-word-num">1</span> / <span id="total-word-count">100</span></div>

            <div class="word-container">
                <h1 class="english-word" id="word-display">Word</h1>
                <button class="audio-btn" onclick="playAudio()" title="إعادة النطق">🔊</button>
            </div>
            
            <div class="sentence-wrapper" id="sentence-display"></div>
            
            <div class="choices" id="choices-container"></div>
            
            <div class="nav-buttons">
                <button id="prev-btn" class="nav-btn" onclick="prevWord()">⏮️ السابق</button>
                <button id="next-btn" class="nav-btn" onclick="nextWord()">التالي ⏭️</button>
            </div>
        </div>
        <div class="footer">مدارس آفاق الهداية الحديثة للبنين - جدة</div>
    </div>

                ["happy", "I am happy to learn.", "سعيد", "حزين", "مريض"],
                ["proud", "I am proud of you.", "فخور", "خجلان", "حزين"],
                ["star", "You get a gold star.", "نجمة", "قمر", "شمس"],
                ["prize", "You win a nice prize.", "جائزة", "عقاب", "كتاب"],
                ["gift", "Take this small gift.", "هدية", "تذكرة", "حقيبة"],
                ["clap", "Let us clap for him.", "يصفق", "يبكي", "ينام"],
                ["smile", "Please smile.", "يبتسم", "يبكي", "يغضب"],
                ["work", "Good teamwork.", "عمل", "نوم", "لعب"]
            ]
        };

        let currentUnit = "Unit1";
        let wordList = [];
        let currentIndex = 0;
        let isAutoMode = true;
        let correctCount = 0;
        let wrongCount = 0;
        let answered = false;

        function highlightTargetWord(word, sentence) {
            let escapedWord = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            let regex = new RegExp("\\b(" + escapedWord + ")\\b", "gi");
            return sentence.replace(regex, "<span class='target-word'>$1</span>");
        }

        function changeUnit() {
            currentUnit = document.getElementById('unit-select').value;
            wordList = rawData[currentUnit].map(item => {
                return {
                    word: item[0],
                    rawSentence: item[1],
                    sentence: highlightTargetWord(item[0], item[1]),
                    choices: [item[2], item[3], item[4]],
                    answer: item[2]
                };
            });
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            updateScoreBoard();
            loadWord();
        }

        function loadWord() {
            answered = false;
            let currentData = wordList[currentIndex];
            
            document.getElementById('current-word-num').innerText = currentIndex + 1;
            document.getElementById('total-word-count').innerText = wordList.length;
            
            document.getElementById('word-display').innerText = currentData.word;
            document.getElementById('sentence-display').innerHTML = currentData.sentence;
            
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            let shuffledChoices = [...currentData.choices].sort(() => Math.random() - 0.5);
            
            shuffledChoices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice, currentData.answer);
                choicesContainer.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            
            playAudio();
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let currentData = wordList[currentIndex];
                let textToSpeak = `${currentData.word}. ${currentData.rawSentence}.`;
                
                let utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.6; 
                
                const sentenceWrapper = document.getElementById('sentence-display');
                utterance.onstart = () => sentenceWrapper.classList.add('reading-highlight');
                utterance.onend = () => sentenceWrapper.classList.remove('reading-highlight');

                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAnswer(btn, selected, correctAnswer) {
            if (answered) return;
            answered = true;
            const allButtons = document.querySelectorAll('.choice-btn');
            
            if (selected === correctAnswer) {
                btn.classList.add('correct');
                correctCount++;
                if (isAutoMode) {
                    setTimeout(() => nextWord(), 1500);
                }
            } else {
                btn.classList.add('wrong');
                wrongCount++;
                allButtons.forEach(b => {
                    if (b.innerText === correctAnswer) b.classList.add('correct');
                });
            }
            updateScoreBoard();
        }

        function nextWord() {
            if (currentIndex < wordList.length - 1) {
                currentIndex++;
                loadWord();
            } else {
                alert(`انتهت كلمات هذه الوحدة يا بطل!\nالإجابات الصحيحة: ${correctCount}\nالأخطاء: ${wrongCount}`);
                currentIndex = 0;
                loadWord();
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                loadWord();
            }
        }

        function updateScoreBoard() {
            document.getElementById('correct-counter').innerText = correctCount;
            document.getElementById('wrong-counter').innerText = wrongCount;
        }

        function toggleMode() {
            isAutoMode = !isAutoMode;
            let modeBtn = document.getElementById('mode-btn');
            if (isAutoMode) {
                modeBtn.innerText = "الوضع: تلقائي ⚡";
                modeBtn.classList.add('auto');
            } else {
                modeBtn.innerText = "الوضع: يدوي ✋";
                modeBtn.classList.remove('auto');
            }
        }

        // تشغيل الوحدة الأولى فور التحميل دون الحاجة لضغط زر بداية
        window.onload = () => {
            changeUnit();
        };
    </script>
