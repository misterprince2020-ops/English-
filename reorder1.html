<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 3: Rearrange the Sentences - Team Together 5</title>
<style>
  :root {
    --primary: #1e3c72;
    --accent: #e67e22;
    --success: #27ae60;
    --error: #d63031;
    --bg: #f4f7f6;
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: var(--bg); margin: 0; padding: 20px; direction: rtl; }
  .container { max-width: 920px; margin: auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
  .header h2 { margin: 0; color: var(--primary); font-size: 22px; }
  .badge { background: #eef2ff; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-weight: bold; }

  /* Mode Switcher */
  .mode-switch { display: flex; gap: 10px; margin-bottom: 25px; justify-content: center; }
  .mode-btn { border: none; padding: 10px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
  .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(30,60,114,0.3); }
  .mode-btn:not(.active) { background: #e0e0e0; color: #555; }

  /* Sentence Card */
  .sentence-card { background: #fafafa; border: 1.5px solid #e1e8ed; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
  .q-num { font-weight: bold; color: var(--primary); font-size: 16px; margin-bottom: 12px; display: block; }

  /* Study Guide Box */
  .study-guide { 
    background: #fffcf4; 
    border-right: 4px solid var(--accent); 
    padding: 16px; 
    border-radius: 8px; 
    margin-bottom: 16px; 
    direction: ltr; 
    text-align: left; 
  }
  
  .guide-words-row { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 12px; 
    align-items: flex-end; 
    margin-bottom: 14px;
  }
  
  /* كل كلمة مع ترجمتها فوقها كعمود واحد */
  .word-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .fixed-ar-trans {
    font-size: 13px;
    font-weight: bold;
    color: #444;
    direction: rtl;
    text-align: center;
    min-height: 18px;
  }

  .study-word-btn { 
    padding: 6px 12px; 
    background: white; 
    border: 1.5px solid #ccc; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 17px; 
    font-weight: 600; 
    color: #2c3e50; 
    transition: 0.2s; 
  }
  .study-word-btn:hover { background: #fee; border-color: var(--error); color: var(--error); }
  .study-word-btn.active-red { background: var(--error) !important; color: white !important; border-color: var(--error) !important; }

  /* الترجمة الكاملة باللون الأحمر مباشرة */
  .full-sentence-ar { 
    font-size: 16px; 
    font-weight: bold; 
    color: var(--error); 
    direction: rtl; 
    text-align: right; 
    border-top: 1px dashed #e0d0b0; 
    padding-top: 10px; 
  }

  /* Interactive Build Area */
  .target-zone {
    min-height: 54px; background: #fff; border: 2px dashed #b0bec5; border-radius: 8px;
    display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; align-items: center; margin-bottom: 14px; direction: ltr;
  }
  .word-bank { display: flex; flex-wrap: wrap; gap: 8px; direction: ltr; min-height: 44px; }
  
  .chip {
    padding: 8px 16px; background: #fff; border: 1.5px solid #2980b9; color: #2980b9;
    font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; user-select: none;
    transition: 0.2s transform, 0.2s background-color;
  }
  .chip:active { transform: scale(0.95); }
  .chip.correct { background: var(--success); border-color: var(--success); color: white; cursor: default; }
  .chip.shake {
    animation: shakeAnim 0.4s ease-in-out;
    background: var(--error) !important; border-color: var(--error) !important; color: white !important;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  /* Score board */
  .score-card { display: none; text-align: center; padding: 15px; background: #e8f8f5; border-radius: 8px; margin-top: 20px; font-size: 18px; font-weight: bold; color: var(--success); }
  .reset-btn { display: inline-block; padding: 4px 10px; font-size: 13px; background: #e2e8f0; border: none; border-radius: 4px; cursor: pointer; color: #333; }
  .reset-btn:hover { background: #cbd5e1; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Part 3: Rearrange the Sentences</h2>
    <span class="badge">Team Together 5 - 5 Marks</span>
  </div>

  <!-- Toggle Modes -->
  <div class="mode-switch">
    <button class="mode-btn active" id="btn-study" onclick="switchMode('study')">وضع المذاكرة (Study Mode)</button>
    <button class="mode-btn" id="btn-quiz" onclick="switchMode('quiz')">وضع الاختبار (Quiz Mode)</button>
  </div>

  <div id="exercise-list"></div>

  <div class="score-card" id="quiz-score-box">
    الدرجة النهائية: <span id="score-text">0 / 5</span>
  </div>
</div>

<script>
const data = [
  {
    id: 1,
    arabicFull: "نحن عادة نلعب كرة الطائرة بعد المدرسة.",
    words: [
      { en: "We", ar: "نحن" },
      { en: "usually", ar: "عادةً" },
      { en: "play", ar: "نلعب" },
      { en: "volleyball", ar: "كرة الطائرة" },
      { en: "after", ar: "بعد" },
      { en: "school", ar: "المدرسة" },
      { en: ".", ar: "" }
    ]
  },
  {
    id: 2,
    arabicFull: "مارك يؤدي واجبه المدرسي الآن في هذه اللحظة.",
    words: [
      { en: "Mark", ar: "مارك" },
      { en: "is", ar: "يكون" },
      { en: "doing", ar: "يحل" },
      { en: "his", ar: "خاصته" },
      { en: "homework", ar: "الواجب" },
      { en: "right", ar: "حالاً" },
      { en: "now", ar: "الآن" },
      { en: ".", ar: "" }
    ]
  },
  {
    id: 3,
    arabicFull: "كم مرة تذهب لركوب الدراجة؟",
    words: [
      { en: "How", ar: "كيف" },
      { en: "often", ar: "غالباً" },
      { en: "do", ar: "تفعل" },
      { en: "you", ar: "أنت" },
      { en: "go", ar: "تذهب" },
      { en: "cycling", ar: "لركوب الدراجة" },
      { en: "?", ar: "" }
    ]
  },
  {
    id: 4,
    arabicFull: "هي لا تذهب للتزلج في فصل الشتاء.",
    words: [
      { en: "She", ar: "هي" },
      { en: "doesn't", ar: "لا" },
      { en: "go", ar: "تذهب" },
      { en: "skiing", ar: "للتزلج" },
      { en: "in", ar: "في" },
      { en: "winter", ar: "الشتاء" },
      { en: ".", ar: "" }
    ]
  },
  {
    id: 5,
    arabicFull: "هل يلعبون تنس الطاولة في هذه اللحظة؟",
    words: [
      { en: "Are", ar: "هل" },
      { en: "they", ar: "هم" },
      { en: "playing", ar: "يلعبون" },
      { en: "table tennis", ar: "تنس الطاولة" },
      { en: "at", ar: "في" },
      { en: "the", ar: "الـ" },
      { en: "moment", ar: "اللحظة" },
      { en: "?", ar: "" }
    ]
  }
];

let currentMode = 'study';
let progress = {};

// نطق الكلمة
function speak(text) {
  if (currentMode === 'quiz' || text === '.' || text === '?') return;
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
  }
}

// تبديل الأوضاع
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('btn-study').classList.toggle('active', mode === 'study');
  document.getElementById('btn-quiz').classList.toggle('active', mode === 'quiz');
  document.getElementById('quiz-score-box').style.display = (mode === 'quiz') ? 'block' : 'none';
  render();
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

// رسم واجهة التمارين
function render() {
  const container = document.getElementById('exercise-list');
  container.innerHTML = '';
  progress = {};

  data.forEach((item, index) => {
    progress[item.id] = { nextIndex: 0, completed: false };

    const card = document.createElement('div');
    card.className = 'sentence-card';

    // صندوق المذاكرة (يحتوي على الكلمات وترجماتها الثابتة فوقها + الترجمة الكاملة بالأحمر)
    let studyHtml = '';
    if (currentMode === 'study') {
      const wordsMarkup = item.words.map((w, wIdx) => `
        <div class="word-unit">
          <span class="fixed-ar-trans">${w.ar}</span>
          <button type="button" class="study-word-btn" onclick="handleWordGuideClick(${item.id}, ${wIdx}, this)">${w.en}</button>
        </div>
      `).join('');

      studyHtml = `
        <div class="study-guide">
          <div class="guide-words-row">${wordsMarkup}</div>
          <div class="full-sentence-ar">${item.arabicFull}</div>
        </div>
      `;
    }

    card.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <span class="q-num">السؤال (${index + 1})</span>
        <button class="reset-btn" onclick="resetQuestion(${item.id})">إعادة المحاولة ↺</button>
      </div>
      ${studyHtml}
      <div class="target-zone" id="target-${item.id}"></div>
      <div class="word-bank" id="bank-${item.id}"></div>
    `;

    container.appendChild(card);
    populateBank(item);
  });

  updateScore();
}

// عرض الكلمات المبعثرة
function populateBank(item) {
  const bank = document.getElementById(`bank-${item.id}`);
  bank.innerHTML = '';
  const shuffled = shuffle(item.words.map((w, i) => ({ text: w.en, correctIndex: i })));

  shuffled.forEach(wObj => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = wObj.text;
    chip.onclick = () => handleChipClick(item.id, wObj, chip);
    bank.appendChild(chip);
  });
}

// الضغط على الكلمة في الدليل بوضع المذاكرة
function handleWordGuideClick(itemId, wordIndex, element) {
  const item = data.find(q => q.id === itemId);
  const wordObj = item.words[wordIndex];

  // إضاءة الكلمة باللون الأحمر
  element.closest('.sentence-card').querySelectorAll('.study-word-btn').forEach(el => el.classList.remove('active-red'));
  element.classList.add('active-red');

  speak(wordObj.en);
}

// الضغط على الكلمة لترتيبها
function handleChipClick(itemId, wordObj, chipElement) {
  const state = progress[itemId];
  const item = data.find(q => q.id === itemId);

  // إذا كانت الكلمة صحيحة في الترتيب التالي
  if (wordObj.correctIndex === state.nextIndex) {
    const target = document.getElementById(`target-${itemId}`);
    chipElement.classList.add('correct');
    target.appendChild(chipElement);
    chipElement.onclick = null; // تثبيت الكلمة

    if (currentMode === 'study') {
      speak(wordObj.text);
    }

    state.nextIndex++;

    // اكتمال الجملة
    if (state.nextIndex === item.words.length) {
      state.completed = true;
      if (currentMode === 'study') {
        const fullEng = item.words.map(w => w.en).join(' ').replace(' .', '.').replace(' ?', '?');
        setTimeout(() => speak(fullEng), 400);
      }
      updateScore();
    }
  } else {
    // كلمة خاطئة: اهتزاز ورفض باللون الأحمر
    chipElement.classList.add('shake');
    setTimeout(() => {
      chipElement.classList.remove('shake');
    }, 450);
  }
}

// إعادة ضبط السؤال
function resetQuestion(itemId) {
  const item = data.find(q => q.id === itemId);
  progress[itemId] = { nextIndex: 0, completed: false };
  document.getElementById(`target-${itemId}`).innerHTML = '';
  populateBank(item);
  updateScore();
}

// تحديث الدرجة في وضع الاختبار
function updateScore() {
  if (currentMode !== 'quiz') return;
  let score = 0;
  data.forEach(item => {
    if (progress[item.id] && progress[item.id].completed) {
      score += 1;
    }
  });
  document.getElementById('score-text').innerText = `${score} / 5`;
}

// بدء التشغيل
render();
</script>
</body>
</html>
