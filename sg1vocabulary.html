<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>كلمات ورقة العمل الأولى</title>
  <style>
    :root {
      --primary: #0284c7;
      --secondary: #0369a1;
      --bg: #f0f9ff;
      --card: #ffffff;
      --accent: #059669;
      --danger: #dc2626;
      --text: #0f172a;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    
    header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white; padding: 24px; border-radius: 16px; text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-bottom: 20px;
    }
    h1 { margin: 0 0 8px; font-size: 1.8rem; }

    /* شريط المجموعات */
    .unit-nav { display: flex; gap: 10px; justify-content: center; margin-bottom: 25px; flex-wrap: wrap; }
    .unit-btn {
      background: white; border: 2px solid var(--secondary); color: var(--secondary);
      padding: 10px 20px; border-radius: 30px; font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: all 0.1s ease;
    }
    .unit-btn:hover, .unit-btn.active {
      background: var(--secondary); color: white; box-shadow: 0 4px 10px rgba(3, 105, 161, 0.3);
    }

    .section-card {
      background: var(--card); border-radius: 16px; padding: 24px; margin-bottom: 25px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e0f2fe; position: relative;
    }
    .section-title {
      color: var(--primary); border-bottom: 2px solid #e0f2fe; padding-bottom: 10px;
      margin-top: 0; font-size: 1.3rem;
    }

    .autoplay-btn {
      background: var(--accent); color: white; border: none; padding: 15px 20px;
      font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold;
      display: inline-block; margin-bottom: 15px; transition: 0.15s; width: 100%;
    }
    .autoplay-btn:hover { background: #047857; }
    .autoplay-btn.playing { background: var(--danger); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

    /* شبكة الكلمات */
    .vocab-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .vocab-row {
      display: flex;
      flex-direction: row;
      gap: 10px;
      background: #f8fafc;
      padding: 12px;
      border: 3px solid #bae6fd;
      border-radius: 14px;
      direction: ltr; 
      align-items: stretch;
    }

    .vocab-item {
      position: relative;
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff; border: 2px solid #e2e8f0; padding: 20px 10px;
      border-radius: 10px; cursor: pointer; text-align: center;
      transition: background-color 0.1s ease, border-color 0.1s ease;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    }
    
    .vocab-item.active-yellow {
      background-color: #fef08a !important; 
      border-color: #eab308 !important;
    }

    .vocab-item.active-yellow .word-ar {
      display: block !important; color: #dc2626 !important;
    }

    /* زر تكرار الصف */
    .loop-btn {
      flex-basis: 90px;
      flex-shrink: 0;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .loop-btn:hover { background: #0369a1; }
    .loop-btn.playing { background: var(--danger); animation: pulse 1.5s infinite; }

    .vocab-num { 
      position: absolute; top: 8px; left: 10px;
      color: #94a3b8; font-weight: bold; font-size: 1.2rem; 
    }

    .vocab-emoji { font-size: 4rem; margin-bottom: 10px; width: 100%; text-align: center; line-height: 1; }
    .word-en { font-weight: 900; font-size: 1.8rem; color: #0f172a; text-align: center; width: 100%; margin-bottom: 5px; }
    .word-ar { 
      display: none; font-size: 1.6rem; font-weight: bold; 
      direction: rtl; text-align: center; width: 100%; margin-top: 10px; 
      padding-top: 10px; border-top: 2px dashed #bae6fd; 
    }

    /* تنسيق الاختبار بالصور */
    .quiz-question {
      background: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px;
      padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .q-text { text-align: center; margin-bottom: 20px; }
    .q-word { 
      color: var(--secondary); font-size: 2.5rem; font-weight: 900; 
      display: inline-block; cursor: pointer; text-decoration: underline dashed var(--primary);
      padding: 5px 15px; border-radius: 10px; transition: 0.2s;
    }
    .q-word:hover { background: #e0f2fe; }
    
    .q-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; direction: ltr;} 
    @media (max-width: 600px) {
      .q-options { grid-template-columns: 1fr 1fr; }
      .vocab-row { flex-direction: column; direction: rtl; }
      .loop-btn { padding: 15px; flex-direction: row; gap: 10px; }
    }
    
    .opt-label {
      background: #f8fafc; border: 2px solid #cbd5e1;
      padding: 15px; border-radius: 12px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 15px; transition: 0.1s ease; 
      font-size: 3.5rem; /* تكبير الرمز التعبيري جداً */
    }
    .opt-label input { transform: scale(1.8); cursor: pointer; }
    .opt-label:hover { border-color: var(--secondary); background: #f0f9ff; transform: translateY(-2px); }
    
    /* الألوان عند التصحيح */
    .correct-ans { border-color: var(--accent) !important; background-color: #d1fae5 !important; box-shadow: 0 0 10px rgba(5,150,105,0.4); }
    .wrong-ans { border-color: var(--danger) !important; background-color: #fee2e2 !important; }

    .action-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
    .action-btn {
      background: var(--primary); color: white; border: none; padding: 15px 30px;
      font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: center;
      transition: 0.1s ease;
    }
    .action-btn:hover { background: #0369a1; }
    .reset-btn { background: #f59e0b; }
    .reset-btn:hover { background: #d97706; }
    .score-box { text-align: center; font-size: 1.6rem; font-weight: bold; margin-top: 15px; color: var(--primary); }
    .scroll-box { max-height: 700px; overflow-y: auto; padding-right: 5px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>كلمات ورقة العمل الأولى</h1>
  </header>

  <div class="unit-nav" id="sectionNav">
    <button class="unit-btn active" id="btn-1" onclick="setSection(1)">المجموعة 1</button>
    <button class="unit-btn" id="btn-2" onclick="setSection(2)">المجموعة 2</button>
    <button class="unit-btn" id="btn-3" onclick="setSection(3)">المجموعة 3</button>
    <button class="unit-btn" id="btn-4" onclick="setSection(4)">المجموعة 4</button>
    <button class="unit-btn" id="btn-5" onclick="setSection(5)">المجموعة 5</button>
  </div>

  <section class="section-card">
    <h3 class="section-title" id="displayTitle">📘 الكلمات الأساسية</h3>
    <button class="autoplay-btn" id="autoPlayBtn" onclick="toggleAutoPlay()">🔁 تكرار المجموعة ككل بلا توقف</button>
    <div class="vocab-grid" id="vocabGrid"></div>
  </section>

  <section class="section-card">
    <h3 class="section-title">🎯 اختبار الصور</h3>
    <p style="font-size:1rem; color:#64748b; text-align:center; font-weight:bold;">(اضغط على الكلمة الإنجليزية لسماع نطقها، ثم اختر الصورة المناسبة لها)</p>
    <div class="scroll-box" id="meaningContainer"></div>
    <div class="action-group">
      <button class="action-btn" onclick="checkQuiz()">✅ تصحيح</button>
      <button class="action-btn reset-btn" onclick="renderQuiz()">🔄 إعادة بناء الاختبار (تصفير وعشوائية)</button>
    </div>
    <div class="score-box" id="meaningScore"></div>
  </section>

</div>

<script>
  // بنك الكلمات مع الرموز التعبيرية المعبرة جداً
  const vocabData = [
    // Group 1
    {en: "name", ar: "اسم", emoji: "🪪"}, {en: "class", ar: "فصل / صف", emoji: "👨‍🏫"}, {en: "elementary", ar: "ابتدائي", emoji: "🧒"},
    {en: "revision", ar: "مراجعة", emoji: "📖"}, {en: "sheet", ar: "ورقة / كشف", emoji: "📄"}, {en: "welcome", ar: "مرحباً", emoji: "👋"},
    {en: "correct", ar: "صحيح / يصحح", emoji: "✔️"}, {en: "answer", ar: "إجابة / يجيب", emoji: "🙋‍♂️"}, {en: "pass", ar: "يمر / ينجح", emoji: "💯"},
    {en: "glass", ar: "كأس / زجاج", emoji: "🥛"}, {en: "juice", ar: "عصير", emoji: "🧃"}, {en: "want", ar: "يريد", emoji: "🤲"},
    {en: "help", ar: "يساعد / مساعدة", emoji: "🤝"}, {en: "friendlier", ar: "أكثر ودية", emoji: "😊"}, {en: "week", ar: "أسبوع", emoji: "📆"},
    {en: "school", ar: "مدرسة", emoji: "🏫"}, {en: "car", ar: "سيارة", emoji: "🚗"}, {en: "usually", ar: "عادة", emoji: "🔄"},
    {en: "minute", ar: "دقيقة", emoji: "⏱️"}, {en: "bus", ar: "حافلة", emoji: "🚌"},

    // Group 2
    {en: "way", ar: "طريق / طريقة", emoji: "🛣️"}, {en: "say", ar: "يقول", emoji: "🗣️"}, {en: "something", ar: "شيء ما", emoji: "🎁"},
    {en: "someone", ar: "شخص ما", emoji: "👤"}, {en: "else", ar: "آخر", emoji: "➕"}, {en: "happy", ar: "سعيد", emoji: "😁"},
    {en: "away", ar: "بعيداً", emoji: "🏃‍♂️"}, {en: "problem", ar: "مشكلة", emoji: "🧩"}, {en: "happen", ar: "يحدث", emoji: "💥"},
    {en: "right", ar: "صحيح / يمين", emoji: "👉"}, {en: "now", ar: "الآن", emoji: "👇"}, {en: "upset", ar: "منزعج / غاضب", emoji: "😞"},
    {en: "tell", ar: "يخبر", emoji: "💬"}, {en: "come", ar: "يأتي", emoji: "🫴"}, {en: "here", ar: "هنا", emoji: "📍"},
    {en: "following", ar: "التالي", emoji: "👣"}, {en: "word", ar: "كلمة", emoji: "🔤"}, {en: "bank", ar: "بنك / مصرف", emoji: "🏦"},
    {en: "paragraph", ar: "فقرة", emoji: "📜"}, {en: "plan", ar: "خطة / يخطط", emoji: "📋"},

    // Group 3
    {en: "Sunday", ar: "الأحد", emoji: "☀️"}, {en: "swimming", ar: "سباحة", emoji: "🏊"}, {en: "play", ar: "يلعب", emoji: "⚽"},
    {en: "movie", ar: "فيلم", emoji: "🎬"}, {en: "friend", ar: "صديق", emoji: "👬"}, {en: "grandmother", ar: "جدة", emoji: "👵"},
    {en: "Wednesday", ar: "الأربعاء", emoji: "📅"}, {en: "short", ar: "قصير", emoji: "🤏"}, {en: "sentence", ar: "جملة", emoji: "✍️"},
    {en: "picture", ar: "صورة", emoji: "🖼️"}, {en: "agree", ar: "يوافق", emoji: "👍"}, {en: "back", ar: "خلف / عودة", emoji: "🔙"},
    {en: "climbing", ar: "تسلق", emoji: "🧗"}, {en: "tree", ar: "شجرة", emoji: "🌳"}, {en: "eat", ar: "يأكل", emoji: "🍔"},
    {en: "breakfast", ar: "إفطار", emoji: "🍳"}, {en: "morning", ar: "صباح", emoji: "🌅"}, {en: "yesterday", ar: "أمس", emoji: "⏪"},
    {en: "normally", ar: "بشكل طبيعي", emoji: "⚖️"}, {en: "walk", ar: "يمشي", emoji: "🚶‍♂️"},

    // Group 4
    {en: "ride", ar: "يركب", emoji: "🚴"}, {en: "bike", ar: "دراجة", emoji: "🚲"}, {en: "act", ar: "يمثل / يتصرف", emoji: "🎭"},
    {en: "stage", ar: "مسرح / منصة", emoji: "🎤"}, {en: "mom", ar: "أمي", emoji: "👩"}, {en: "work", ar: "عمل / يعمل", emoji: "🛠️"},
    {en: "brother", ar: "أخ", emoji: "👦"}, {en: "call", ar: "يتصل / ينادي", emoji: "📞"}, {en: "while", ar: "بينما", emoji: "⏳"},
    {en: "study", ar: "يدرس", emoji: "📚"}, {en: "library", ar: "مكتبة", emoji: "🏛️"}, {en: "watch", ar: "يشاهد / ساعة", emoji: "📺"},
    {en: "football", ar: "كرة قدم", emoji: "⚽"}, {en: "match", ar: "مباراة", emoji: "🏟️"}, {en: "long", ar: "طويل", emoji: "📏"},
    {en: "hair", ar: "شعر", emoji: "💇‍♀️"}, {en: "banana", ar: "موز", emoji: "🍌"}, {en: "expensive", ar: "غالي الثمن", emoji: "💎"},
    {en: "apple", ar: "تفاحة", emoji: "🍎"}, {en: "cherry", ar: "كرز", emoji: "🍒"},

    // Group 5
    {en: "fruit", ar: "فاكهة", emoji: "🍓"}, {en: "under", ar: "تحت", emoji: "⏬"}, {en: "cookie", ar: "بسكويت", emoji: "🍪"},
    {en: "gate", ar: "بوابة", emoji: "⛩️"}, {en: "taxi", ar: "سيارة أجرة", emoji: "🚕"}, {en: "swing", ar: "أرجوحة", emoji: "🛝"},
    {en: "backpack", ar: "حقيبة ظهر", emoji: "🎒"}, {en: "tie", ar: "ربطة عنق", emoji: "👔"}, {en: "blank", ar: "فراغ", emoji: "⬜"},
    {en: "box", ar: "صندوق", emoji: "📦"}, {en: "moment", ar: "لحظة", emoji: "⏱️"}, {en: "last", ar: "أخير / ماضي", emoji: "🏁"},
    {en: "drink", ar: "يشرب", emoji: "🥤"}, {en: "water", ar: "ماء", emoji: "💧"}, {en: "opinion", ar: "رأي", emoji: "💭"},
    {en: "share", ar: "يشارك", emoji: "🤝"}, {en: "family", ar: "عائلة", emoji: "👪"}, {en: "excited", ar: "متحمس", emoji: "🤩"},
    {en: "journalist", ar: "صحفي", emoji: "🗞️"}, {en: "design", ar: "تصميم / يصمم", emoji: "📐"}
  ];

  let currentSection = 1;
  const wordsPerSection = 20;

  // متغيرات التشغيل التلقائي
  let isAutoPlaying = false;
  let autoPlayIndex = 0;
  let autoPlayTimeout = null;

  let isRowLooping = false;
  let activeRowId = null;
  let loopingIndices = [];
  let currentLoopIndex = 0;

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function setSection(num) {
    stopAutoPlay();
    stopRowLoop();
    currentSection = num;
    document.querySelectorAll(".unit-btn").forEach(btn => btn.classList.remove("active"));
    document.getElementById(`btn-${num}`).classList.add("active");
    renderGrid();
    renderQuiz(); 
  }

  // --- قسم التكرار اللانهائي للصفوف ---
  function toggleRowLoop(rowId, indicesStr) {
    let indices = indicesStr.split(',').map(Number);
    
    if (isRowLooping && activeRowId === rowId) {
      stopRowLoop();
      return;
    }

    stopAutoPlay();
    stopRowLoop();

    isRowLooping = true;
    activeRowId = rowId;
    loopingIndices = indices;
    currentLoopIndex = 0;

    let btn = document.getElementById(`loop-btn-${rowId}`);
    if(btn) {
      btn.classList.add("playing");
      btn.innerHTML = "⏹️ إيقاف";
    }

    playNextInRowLoop();
  }

  function playNextInRowLoop() {
    if (!isRowLooping) return;

    document.querySelectorAll('.vocab-item').forEach(el => el.classList.remove('active-yellow'));

    let globalIdx = loopingIndices[currentLoopIndex];
    let card = document.getElementById(`vocab-card-${globalIdx}`);
    if (card) {
      card.classList.add("active-yellow");
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    }

    let wordToSpeak = vocabData[globalIdx].en;
    let u = new SpeechSynthesisUtterance(wordToSpeak);
    u.lang = 'en-US';
    u.rate = 0.85;
    u.onend = () => {
      if (!isRowLooping) return;
      setTimeout(() => {
        if (!isRowLooping) return;
        currentLoopIndex++;
        if (currentLoopIndex >= loopingIndices.length) {
          currentLoopIndex = 0;
        }
        playNextInRowLoop();
      }, 800); 
    };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  function stopRowLoop() {
    isRowLooping = false;
    activeRowId = null;
    window.speechSynthesis.cancel();
    document.querySelectorAll('.loop-btn').forEach(btn => {
      btn.classList.remove("playing");
      btn.innerHTML = "🔁<br>تكرار";
    });
    document.querySelectorAll('.vocab-item').forEach(el => el.classList.remove('active-yellow'));
  }

  // --- قسم المذاكرة العلوية (نطق عند الضغط) ---
  function playAndShow(word, globalIdx) {
    stopAutoPlay();
    stopRowLoop();

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let u = new SpeechSynthesisUtterance(word);
      u.lang = 'en-US'; u.rate = 0.9; 
      window.speechSynthesis.speak(u);
    }
    
    let targetCard = document.getElementById(`vocab-card-${globalIdx}`);
    let isAlreadyActive = targetCard.classList.contains("active-yellow");
    
    document.querySelectorAll('.vocab-item').forEach(el => el.classList.remove("active-yellow"));
    if (!isAlreadyActive) targetCard.classList.add("active-yellow");
  }

  function renderGrid() {
    let startIdx = (currentSection - 1) * wordsPerSection;
    let endIdx = startIdx + wordsPerSection;
    let currentVocab = vocabData.slice(startIdx, endIdx);

    document.getElementById("displayTitle").innerText = `📘 الكلمات الأساسية (المجموعة ${currentSection})`;

    let vHTML = "";
    
    for (let i = 0; i < currentVocab.length; i += 3) {
      let rowItems = currentVocab.slice(i, i + 3);
      let indices = [];
      let itemsHTML = "";
      
      rowItems.forEach((item, localOffset) => {
        let globalIdx = startIdx + i + localOffset;
        let globalNum = globalIdx + 1;
        indices.push(globalIdx);
        
        let safeEn = item.en.replace(/'/g, "\\'");
        itemsHTML += `
          <div class="vocab-item" id="vocab-card-${globalIdx}" onclick="playAndShow('${safeEn}', ${globalIdx})">
            <span class="vocab-num">${globalNum}.</span>
            <div class="vocab-emoji">${item.emoji}</div>
            <div class="word-en">${item.en}</div>
            <div class="word-ar" id="ar-${globalIdx}">${item.ar}</div>
          </div>`;
      });
      
      let indicesStr = indices.join(',');
      
      let btnHTML = `
        <button class="loop-btn" id="loop-btn-${i}" onclick="toggleRowLoop(${i}, '${indicesStr}')">
          🔁<br>تكرار
        </button>
      `;
      
      vHTML += `<div class="vocab-row">${btnHTML}${itemsHTML}</div>`;
    }

    document.getElementById("vocabGrid").innerHTML = vHTML;
  }

  // --- التكرار بلا توقف للمجموعة بالكامل ---
  function toggleAutoPlay() {
    isAutoPlaying = !isAutoPlaying;
    let btn = document.getElementById("autoPlayBtn");
    if(isAutoPlaying) {
      stopRowLoop();
      btn.innerHTML = "⏹️ إيقاف التكرار";
      btn.classList.add("playing");
      autoPlayIndex = 0;
      runAutoPlayLoop();
    } else {
      stopAutoPlay();
    }
  }

  function stopAutoPlay() {
    isAutoPlaying = false;
    let btn = document.getElementById("autoPlayBtn");
    btn.innerHTML = "🔁 تكرار المجموعة ككل بلا توقف";
    btn.classList.remove("playing");
    clearTimeout(autoPlayTimeout);
    document.querySelectorAll('.vocab-item').forEach(el => el.classList.remove('active-yellow'));
  }

  function runAutoPlayLoop() {
    if(!isAutoPlaying) return;
    
    // إعادة التكرار من الصفر بلا توقف
    if(autoPlayIndex >= wordsPerSection) autoPlayIndex = 0; 
    
    document.querySelectorAll('.vocab-item').forEach(el => el.classList.remove('active-yellow'));
    
    let startIdx = (currentSection - 1) * wordsPerSection;
    let globalIdx = startIdx + autoPlayIndex;
    
    let currentCard = document.getElementById(`vocab-card-${globalIdx}`);
    if (currentCard) {
      currentCard.classList.add("active-yellow");
      currentCard.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    }

    let wordToSpeak = vocabData[globalIdx].en;
    let u = new SpeechSynthesisUtterance(wordToSpeak);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = () => {
      if(!isAutoPlaying) return;
      autoPlayTimeout = setTimeout(() => {
        autoPlayIndex++;
        runAutoPlayLoop();
      }, 1200); 
    };
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }

  // النطق عند الضغط على الكلمة في الاختبار
  function manualSpeak(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      let u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = 0.85; window.speechSynthesis.speak(u);
    }
  }

  // --- قسم الاختبار بالصور (الصارم والعشوائي) ---
  function renderQuiz() {
    let startIdx = (currentSection - 1) * wordsPerSection;
    let endIdx = startIdx + wordsPerSection;
    let currentVocab = vocabData.slice(startIdx, endIdx);

    // لخبطة الأسئلة
    let shuffledQuestions = [...currentVocab];
    shuffleArray(shuffledQuestions);

    let meanHTML = "";
    
    shuffledQuestions.forEach((q, idx) => {
      let correctEmoji = q.emoji;
      
      // جلب 3 خيارات خاطئة (صور/إيموجي) من كامل بنك الـ 100 كلمة للتشتيت
      let others = vocabData.filter(v => v.emoji !== correctEmoji);
      shuffleArray(others);
      let wrongOpts = others.slice(0, 3).map(v => v.emoji);
      
      // دمج الإجابة الصحيحة مع الخاطئة ولخبطة أماكنها
      let opts = [correctEmoji, ...wrongOpts];
      shuffleArray(opts);

      let optsHTML = opts.map((opt, oIdx) => `
        <label class="opt-label">
          <input type="radio" name="mean-${idx}" value="${opt}">
          <span>${opt}</span>
        </label>
      `).join("");

      let safeEn = q.en.replace(/'/g, "\\'");
      meanHTML += `
        <div class="quiz-question" data-correct="${correctEmoji}" data-idx="${idx}">
          <div class="q-text">
            <span dir="ltr" class="q-word" onclick="manualSpeak('${safeEn}')">${q.en}</span>
            <br><span style="font-size:0.9rem; color:#94a3b8;">(اضغط للنسخ الصوتي 🔊)</span>
          </div>
          <div class="q-options">${optsHTML}</div>
        </div>`;
    });
    
    document.getElementById("meaningContainer").innerHTML = meanHTML;
    document.getElementById("meaningScore").innerText = "";
  }

  function checkQuiz() {
    let score = 0;
    let questions = document.querySelectorAll('.quiz-question');
    
    questions.forEach((qDiv) => {
      let idx = qDiv.getAttribute('data-idx');
      let correctEmoji = qDiv.getAttribute('data-correct');
      let selected = qDiv.querySelector(`input[name="mean-${idx}"]:checked`);
      
      qDiv.querySelectorAll('.opt-label').forEach(lbl => {
        lbl.classList.remove('correct-ans', 'wrong-ans');
        let input = lbl.querySelector('input');
        if (input.value === correctEmoji) {
          lbl.classList.add('correct-ans');
        }
      });
      
      if (selected) {
        if (selected.value === correctEmoji) {
          score++;
        } else {
          selected.closest('.opt-label').classList.add('wrong-ans');
        }
      }
    });
    
    document.getElementById(`meaningScore`).innerText = `النتيجة: ${score} من ${wordsPerSection}`;
  }

  window.onload = () => {
    renderGrid();
    renderQuiz();
  };
</script>
