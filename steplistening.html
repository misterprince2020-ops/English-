        .btn-natural.paused { background-color: #f59e0b !important; }

        .btn-toggle { background-color: #0ea5e9; color: white; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Tajawal'; font-weight: bold; font-size: 15px; transition: 0.3s; display: flex; align-items: center; gap: 8px;}

        function buildExamApp() {
            generateAdvancedDialogues();
            let container = document.getElementById('exam-container');
            container.innerHTML = '';

            let lHeader = document.createElement('div');
            lHeader.className = 'exam-section-title';
            lHeader.innerText = "Advanced B1/B2 Listening Section (20 Dialogues, 160 Questions)";
            container.appendChild(lHeader);

            examData.listening.forEach((pass, pIdx) => {
                let audioBar = document.createElement('div');
                audioBar.className = 'audio-bar';
                
                let dialogueHtml = `<div class="dialogue-box">`;
                pass.dialogue.forEach((line, lineIdx) => {
                    let speakerClass = (lineIdx % 2 === 0) ? 'speaker-1' : 'speaker-2';
                    dialogueHtml += `
                        <div class="dialogue-line" id="line-${pIdx}-${lineIdx}" data-gender="${line.gender}">
                            <span class="speaker-badge ${line.gender === 'f' ? 'female' : 'male'}">${line.gender === 'f' ? 'صوت أنثوي' : 'صوت ذكوري'}</span>
                            <button class="line-audio-btn" data-state="stopped" onclick="handleAudioClick(this, '.dialogue-line', false)">🔊</button>
                            <span class="${speakerClass}">${line.speaker}:</span> 
                            <div style="display:inline-flex; flex-wrap:wrap; gap:5px; align-items:flex-end; padding-top:10px;">${renderClickableHtml(line.text)}</div>
                        </div>`;
                });
                dialogueHtml += `</div>`;

                audioBar.innerHTML = `
                    <div style="font-weight:bold; color:#0369a1; margin-bottom:5px; font-size:1.3em;">🎧 ${pass.title}</div>
                    <div class="audio-controls-row">
                        <button class="btn-natural" data-state="stopped" onclick="handleNaturalReading(this, '.audio-bar')">🗣️ قراءة طبيعية مزدوجة (Natural)</button>
                        <button class="audio-btn btn-toggle" data-state="stopped" onclick="handleAudioClick(this, '.audio-bar', true)">🎧 بدء التتبع والإملاء كاملاً (Dictation)</button>
                    </div>
                    ${dialogueHtml}
                `;
                container.appendChild(audioBar);

                pass.questions.forEach((q, qIdx) => {
                    container.appendChild(createQuestionCard(q, qIdx));
                });
            });
        }

        function renderClickableHtml(text) {
            let pairs = text.split(' ').map(p => p.trim()).filter(p => p !== '');
            return pairs.map(pair => {
                let cleanW = pair.replace(/[^a-zA-Z0-9'-]/g, '');
                let arW = getTranslation(cleanW);
                let safeWord = cleanW.replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                let arHtml = arW !== "" ? `<span class="ar">${arW}</span>` : `<span class="ar" style="display:none;"></span>`;
                return `<span class="word-group" data-speak="${safeWord}">${arHtml}<span class="en">${pair}</span></span>`;
            }).join(' ');
        }

        function createQuestionCard(qObj, index) {
            let block = document.createElement('div');
            block.className = 'question-row';
            block.id = `q-${qObj.globalId}`;
            
            let originalCorrectOptStr = qObj.o[qObj.correctIdx].split('|')[0].replace(/_/g, ' ').trim();
            block.setAttribute('data-ans', originalCorrectOptStr);

            let wordsHtml = renderClickableHtml(qObj.q.replace(/_/g, ' '));

            let indexedOpts = qObj.o.map((opt, idx) => ({ optStr: opt, isCorrect: (idx === qObj.correctIdx) }));
            indexedOpts.sort(() => Math.random() - 0.5);

            let letters = ["A", "B", "C", "D"];
            let optsHtml = `<div class="options-inline" id="opts-area-${qObj.globalId}">` + indexedOpts.map((item, i) => {
                let optWordsHtml = renderClickableHtml(item.optStr.split('|')[0]);
                let isCorrAttr = item.isCorrect ? 'true' : 'false';
                let cleanOptVal = item.optStr.split('|')[0].replace(/_/g, ' ').trim();
                return `<div class="opt-item" data-correct="${isCorrAttr}" data-opt-val="${cleanOptVal}" onclick="selectOption(this, event)"><div class="choice-badge">${letters[i]}</div><div class="choice-text">${optWordsHtml}</div></div>`;
            }).join('') + `</div>`;

            block.innerHTML = `
                <div class="q-text-container">
                    <span class="q-number-span" id="num-${qObj.globalId}">${index + 1}. </span>
                    <div class="q-text">${wordsHtml}</div>
                </div>
                ${optsHtml}
                <div class="answer-action-container">
                    <button class="btn-answer" id="btn-ans-${qObj.globalId}" onclick="window.revealAnswer('${qObj.globalId}')">👁️ إظهار الإجابة</button>
                </div>
                <div class="answer-box" id="ans-box-${qObj.globalId}">
                    <div class="correct-word-text">الإجابة الصحيحة: <span class="en-ans" style="color:#059669; font-weight:bold;">${originalCorrectOptStr}</span></div>
                </div>
            `;
            return block;
        }

        window.applyVoiceSettings = function(u, gender) {
            u.pitch = (gender === 'f') ? 1.4 : 0.8;
            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                let engVoices = voices.filter(v => v.lang.startsWith('en'));
                if (engVoices.length > 0) {
                    if (gender === 'f') {
                        let femaleVoice = engVoices.find(v => v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha') || v.name.toLowerCase().includes('karen'));
                        if (femaleVoice) u.voice = femaleVoice;
                    } else {
                        let maleVoice = engVoices.find(v => v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('mark') || v.name.toLowerCase().includes('daniel'));
                        if (maleVoice) u.voice = maleVoice;
                        else if (engVoices.length > 1) u.voice = engVoices[engVoices.length - 1]; 
                    }
                }
            }
        };

        window.naturalReadingState = { btn: null, lines: [], currentIndex: 0, status: 'stopped' };

        window.clearHighlights = function() {
            document.querySelectorAll('.audio-highlight').forEach(el => el.classList.remove('audio-highlight'));
            document.querySelectorAll('.dialogue-line.line-highlight').forEach(el => el.classList.remove('line-highlight'));
        };

        window.handleNaturalReading = function(btn, containerSelector) {
            if (!window.speechSynthesis) return alert("متصفحك لا يدعم خاصية نطق الصوت.");

            let nr = window.naturalReadingState;
            let am = window.audioManager;

            if (am.status !== 'stopped') {
                am.status = 'stopped';
                window.speechSynthesis.cancel();
                window.clearHighlights();
                if (am.btn) window.updateBtnUI(am.btn, 'stopped', am.btn.classList.contains('audio-btn'));
                am.btn = null;
            }

            if (nr.btn === btn) {
                if (nr.status === 'playing') {
                    nr.status = 'paused';
                    window.speechSynthesis.cancel(); 
                    btn.innerHTML = '▶️ استئناف الطبيعية';
                    btn.className = 'btn-natural paused';
                    return;
                } else if (nr.status === 'paused') {
                    nr.status = 'playing';
                    btn.innerHTML = '⏸ إيقاف الطبيعية';
                    btn.className = 'btn-natural playing';
                    window.speakNextNaturalLine();
                    return;
                }
            }

            window.speechSynthesis.cancel();
            window.clearHighlights();

            if (nr.btn && nr.btn !== btn) {
                nr.btn.innerHTML = '🗣️ قراءة طبيعية مزدوجة (Natural)';
                nr.btn.className = 'btn-natural';
            }

            nr.btn = btn;
            nr.status = 'playing';
            btn.innerHTML = '⏸ إيقاف الطبيعية';
            btn.className = 'btn-natural playing';

            let container = btn.closest(containerSelector);
            nr.lines = Array.from(container.querySelectorAll('.dialogue-line'));
            nr.currentIndex = 0;

            window.speakNextNaturalLine();
        };

        window.speakNextNaturalLine = function() {
            let nr = window.naturalReadingState;
            
            if (nr.status !== 'playing') return;

            window.clearHighlights();

            if (nr.currentIndex >= nr.lines.length) {
                nr.currentIndex = 0;
                let savedBtn = nr.btn;
                setTimeout(function() {
                    if (nr.status === 'playing' && nr.btn === savedBtn) {
                        window.speakNextNaturalLine();
                    }
                }, 1200); 
                return;
            }

            let currentLineEl = nr.lines[nr.currentIndex];
            currentLineEl.classList.add('line-highlight'); 
            currentLineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            let gender = currentLineEl.getAttribute('data-gender');
            let words = Array.from(currentLineEl.querySelectorAll('.word-group .en'));
            let text = words.map(w => w.textContent.trim()).join(' ');

            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 1.0; 
            
            window.applyVoiceSettings(u, gender);

            u.onend = function() {
                if (nr.status === 'playing') {
                    nr.currentIndex++;
                    window.speakNextNaturalLine();
                } else {
                    window.clearHighlights();
                }
            };
            
            u.onerror = function() {
                if (nr.status === 'playing') {
                    nr.currentIndex++;
                    window.speakNextNaturalLine();
                } else {
                    window.clearHighlights();
                }
            };

            window.speechSynthesis.speak(u);
        };
        
        window.audioManager = {
            btn: null,
            wordsQueue: [],
            currentIndex: 0,
            status: 'stopped',
            lastScrolledLine: null
        };

        window.updateBtnUI = function(btn, state, isFull) {
            if (isFull) {
                if (state === 'playing') {
                    btn.innerHTML = '⏸ إيقاف الإملاء مؤقتاً (Pause)';
                    btn.className = 'audio-btn btn-toggle playing';
                } else if (state === 'paused') {
                    btn.innerHTML = '▶️ استئناف الإملاء (Resume)';
                    btn.className = 'audio-btn btn-toggle paused';
                } else {
                    btn.innerHTML = '🎧 بدء التتبع والإملاء كاملاً (Dictation)';
                    btn.className = 'audio-btn btn-toggle';
                }
            } else {
                if (state === 'playing') {
                    btn.innerHTML = '⏸';
                    btn.className = 'line-audio-btn playing';
                } else if (state === 'paused') {
                    btn.innerHTML = '▶️';
                    btn.className = 'line-audio-btn paused';
                } else {
                    btn.innerHTML = '🔊';
                    btn.className = 'line-audio-btn';
                }
            }
        };

        window.speakCurrentWord = function(isFull) {
            let am = window.audioManager;
            
            if (am.status !== 'playing') return;
            
            if (am.currentIndex >= am.wordsQueue.length) {
                am.currentIndex = 0;
                am.lastScrolledLine = null;
                window.clearHighlights();
                let savedBtn = am.btn;
                
                setTimeout(function() {
                    if (am.status === 'playing' && am.btn === savedBtn) {
                        window.speakCurrentWord(isFull);
                    }
                }, 1000); 
                return;
            }

            window.clearHighlights();
            let currentWordEl = am.wordsQueue[am.currentIndex];
            currentWordEl.classList.add('audio-highlight');
            
            let currentLine = currentWordEl.closest('.dialogue-line');
            if(currentLine && am.lastScrolledLine !== currentLine) {
                currentLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                am.lastScrolledLine = currentLine;
            }
            
            let text = currentWordEl.querySelector('.en').textContent.trim();
            let gender = currentLine ? currentLine.getAttribute('data-gender') : 'm';
            
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.85; 
            
            window.applyVoiceSettings(u, gender);

            u.onend = function() {
                if (am.status === 'playing') {
                    am.currentIndex++;
                    window.speakCurrentWord(isFull);
                }
            };
            
            u.onerror = function() {
                if (am.status === 'playing') {
                    am.currentIndex++;
                    window.speakCurrentWord(isFull);
                }
            };

            window.speechSynthesis.speak(u);
        };

        window.handleAudioClick = function(btn, containerSelector, isFull) {
            if (!window.speechSynthesis) {
                alert("متصفحك لا يدعم خاصية نطق الصوت.");
                return;
            }

            let am = window.audioManager;
            let nr = window.naturalReadingState;

            if (nr.status !== 'stopped') {
                nr.status = 'stopped';
                window.speechSynthesis.cancel();
                if (nr.btn) {
                    nr.btn.innerHTML = '🗣️ قراءة طبيعية مزدوجة (Natural)';
                    nr.btn.className = 'btn-natural';
                }
                nr.btn = null;
            }

            if (am.btn === btn) {
                if (am.status === 'playing') {
                    am.status = 'paused';
                    window.speechSynthesis.cancel(); 
                    window.updateBtnUI(btn, 'paused', isFull);
                    return;
                } else if (am.status === 'paused') {
                    am.status = 'playing';
                    window.updateBtnUI(btn, 'playing', isFull);
                    window.speakCurrentWord(isFull);
                    return;
                }
            }

            window.speechSynthesis.cancel();
            window.clearHighlights();
            
            if (am.btn && am.btn !== btn) {
                window.updateBtnUI(am.btn, 'stopped', am.btn.classList.contains('audio-btn'));
            }

            am.btn = btn;
            am.status = 'playing';
            window.updateBtnUI(btn, 'playing', isFull);

            let container = btn.closest(containerSelector);
            if(isFull){
                am.wordsQueue = Array.from(container.querySelectorAll('.dialogue-box .word-group'));
            } else {
                am.wordsQueue = Array.from(container.querySelectorAll('.word-group'));
            }
            am.currentIndex = 0;
            am.lastScrolledLine = null;
            
            window.speakCurrentWord(isFull);
        };

        window.setMode = function(mode) {
            let pageEl = document.querySelector('.page');
            let btnStudy = document.getElementById('btn-study');
            let btnExam = document.getElementById('btn-exam');
            
            if(window.speechSynthesis) window.speechSynthesis.cancel();
            window.clearHighlights();
            
            if(window.audioManager.btn) {
                window.audioManager.status = 'stopped';
                window.updateBtnUI(window.audioManager.btn, 'stopped', window.audioManager.btn.classList.contains('audio-btn'));
                window.audioManager.btn = null;
            }
            if(window.naturalReadingState.btn) {
                window.naturalReadingState.status = 'stopped';
                window.naturalReadingState.btn.innerHTML = '🗣️ قراءة طبيعية مزدوجة (Natural)';
                window.naturalReadingState.btn.className = 'btn-natural';
                window.naturalReadingState.btn = null;
            }
            
            document.getElementById('res-box').style.display = 'none';

            if (mode === 'exam') {
                pageEl.classList.add('exam-mode');
                btnExam.classList.add('active-mode');
                btnStudy.classList.remove('active-mode');
            } else {
                pageEl.classList.remove('exam-mode');
                btnStudy.classList.add('active-mode');
                btnExam.classList.remove('active-mode');
            }
        };

        window.selectOption = function(optItem, event) {
            if (event && event.target.closest('.word-group')) return;
            let row = optItem.closest('.question-row');
            if(row.classList.contains('answered')) return; 
            
            let isCorrectChoice = (optItem.getAttribute('data-correct') === 'true');
            row.classList.add('answered'); 
            optItem.classList.add('selected');
            
            row.querySelectorAll('.opt-item').forEach(item => {
                if (item.getAttribute('data-correct') === 'true') item.classList.add('correct');
            });
            if (!isCorrectChoice) optItem.classList.add('wrong');
        };

        document.addEventListener('click', function(e) {
            if(document.querySelector('.page').classList.contains('exam-mode')) return;
            let wg = e.target.closest('.word-group');
            
            if (wg && !e.target.closest('.line-audio-btn') && !e.target.closest('.audio-btn') && !e.target.closest('.btn-natural')) {
                let am = window.audioManager;
                let nr = window.naturalReadingState;

                if (am.status === 'playing') {
                    window.speechSynthesis.cancel();
                    am.status = 'paused';
                    window.updateBtnUI(am.btn, 'paused', am.btn.classList.contains('audio-btn'));
                    window.clearHighlights();
                }
                if (nr.status === 'playing') {
                    window.speechSynthesis.cancel();
                    nr.status = 'paused';
                    nr.btn.innerHTML = '▶️ استئناف الطبيعية';
                    nr.btn.className = 'btn-natural paused';
                    window.clearHighlights();
                }
                
                let speakTextAttr = wg.getAttribute('data-speak');
                if (speakTextAttr && window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    window.clearHighlights();
                    wg.classList.add('highlight');
                    
                    let txt = speakTextAttr.replace(/[\._]/g, '').trim();
                    let gender = wg.closest('.dialogue-line') ? wg.closest('.dialogue-line').getAttribute('data-gender') : 'm';

                    if(txt) {
                        let u = new SpeechSynthesisUtterance(txt);
                        u.lang = 'en-US'; 
                        u.rate = 0.85;
                        window.applyVoiceSettings(u, gender);
                        u.onend = () => wg.classList.remove('highlight');
                        window.speechSynthesis.speak(u);
                        setTimeout(() => wg.classList.remove('highlight'), 1200);
                    }
                }
            }
        });

        window.revealAnswer = function(id) {
            let box = document.getElementById(`ans-box-${id}`); 
            let btn = document.getElementById(`btn-ans-${id}`);
            if (box.style.display === 'none' || !box.style.display) { 
                box.style.display = 'block'; 
                btn.innerHTML = '🙈 إخفاء الإجابة'; 
            } else { 
                box.style.display = 'none'; 
                btn.innerHTML = '👁️ إظهار الإجابة'; 
            }
        };

        window.showExamResult = function() {
            let rows = document.querySelectorAll('.question-row');
            let correctCount = 0; let answeredCount = 0; let totalCount = rows.length;
            
            rows.forEach(row => {
                let selectedOpt = row.querySelector('.opt-item.selected');
                if (selectedOpt) {
                    answeredCount++;
                    if(selectedOpt.getAttribute('data-correct') === 'true') correctCount++;
                }
            });
            
            let resEl = document.getElementById('res-box');
            let msg = `النتيجة النهائية: ${correctCount} من ${totalCount}<br>`;
            if(correctCount === totalCount) msg += "🏆 أداء أسطوري! إجابات مثالية!";
            else if(correctCount >= totalCount/2) msg += "🌟 أداء ممتاز! استمر هكذا!";
            else msg += "💪 تدرب أكثر لرفع درجتك!";
            
            resEl.innerHTML = msg;
            resEl.style.display = "block";
            resEl.scrollIntoView({behavior: 'smooth'});
        };

        if(window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        buildExamApp();

    } catch (e) {
        document.body.innerHTML += '<div style="color:white; background:#e74c3c; padding:20px; font-size:18px; text-align:right; direction:rtl; margin-top:20px; border-radius:10px;"><b>خطأ برمجي:</b><br>' + e.message + '</div>';
    }
})();
</script>

</body>
</html>
