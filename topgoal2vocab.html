        body {

            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #start-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 64, 133, 0.95);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #start-overlay h1 { font-size: 3rem; margin-bottom: 20px; text-align: center; }
        #start-btn {
            padding: 15px 40px; font-size: 1.5rem;
            background-color: var(--primary-red);
            color: white; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #start-btn:hover { background-color: #c82333; }

        .app-container {
            width: 100%; max-width: 800px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            display: none; 
        }

        .header {
            background-color: var(--primary-blue);
            color: white; padding: 20px;
            text-align: center;
        }
        .header select {
            padding: 10px; font-size: 1.2rem;
            border-radius: 5px; border: 2px solid white;
            background: var(--primary-blue); color: white;
            margin-top: 10px; cursor: pointer;
        }

        .control-panel {
            display: flex; justify-content: space-between;
            padding: 15px 20px; background-color: #e9ecef;
            border-bottom: 2px solid #ddd; align-items: center;
            flex-wrap: wrap; gap: 10px;
        }
        .score-board { display: flex; gap: 15px; font-size: 1.2rem; font-weight: bold; }
        .score-correct { color: var(--success-green); }
        .score-wrong { color: var(--primary-red); }
        .mode-toggle {
            padding: 8px 15px; font-size: 1rem;
            background-color: #6c757d; color: white;
            border: none; border-radius: 5px; cursor: pointer;
        }
        .mode-toggle.auto { background-color: var(--primary-blue); }

        .flashcard { padding: 30px 20px; text-align: center; position: relative; }
        
        /* تصميم العداد الجديد */
        .progress-badge {
            background-color: var(--info-cyan);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .word-container {
            display: flex; justify-content: center; align-items: center; gap: 15px;
            margin-bottom: 20px;
        }
        .english-word {
            font-size: 3.5rem; color: var(--primary-blue);
            font-weight: bold; margin: 0; direction: ltr;
        }
        .audio-btn {
            font-size: 2rem; background: none; border: none; cursor: pointer;
            color: var(--primary-blue); transition: transform 0.2s;
        }
        .audio-btn:hover { transform: scale(1.1); }

        .sentence-wrapper {
            font-size: 2rem; color: #333; margin-bottom: 30px;
            direction: ltr; font-weight: bold;
            padding: 15px; border-radius: 10px;
            border-left: 5px solid var(--primary-blue);
            transition: background-color 0.3s ease;
            background-color: #f8f9fa;
        }

        .target-word { color: var(--primary-red); font-weight: bold; }
        .reading-highlight { background-color: yellow !important; }

        .choices {
            display: flex; flex-direction: column; gap: 15px;
            max-width: 400px; margin: 0 auto;
        }
        .choice-btn {
            padding: 15px; font-size: 1.3rem; font-weight: bold;
            background-color: var(--primary-blue); color: white;
            border: none; border-radius: 8px; cursor: pointer;
            transition: 0.3s;
        }
        .choice-btn:hover { background-color: #0056b3; }
        .choice-btn.correct { background-color: var(--success-green) !important; }
        .choice-btn.wrong { background-color: var(--primary-red) !important; }

        #next-btn {
            display: none; margin: 20px auto 0;
            padding: 12px 30px; font-size: 1.2rem;
            background-color: #ffc107; color: #333; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
        }
        
        .footer { text-align: center; padding: 15px; background: var(--primary-blue); color: white; margin-top: 20px;}

</head>

            <button id="mode-btn" class="mode-toggle auto" onclick="toggleMode()">الوضع: تلقائي ⚡</button>

        <div class="flashcard">

            <div class="sentence-wrapper" id="sentence-display"></div>
            
            <div class="choices" id="choices-container"></div>

            <button id="next-btn" onclick="nextWord()">الكلمة التالية ⏭️</button>
        </div>
        
        <div class="footer">مدارس آفاق الهداية الحديثة للبنين - جدة</div>
    </div>

                { word: "Farm", sentence: "The cow is on the <span class='target-word'>farm</span>.", choices: ["مزرعة", "مدينة", "شارع"], answer: "مزرعة" },

                { word: "Store", sentence: "I buy toys from the <span class='target-word'>store</span>.", choices: ["متجر", "مدرسة", "مستشفى"], answer: "متجر" },

                { word: "Car", sentence: "I drive my <span class='target-word'>car</span>.", choices: ["سيارة", "دراجة", "طائرة"], answer: "سيارة" },
                { word: "Bus", sentence: "I go to school by <span class='target-word'>bus</span>.", choices: ["حافلة / باص", "قطار", "طائرة"], answer: "حافلة / باص" },
                { word: "Plane", sentence: "The <span class='target-word'>plane</span> is in the sky.", choices: ["طائرة", "سيارة", "سفينة"], answer: "طائرة" },
                { word: "Ship", sentence: "The <span class='target-word'>ship</span> is in the sea.", choices: ["سفينة", "طائرة", "قطار"], answer: "سفينة" },
                { word: "Train", sentence: "The <span class='target-word'>train</span> is very fast.", choices: ["قطار", "سيارة", "دراجة"], answer: "قطار" },
                { word: "Work", sentence: "I go to <span class='target-word'>work</span>.", choices: ["عمل", "نوم", "لعب"], answer: "عمل" },
                { word: "Job", sentence: "Teaching is a good <span class='target-word'>job</span>.", choices: ["وظيفة", "هواية", "لعبة"], answer: "وظيفة" },
                { word: "Money", sentence: "I buy a book with <span class='target-word'>money</span>.", choices: ["نقود / مال", "ورق", "خشب"], answer: "نقود / مال" },
                { word: "Uniform", sentence: "The police wears a <span class='target-word'>uniform</span>.", choices: ["زي رسمي", "حذاء", "قبعة"], answer: "زي رسمي" },
                { word: "Boss", sentence: "He is the <span class='target-word'>boss</span>.", choices: ["رئيس عمل", "عامل", "طالب"], answer: "رئيس عمل" },
                { word: "City", sentence: "Jeddah is a big <span class='target-word'>city</span>.", choices: ["مدينة", "قرية", "شارع"], answer: "مدينة" }
            ]
        };

        let currentUnit = "Welcome";
        let wordList = [];
        let currentIndex = 0;
        let isAutoMode = true;
        let correctCount = 0;
        let wrongCount = 0;
        let answered = false;

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            changeUnit();
        });

        function changeUnit() {
            currentUnit = document.getElementById('unit-select').value;
            wordList = vocabularyData[currentUnit];
            currentIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            updateScoreBoard();
            loadWord();
        }

        function loadWord() {
            if (currentIndex >= wordList.length) {
                alert(`انتهت كلمات هذه الوحدة يا بطل!\nالإجابات الصحيحة: ${correctCount}\nالأخطاء: ${wrongCount}`);
                currentIndex = 0;
            }

            answered = false;
            let currentData = wordList[currentIndex];
            
            // تحديث العداد الجديد للكلمات
            document.getElementById('current-word-num').innerText = currentIndex + 1;
            document.getElementById('total-word-count').innerText = wordList.length;
            
            document.getElementById('word-display').innerText = currentData.word;
            document.getElementById('sentence-display').innerHTML = currentData.sentence;
            document.getElementById('next-btn').style.display = 'none';

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            let shuffledChoices = currentData.choices.sort(() => Math.random() - 0.5);
            
            shuffledChoices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice, currentData.answer);
                choicesContainer.appendChild(btn);
            });

            playAudio();
        }

        function playAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                let currentData = wordList[currentIndex];
                let plainSentence = currentData.sentence.replace(/<[^>]*>?/gm, '');
                let textToSpeak = currentData.word + ". " + plainSentence;
                
                let utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'en-US';
                utterance.rate = 0.6; 
                
                const sentenceWrapper = document.getElementById('sentence-display');
                
                utterance.onstart = () => {
                    sentenceWrapper.classList.add('reading-highlight');
                };
                
                utterance.onend = () => {
                    sentenceWrapper.classList.remove('reading-highlight');
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function checkAnswer(btn, selected, correctAnswer) {
            if (answered) return;
            answered = true;

            const allButtons = document.querySelectorAll('.choice-btn');
            
            if (selected === correctAnswer) {
                btn.classList.add('correct');
                correctCount++;
                
                if (isAutoMode) {
                    setTimeout(() => {
                        currentIndex++;
                        loadWord();
                    }, 1500);
                } else {
                    document.getElementById('next-btn').style.display = 'block';
                }
            } else {
                btn.classList.add('wrong');
                wrongCount++;
                
                allButtons.forEach(b => {
                    if (b.innerText === correctAnswer) b.classList.add('correct');
                });
                
                document.getElementById('next-btn').style.display = 'block';
            }
            updateScoreBoard();
        }

        function nextWord() {
            currentIndex++;
            loadWord();
        }

        function updateScoreBoard() {
            document.getElementById('correct-counter').innerText = correctCount;
            document.getElementById('wrong-counter').innerText = wrongCount;
        }

        function toggleMode() {
            isAutoMode = !isAutoMode;
            let modeBtn = document.getElementById('mode-btn');
            if (isAutoMode) {
                modeBtn.innerText = "الوضع: تلقائي ⚡";
                modeBtn.classList.add('auto');
                if (answered && document.getElementById('next-btn').style.display === 'block') {
                    nextWord();
                }
            } else {
                modeBtn.innerText = "الوضع: يدوي ✋";
                modeBtn.classList.remove('auto');
                if (answered) {
                    document.getElementById('next-btn').style.display = 'block';
                }
            }
        }
    </script>
