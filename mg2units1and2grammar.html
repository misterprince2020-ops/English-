<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Jumbo English Quiz</title>
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f8fafc;
            --rule-bg: #e0f2fe; 
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e2e8f0; margin: 0; padding: 20px;
            user-select: none; -webkit-user-select: none;
            transition: background 0.3s;
        }

        .jumbo-container {
            background: white; width: 100%; max-width: 1800px;
            margin: 0 auto; padding: 40px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            border-top: 12px solid var(--secondary);
        }

        .top-controls {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-bottom: 30px;
        }
        .btn-jumbo {
            font-size: clamp(1.4rem, 2vw, 2rem); font-weight: 900; padding: 18px 35px;
            border: none; border-radius: 15px; cursor: pointer; color: white; transition: 0.3s;
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        .btn-auto-play { background-color: var(--secondary); width: 100%; font-size: 2.5rem; padding: 25px; margin-bottom: 25px; border-radius: 20px;}
        .btn-auto-play:hover { background-color: #2563eb; transform: scale(1.01); }
        .btn-test { background-color: var(--danger); }
        .btn-test.active { background-color: var(--primary); }
        .btn-shuffle { background-color: var(--warning); color: #1e293b; }
        .btn-check { background-color: var(--success); }

        .tabs { display: flex; justify-content: flex-start; gap: 20px; margin-bottom: 40px; flex-wrap: wrap; direction: ltr;}
        .tab-btn {
            font-size: 1.8rem; font-weight: 900; padding: 15px 40px;
            background: var(--bg); border: 4px solid #cbd5e1; border-radius: 15px; cursor: pointer; color: var(--primary);
            transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); transform: scale(1.05); }

        .question-card {
            background: var(--bg); border: 4px solid #e2e8f0; border-radius: 20px;
            padding: 30px; margin-bottom: 40px; position: relative; transition: all 0.4s ease;
        }
        
        .q-header { display: flex; align-items: flex-start; gap: 25px; margin-bottom: 25px; direction: ltr;}
        
        .btn-speak {
            background: var(--secondary); color: white; border: none; font-size: 3rem;
            width: 85px; height: 85px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
            box-shadow: 0 6px 12px rgba(59,130,246,0.3); transition: 0.2s; display: flex; justify-content: center; align-items: center;
        }
        .btn-speak.speaking { background: var(--danger); animation: pulse 1s infinite; }
        
        .q-number {
            background: var(--primary); color: white; font-size: 2.8rem; font-weight: 900;
            width: 85px; height: 85px; display: flex; justify-content: center; align-items: center;
            border-radius: 20px; flex-shrink: 0; box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        
        .q-text-container { flex-grow: 1; text-align: left; }
        .en-text { font-size: clamp(2.5rem, 4vw, 3.5rem); font-weight: 900; color: #0f172a; line-height: 1.6; }
        .ar-trans { font-size: 1.8rem; font-weight: bold; color: var(--danger); direction: rtl; text-align: right; margin-top: 15px; border-top: 3px dashed #cbd5e1; padding-top: 15px; }

        .options-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 15px; direction: ltr; margin-top: 30px;
        }
        .option-box {
            background: white; border: 4px solid #cbd5e1; border-radius: 15px;
            padding: 20px; cursor: pointer; display: flex; align-items: center; gap: 20px;
            transition: 0.2s; box-shadow: 0 6px 10px rgba(0,0,0,0.05);
        }
        .opt-letter {
            background: var(--primary); color: white; font-size: 2.5rem; font-weight: 900;
            width: 70px; height: 70px; display: flex; justify-content: center; align-items: center;
            border-radius: 50%; flex-shrink: 0;
        }
        .opt-content { flex-grow: 1; text-align: left;}
        .opt-en { font-size: 2.2rem; font-weight: 900; color: #1e293b; }
        .opt-ar { font-size: 1.5rem; font-weight: bold; color: var(--danger); direction: rtl; text-align: right; margin-top: 8px; }

        .option-box.selected { border-color: var(--secondary); background-color: #eff6ff; transform: translateY(-5px); box-shadow: 0 15px 20px rgba(59,130,246,0.2);}
        .option-box.correct { border-color: var(--success) !important; background-color: #dcfce7 !important; }
        .option-box.wrong { border-color: var(--danger) !important; background-color: #fee2e2 !important; }
        
        /* صندوق القاعدة (الشرح) */
        .explain-toggle-btn {
            background: #e2e8f0; color: #1e293b; border: 2px solid #cbd5e1; padding: 12px 25px; border-radius: 10px;
            font-size: 1.4rem; font-weight: 900; cursor: pointer; margin-top: 25px; display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .explain-toggle-btn:hover { background: #cbd5e1; }
        .explanation-box {
            display: none; background: var(--rule-bg); border: 3px solid #7dd3fc; border-radius: 15px;
            padding: 25px; margin-top: 15px; border-right: 10px solid var(--secondary); direction: rtl; text-align: right;
        }
        .explanation-box.open { display: block; animation: slideDown 0.3s ease-out; }
        .rule-title { font-size: 2rem; font-weight: 900; color: #0284c7; margin-bottom: 10px; }
        .rule-text { font-size: 1.8rem; font-weight: bold; color: #0f172a; line-height: 1.6;}
        
        .clickable-word { cursor: pointer; border-radius: 8px; padding: 0 5px; display: inline-block; transition: 0.1s;}
        .highlight-yellow { background-color: #fef08a !important; color: #000 !important; box-shadow: 0 0 15px #fde047; transform: scale(1.05); }
        .eng-in-arabic { font-family: 'Segoe UI', sans-serif; direction: ltr; display: inline-block; font-weight: 900; color: var(--danger); background: white; padding: 0 8px; border-radius: 6px; cursor: pointer; border: 2px solid #fca5a5;}
        
        #smart-tooltip {
            position: absolute; background: var(--danger); color: white; padding: 15px 30px;
            border-radius: 15px; font-size: 2rem; font-weight: 900; pointer-events: none;
            opacity: 0; transition: opacity 0.2s; z-index: 9999; box-shadow: 0 15px 30px rgba(220,38,38,0.5);
            direction: rtl; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        #smart-tooltip::after {
            content: ''; position: absolute; top: 100%; left: 50%; margin-left: -12px;
            border-width: 12px; border-style: solid; border-color: var(--danger) transparent transparent transparent;
        }

        body.focus-mode { background-color: #0f172a; overflow: hidden; }
        body.focus-mode .jumbo-container > *:not(#focus-overlay) { display: none !important; }
        
        #focus-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.98); z-index: 10000; flex-direction: column;
            justify-content: center; align-items: center; overflow-y: auto; padding: 30px;
        }
        body.focus-mode #focus-overlay { display: flex; }
        #focus-overlay .question-card { width: 100%; max-width: 1700px; transform: scale(1.02); background: white; margin: auto;}

        body.test-mode .ar-trans, body.test-mode .opt-ar, body.test-mode .explain-toggle-btn, body.test-mode .explanation-box { display: none !important; }
        body.test-mode .clickable-word { pointer-events: none; border-bottom: none; }
        body.test-mode .btn-speak { display: none !important; }

        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(0.9);} 100% {transform: scale(1);} }
        @keyframes slideDown { from {opacity: 0; transform: translateY(-10px);} to {opacity: 1; transform: translateY(0);} }

        @media (max-width: 1000px) { .options-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="smart-tooltip">ترجمة</div>

    <div class="jumbo-container">
        
        <button class="btn-jumbo btn-auto-play" id="autoPlayBtn" onclick="startFocusMode()">▶️ استماع تلقائي لجميع الأسئلة (Focus Mode)</button>

        <div class="top-controls">
            <button class="btn-jumbo btn-test" id="testModeBtn" onclick="toggleTestMode()">🎯 وضع الاختبار الحقيقي</button>
            <button class="btn-jumbo btn-check" onclick="checkAllAnswers()">✔️ عرض النتيجة</button>
            <button class="btn-jumbo btn-shuffle" onclick="shuffleAndRender()">🔄 تصفير وخلط ذكي</button>
        </div>

        <!-- التبويبات باليسار -->
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" onclick="switchTab('grammar')">Grammar Section (35 Questions)</button>
            <button class="tab-btn" onclick="switchTab('vocabulary')">Vocabulary Section (22 Questions)</button>
        </div>

        <div id="quiz-container"></div>
        <div id="focus-overlay"></div>
    </div>

let currentTab = 'grammar';
let isTestMode = false;
let autoPlayActive = false;

// ==========================================
// التهيئة وبناء الواجهة
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    shuffleAndRender('grammar');
    
    document.addEventListener('click', (e) => {
        if(!e.target.classList.contains('clickable-word')) {
            document.getElementById('smart-tooltip').style.opacity = '0';
        }
    });
});

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    shuffleAndRender(tab);
}

// دالة نظيفة جداً لتنسيق صندوق الشرح
function formatExplanation(text) {
    return text.replace(/\{([^}]+)\}/g, `<span class="clickable-word eng-in-arabic" dir="ltr" onclick="handleWordClick(event, this, '$1')">$1</span>`);
}

// دالة تغليف كلمات الأسئلة الإنجليزية
function wrapWords(text) {
    return text.split(' ').map(word => {
        if(word.includes('........')) return word; 
        let cleanWord = word.replace(/[.,!?]/g, '');
        if(!cleanWord) return word;
        return `<span class="clickable-word" onclick="handleWordClick(event, this, '${cleanWord}')">${word}</span>`;
    }).join(' ');
}

function handleWordClick(e, el, wordToSpeak) {
    if(isTestMode || autoPlayActive) return;
    
    let cleanWord = wordToSpeak.toLowerCase().trim();
    let isEngInAr = el.classList.contains('eng-in-arabic');
    
    // نطق
    if(window.speechSynthesis) {
        window.speechSynthesis.cancel();
        let u = new SpeechSynthesisUtterance(isEngInAr ? wordToSpeak : cleanWord);
        u.lang = 'en-US';
        u.rate = 0.8;
        window.speechSynthesis.speak(u);
    }

    // الترجمة للكلمات الإنجليزية فقط
    let trans = smartDict[cleanWord] || "ترجمة";
    const tooltip = document.getElementById('smart-tooltip');
    tooltip.textContent = trans;
    tooltip.style.opacity = '1';
    
    const rect = el.getBoundingClientRect();
    tooltip.style.left = `${rect.left + (rect.width/2) - (tooltip.offsetWidth/2)}px`;
    tooltip.style.top = `${rect.top + window.scrollY - 65}px`;

    setTimeout(() => { tooltip.style.opacity = '0'; }, 3000);
}

// ==========================================
// الخلط وبناء الأسئلة (Jumbo Build)
// ==========================================
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

function toggleExplanation(btn) {
    const box = btn.nextElementSibling;
    if(box.style.display === 'block') {
        box.style.display = 'none'; box.classList.remove('open');
    } else {
        box.style.display = 'block'; box.classList.add('open');
    }
}

function shuffleAndRender(tab = currentTab) {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    
    let dataList = tab === 'grammar' ? [...grammarData] : [...vocabData];
    shuffleArray(dataList); 

    const letters = ['A', 'B', 'C', 'D'];

    dataList.forEach((qObj, index) => {
        let displayNum = index + 1; // ترقيم يبدأ من 1 لكل قسم
        let shuffledOpts = [...qObj.opts];
        shuffleArray(shuffledOpts);

        let optsHTML = shuffledOpts.map((opt, i) => `
            <div class="option-box" data-correct="${opt.isCorrect ? 'true' : 'false'}" onclick="selectOption(this)">
                <div class="opt-letter">${letters[i]}</div>
                <div class="opt-content">
                    <div class="opt-en">${wrapWords(opt.en)}</div>
                    <div class="opt-ar">${opt.ar}</div>
                </div>
            </div>
        `).join('');

        let qHTML = `
            <div class="question-card">
                <div class="q-header">
                    <button class="btn-speak" onclick="speakQuestionArea(this)">🔊</button>
                    <div class="q-number">${displayNum}</div>
                    <div class="q-text-container">
                        <div class="en-text">${wrapWords(qObj.q)}</div>
                        <div class="ar-trans">${qObj.ar}</div>
                    </div>
                </div>
                <div class="options-grid">
                    ${optsHTML}
                </div>
                
                <button class="explain-toggle-btn" onclick="toggleExplanation(this)">💡 سبب الاختيار</button>
                <div class="explanation-box">
                    <div class="rule-title">القاعدة:</div>
                    <div class="rule-text">${formatExplanation(qObj.exp_ar)}</div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', qHTML);
    });
}

function selectOption(el) {
    if(isTestMode || autoPlayActive) return;
    const parent = el.closest('.options-grid');
    parent.querySelectorAll('.option-box').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
}

function checkAllAnswers() {
    if(autoPlayActive) return;
    let score = 0; let total = 0;
    document.querySelectorAll('.question-card').forEach(card => {
        total++;
        let isCorrect = false;
        card.querySelectorAll('.option-box').forEach(box => {
            box.classList.remove('correct', 'wrong');
            if(box.getAttribute('data-correct') === 'true') {
                box.classList.add('correct');
                if(box.classList.contains('selected')) isCorrect = true;
            } else if (box.classList.contains('selected')) {
                box.classList.add('wrong');
            }
        });
        if(isCorrect) score++;
    });
    alert(`النتيجة: ${score} من ${total}`);
}

function toggleTestMode() {
    isTestMode = !isTestMode;
    const btn = document.getElementById('testModeBtn');
    document.body.classList.toggle('test-mode', isTestMode);
    
    if(isTestMode) {
        btn.classList.add('active');
        btn.innerHTML = '🔴 وضع الاختبار (مُفعل)';
        window.speechSynthesis.cancel();
    } else {
        btn.classList.remove('active');
        btn.innerHTML = '🎯 وضع الاختبار الحقيقي';
    }
}

// ==========================================
// التتبع الجبري ونظام الاستماع التلقائي (Promises)
// ==========================================
const wait = ms => new Promise(res => setTimeout(res, ms));

function speakWordPromise(word, lang = 'en-US') {
    return new Promise(resolve => {
        if(!window.speechSynthesis) { resolve(); return; }
        let u = new SpeechSynthesisUtterance(word);
        u.lang = lang; u.rate = lang === 'en-US' ? 0.85 : 1.0;
        u.onend = resolve; u.onerror = resolve;
        window.speechSynthesis.speak(u);
        setTimeout(resolve, 900); // للحماية
    });
}

async function speakArea(container, lang = 'en-US') {
    const spans = container.querySelectorAll('.clickable-word');
    for(let span of spans) {
        if(!autoPlayActive && !container.classList.contains('manual-speak')) {
            window.speechSynthesis.cancel(); break;
        }
        let word = span.innerText.replace(/[.,_]/g, '').trim();
        if(!word) continue;
        
        let currentLang = span.classList.contains('eng-in-arabic') ? 'en-US' : lang;

        span.classList.add('highlight-yellow');
        await speakWordPromise(word, currentLang);
        span.classList.remove('highlight-yellow');
    }
}

async function speakQuestionArea(btn) {
    if(autoPlayActive) return;
    const card = btn.closest('.question-card');
    
    // إيقاف النطق إذا كان يعمل
    if(btn.classList.contains('speaking')) {
        btn.classList.remove('speaking');
        card.classList.remove('manual-speak');
        card.querySelector('.q-text-container').classList.remove('manual-speak');
        window.speechSynthesis.cancel();
        return;
    }

    // إيقاف أي سؤال آخر يعمل
    document.querySelectorAll('.btn-speak.speaking').forEach(b => {
        b.classList.remove('speaking');
        b.closest('.question-card').classList.remove('manual-speak');
        b.closest('.question-card').querySelector('.q-text-container').classList.remove('manual-speak');
    });
    window.speechSynthesis.cancel();

    btn.classList.add('speaking');
    card.classList.add('manual-speak');
    card.querySelector('.q-text-container').classList.add('manual-speak');
    
    await speakArea(card.querySelector('.q-text-container'), 'en-US');
    
    if(card.classList.contains('manual-speak')) {
        const options = card.querySelectorAll('.option-box');
        for(let opt of options) {
            if(!card.classList.contains('manual-speak')) break;
            await speakArea(opt.querySelector('.opt-content'), 'en-US');
            await wait(200);
        }
    }
    
    btn.classList.remove('speaking');
    card.classList.remove('manual-speak');
    card.querySelector('.q-text-container').classList.remove('manual-speak');
}

// Focus Mode العملاق
async function startFocusMode() {
    const btn = document.getElementById('autoPlayBtn');
    const overlay = document.getElementById('focus-overlay');
    const container = document.getElementById('quiz-container');

    if(autoPlayActive) {
        autoPlayActive = false;
        window.speechSynthesis.cancel();
        document.body.classList.remove('focus-mode');
        btn.innerHTML = '▶️ استماع تلقائي لجميع الأسئلة (Focus Mode)';
        if(overlay.firstChild) container.appendChild(overlay.firstChild);
        return;
    }

    autoPlayActive = true;
    document.body.classList.add('focus-mode');
    btn.innerHTML = '🛑 إيقاف الاستماع التلقائي';
    
    const cards = Array.from(container.querySelectorAll('.question-card'));

    for(let i=0; i<cards.length; i++) {
        if(!autoPlayActive) break;
        
        let card = cards[i];
        overlay.innerHTML = '';
        overlay.appendChild(card);
        card.scrollIntoView({behavior: 'smooth', block: 'center'});

        let qNum = card.querySelector('.q-number').innerText;
        await speakWordPromise(`Question number ${qNum}`);
        await wait(400);
        if(!autoPlayActive) break;

        await speakArea(card.querySelector('.q-text-container'));
        await wait(600);
        if(!autoPlayActive) break;

        const options = card.querySelectorAll('.option-box');
        for(let opt of options) {
            if(!autoPlayActive) break;
            let letter = opt.querySelector('.opt-letter').innerText;
            await speakWordPromise(`Option ${letter}`);
            await speakArea(opt.querySelector('.opt-content'));
            await wait(400);
        }

        if(!autoPlayActive) break;
        await wait(600);
        await speakWordPromise("The correct answer is");
        await wait(300);

        let correctOpt = Array.from(options).find(o => o.getAttribute('data-correct') === 'true');
        if(correctOpt && autoPlayActive) {
            correctOpt.classList.add('correct');
            let letter = correctOpt.querySelector('.opt-letter').innerText;
            await speakWordPromise(`Option ${letter}`);
            await speakArea(correctOpt.querySelector('.opt-content'));
            await wait(1000);
            correctOpt.classList.remove('correct');
        }

        if(!autoPlayActive) break;
        
        // قراءة القاعدة
        const ruleBox = card.querySelector('.explanation-box');
        if(ruleBox) {
            ruleBox.style.display = 'block';
            await speakWordPromise("القاعدة", "ar-SA");
            await wait(200);
            await speakArea(ruleBox.querySelector('.rule-text'), 'ar-SA');
            await wait(2000);
            ruleBox.style.display = 'none';
        }
        
        container.appendChild(card);
    }

    autoPlayActive = false;
    document.body.classList.remove('focus-mode');
    btn.innerHTML = '▶️ استماع تلقائي لجميع الأسئلة (Focus Mode)';
}
</script>
