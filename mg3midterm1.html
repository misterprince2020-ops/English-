        html { scroll-behavior: smooth; }
        * { box-sizing: border-box; }

        }
        
        .sub-title {

            color: #e67e22;
            font-size: 1.4em;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .group-control-bar { display: flex; justify-content: center; align-items: center; flex-direction: column; margin-bottom: 20px; background: #f1f5f9; padding: 15px; border-radius: 12px; border: 1px solid #cbd5e1; gap:10px;}
        .control-buttons-row { display: flex; gap: 15px; justify-content: center; width: 100%; flex-wrap: wrap;}
        
        .control-action-btn, .reset-shuffle-btn, .play-all-btn { color: white; border: none; padding: 12px 25px; font-size: 1.1em; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;}
        
        .play-all-btn { background-color: #10b981; margin-bottom: 10px; max-width: 820px;}
        .play-all-btn:hover { background-color: #059669; transform: translateY(-2px);}

        .control-action-btn { background-color: #2563eb; width: auto; flex:1; max-width: 400px;} 
        .control-action-btn:hover { background-color: #1d4ed8; transform: translateY(-2px);}
        
        .reset-shuffle-btn { background-color: #dc2626; width: auto; flex:1; max-width: 400px;} 
        .reset-shuffle-btn:hover { background-color: #b91c1c; transform: translateY(-2px);}

        .tab-buttons { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; flex-wrap: wrap; }
        .tab-btn { background-color: #f8f9fa; border: 2px solid #bdc3c7; cursor: pointer; padding: 12px 25px; font-size: 1.2em; font-weight: bold; color: #2c3e50; border-radius: 12px; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);}

        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .question-row { background: #ffffff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 25px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.3s;}

            color: #b91c1c; 
            font-size: 1.25em;
            font-weight: 900;
            background-color: #fef2f2;
            border-right: 4px solid #ef4444;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            direction: rtl;
            text-align: right;

        .explanation-word.highlight .en { background-color: #fde047; color: black; border-color: #eab308; }

        .btn-toggle { background-color: #10b981; color: white; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Tajawal'; font-weight: bold; font-size: 15px; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); transition: 0.3s;}
        .btn-toggle:hover { background-color: #059669; transform: translateY(-2px);}
        .btn-toggle.playing { background-color: #f59e0b; box-shadow: 0 4px 6px rgba(245, 158, 11, 0.2);}
        .btn-toggle.paused { background-color: #475569; } 
        
        .answer-action-container { width: 100%; display: flex; justify-content: flex-end; margin-top: 10px;}
        .btn-answer { background-color: #8b5cf6; color: white; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-family: 'Tajawal'; font-weight: bold; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 6px rgba(139, 92, 246, 0.2);}
        .btn-answer:hover { background-color: #7c3aed; transform: translateY(-2px);}
        
        .answer-box { margin-top: 15px; padding: 20px; background-color: #fefce8; border-right: 5px solid #eab308; border-radius: 8px; display: none; direction: rtl; text-align: right; animation: fadeIn 0.4s; width: 100%; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);}
        .correct-word-text { font-weight: bold; font-size: 20px; color: #1e293b; margin-bottom: 15px; line-height: 2.5;}
        .en-ans { display: inline-flex; align-items: flex-end; gap: 5px; flex-wrap: wrap; direction: ltr; vertical-align: middle; margin-right: 10px;}
        .grammar-explanation { padding: 15px; background-color: #eff6ff; border-right: 4px solid #3b82f6; border-radius: 6px; color: #1e293b; font-size: 19px; line-height: 2.2; font-family: 'Tajawal'; font-weight:bold; }
        
    </style>
</head>

                `;
                secDiv.appendChild(strictControl);

                // ** العلة كانت هنا: يجب إعطاء الـ ID الصحيح للـ container ليجده الـ querySelector **
                let strictContainer = document.createElement('div');
                strictContainer.className = 'strict-questions-container';
                
                sectionData.forEach((qObj) => {
                    strictContainer.appendChild(createQuestionBlock(qObj, true));
                });

                secDiv.appendChild(strictContainer);
                unitsContainer.appendChild(secDiv);
                
                // الخلط العشوائي الفوري
                doShuffle(qContainer);
                doShuffle(strictContainer);
            });
        }

        function createQuestionBlock(qObj, isStrict) {
            let block = document.createElement('div');
            block.className = 'question-row';
            let prefix = isStrict ? 'strict-' : '';
            block.id = `${prefix}q-${qObj.globalId}`;
            block.setAttribute('data-ans', qObj.o[qObj.c].split('|')[0].replace(/_/g, ' ').trim());
            block.setAttribute('data-base-id', qObj.globalId);

            let pairs = qObj.q.split(' ').map(p => p.trim()).filter(p => p !== '');
            
            let wordsHtml = `<span class="q-number-span" style="font-size: 24px; font-weight: bold; color: #e67e22; margin-right: 10px;"></span>`;
            
            wordsHtml += pairs.map(pair => {
                let pSplit = pair.split('|');
                let enW = pSplit[0]; let arW = pSplit[1] || enW; 
                let cleanW = enW.replace(/[^a-zA-Z0-9'-]/g, ''); 
                let safeWord = cleanW.replace(/"/g, '&quot;').replace(/'/g, '&apos;'); 
                
                if(isStrict) {
                    return `<span class="sound-only-word">${enW.replace(/_/g, ' ')}</span>`;
                } else {
                    let missingClass = enW.includes('_') ? ' missing-letter' : '';
                    return `<span class="word-group" data-speak="${safeWord}"><span class="en ${missingClass}">${enW.replace(/_/g, ' ')}</span><span class="ar">${arW.replace(/_/g, ' ')}</span></span>`;
                }
            }).join(' ');

            let letters = ["A", "B", "C", "D"];
            let optsHtml = `<div class="options-inline" id="${prefix}opts-area-${qObj.globalId}">` + qObj.o.map((opt, i) => {
                let optPairs = opt.trim().split(' ').filter(p => p !== '');
                let optWordsHtml = optPairs.map(op => {
                    let pSplit = op.split('|');
                    let enO = pSplit[0]; let arO = pSplit[1] || ''; 
                    let cw = enO.replace(/[^a-zA-Z0-9'-]/g, '');
                    let safeWord = cw.replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                    
                    if(isStrict) {
                        return `<span class="sound-only-word">${enO.replace(/_/g, ' ')}</span>`;
                    } else {
                        return `<span class="word-group" data-speak="${safeWord}"><span class="en">${enO.replace(/_/g, ' ')}</span><span class="ar">${arO.replace(/_/g, ' ')}</span></span>`;
                    }
                }).join(' ');
                
                return `<div class="opt-item" onclick="selectOption(this, event)"><div class="choice-badge">${letters[i]}</div><div class="${isStrict ? 'strict-choice-text' : 'choice-text'}">${optWordsHtml}</div></div>`;
            }).join('') + `</div>`;

            let correctOpt = qObj.o[qObj.c];
            let correctAnsHtml = correctOpt.split(' ').filter(p=>p!=='').map(pair => {
                let pSplit = pair.split('|');
                let enW = pSplit[0]; let arW = pSplit[1] || ''; 
                let cleanW = enW.replace(/[^a-zA-Z0-9'-]/g, '');
                let safeWord = cleanW.replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                return `<span class="word-group explanation-word" data-speak="${safeWord}"><span class="en">${enW.replace(/_/g, ' ')}</span><span class="ar">${arW.replace(/_/g, ' ')}</span></span>`;
            }).join(' ');

            let explanationHtml = qObj.e.replace(/([a-zA-Z0-9\-']+)\|([\u0600-\u06FF_]+)/g, function(match, en, ar) {
                let safeWord = en.replace(/'/g, '&apos;');
                return `<span class="word-group explanation-word" data-speak="${safeWord}"><span class="en">${en.replace(/_/g, ' ')}</span><span class="ar">${ar.replace(/_/g, ' ')}</span></span>`;
            });
            
            let translationHtml = (!isStrict && qObj.t) ? `<div class="full-sentence-translation">📝 ${qObj.t}</div>` : '';
            let btnPlayHtml = `<button id="${prefix}toggle-btn-${qObj.globalId}" class="btn-toggle" onclick="window.togglePlayQuestion('${qObj.globalId}', ${isStrict})">▶ تشغيل الصوت ${isStrict ? '' : '(مع الترجمة)'}</button>`;
            
            block.innerHTML = `
                <div class="q-header" ${isStrict ? 'style="display:none;"' : ''}>
                    ${btnPlayHtml}
                    <span style="color:#7f8c8d; font-weight:bold;">سؤال <span class="q-header-num"></span> <span class="emoji-icon" style="margin-left:10px;">🎓</span></span>
                </div>
                <div class="${isStrict ? 'strict-q-text' : 'q-text'}" id="${prefix}sent-area-${qObj.globalId}">${wordsHtml}</div>
                ${translationHtml}
                ${optsHtml}
                <div class="answer-action-container" ${isStrict ? 'style="display:none;"' : ''}>
                    <button class="btn-answer" id="${prefix}btn-ans-${qObj.globalId}" onclick="window.revealAnswer('${qObj.globalId}', ${isStrict})">👁️ إظهار الإجابة والشرح</button>
                </div>
                <div class="answer-box" id="${prefix}ans-box-${qObj.globalId}" ${isStrict ? 'style="display:none;"' : ''}>
                    <div class="correct-word-text">الإجابة الصحيحة هي: <span class="en-ans">${correctAnsHtml}</span></div>
                    <div class="grammar-explanation">💡 <strong>الشرح:</strong> <span dir="rtl">${explanationHtml}</span></div>
                </div>
            `;
            return block;
        }

        function updateQuestionNumbers(container) {
            let rows = container.querySelectorAll('.question-row');
            rows.forEach((row, index) => {
                let qNumSpan = row.querySelector('.q-number-span');
                if (qNumSpan) qNumSpan.textContent = (index + 1) + "- ";
                
                let headerNumSpan = row.querySelector('.q-header-num');
                if (headerNumSpan) headerNumSpan.textContent = (index + 1);
            });
        }

        window.selectOption = function(optItem, event) {
            if (event && (event.target.closest('.word-group') || event.target.closest('.sound-only-word'))) return;
            
            let row = optItem.closest('.question-row');
            if(row.classList.contains('answered')) return; 
            
            row.classList.add('answered');
            optItem.classList.add('selected');
            
            let targetAns = row.getAttribute('data-ans').toLowerCase().replace(/[^a-z0-9]/g, '');
            let selectedTextEl = optItem.querySelector('.choice-text, .strict-choice-text');
            let selectedText = selectedTextEl.textContent.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            
            let items = row.querySelectorAll('.opt-item');
            items.forEach(item => {
                let textEl = item.querySelector('.choice-text, .strict-choice-text');
                let text = textEl.textContent.trim().toLowerCase().replace(/[^a-z0-9]/g, ''); 
                if (text === targetAns) {
                    item.classList.add('correct');
                }
            });
            
            if (selectedText !== targetAns) {
                optItem.classList.add('wrong');
            }
        };

        function speakSmartText(text) {
            if (!synth) return;
            synth.cancel();
            let cleanText = text.replace(/[\._]/g, '').trim();
            if(!cleanText) return;
            let utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            synth.speak(utterance);
        }

        document.addEventListener('click', function(e) {
            const soundWord = e.target.closest('.sound-only-word');
            if(soundWord) {
                e.stopPropagation();
                document.querySelectorAll('.sound-only-word.active-word').forEach(w => { 
                    if(w !== soundWord) w.classList.remove('active-word'); 
                });
                soundWord.classList.add('active-word');
                let txt = soundWord.textContent.replace(/[\._]/g, '').trim();
                if(txt) speakSmartText(txt);
                setTimeout(() => { soundWord.classList.remove('active-word'); }, 1000);
                return;
            }

            let wg = e.target.closest('.word-group');
            if (wg) {
                let speakTextAttr = wg.getAttribute('data-speak');
                if (speakTextAttr && synth) {
                    if(activeQuestionId !== null && !isPaused) return; 
                    synth.cancel();
                    document.querySelectorAll('.word-group.highlight').forEach(el => el.classList.remove('highlight'));
                    wg.classList.add('highlight');
                    
                    let txt = speakTextAttr.replace(/[\._]/g, '').trim();
                    if(txt) {
                        let u = new SpeechSynthesisUtterance(txt);
                        u.lang = 'en-US'; u.rate = 0.85;
                        u.onend = function() { wg.classList.remove('highlight'); };
                        u.onerror = function() { wg.classList.remove('highlight'); };
                        synth.speak(u);
                        setTimeout(() => { wg.classList.remove('highlight'); }, Math.max(1000, txt.length * 100));
                    } else {
                        wg.classList.remove('highlight');
                    }
                }
            }
        });

        window.togglePlayAll = function(tabId, isStrict) {
            let mode = isStrict ? 'strict' : 'normal';
            let prefix = isStrict ? 'strict-' : '';
            let btnId = isStrict ? `play-all-btn-strict-${tabId}` : `play-all-btn-${tabId}`;
            let btn = document.getElementById(btnId);
            
            if (isAutoPlayingAll && currentPlayMode === mode && currentContainerId === tabId) {
                isAutoPlayingAll = false;
                synth.cancel();
                btn.innerHTML = isStrict ? '▶ تشغيل جميع الأسئلة تلقائياً (استماع فقط)' : '▶ تشغيل جميع الأسئلة تلقائياً (قراءة وترجمة)';
                btn.style.backgroundColor = isStrict ? '#dc2626' : '#10b981';
                
                if (activeQuestionId) {
                    let activeBtn = document.getElementById(`${prefix}toggle-btn-${activeQuestionId}`);
                    if (activeBtn) {
                        activeBtn.innerText = isStrict ? '▶ تشغيل الصوت' : '▶ تشغيل الصوت (مع الترجمة)';
                        activeBtn.classList.remove('playing', 'paused');
                    }
                    activeQuestionId = null;
                }
            } else {
                if (isAutoPlayingAll) {
                     let prevBtnId = currentPlayMode === 'strict' ? `play-all-btn-strict-${currentContainerId}` : `play-all-btn-${currentContainerId}`;
                     let prevBtn = document.getElementById(prevBtnId);
                     if(prevBtn) {
                         prevBtn.innerHTML = currentPlayMode === 'strict' ? '▶ تشغيل جميع الأسئلة تلقائياً (استماع فقط)' : '▶ تشغيل جميع الأسئلة تلقائياً (قراءة وترجمة)';
                         prevBtn.style.backgroundColor = currentPlayMode === 'strict' ? '#dc2626' : '#10b981';
                     }
                     synth.cancel();
                }

                let containerSelector = isStrict ? `#${tabId} .strict-questions-container` : `#${tabId} .questions-container`;
                let container = document.querySelector(containerSelector);
                if(!container) return;
                
                let rows = Array.from(container.querySelectorAll('.question-row'));
                autoPlayQueue = rows.map(r => r.getAttribute('data-base-id'));
                autoPlayCurrentIndex = 0;
                isAutoPlayingAll = true;
                currentContainerId = tabId;
                currentPlayMode = mode;
                
                btn.innerHTML = '⏹ إيقاف التشغيل التلقائي';
                btn.style.backgroundColor = '#f59e0b';
                
                playQuestionFromQueue();
            }
        };

        function playQuestionFromQueue() {
            if(!isAutoPlayingAll || autoPlayCurrentIndex >= autoPlayQueue.length) {
                isAutoPlayingAll = false;
                let btn = document.getElementById(currentPlayMode === 'strict' ? `play-all-btn-strict-${currentContainerId}` : `play-all-btn-${currentContainerId}`);
                if(btn) {
                    btn.innerHTML = currentPlayMode === 'strict' ? '▶ تشغيل جميع الأسئلة تلقائياً (استماع فقط)' : '▶ تشغيل جميع الأسئلة تلقائياً (قراءة وترجمة)';
                    btn.style.backgroundColor = currentPlayMode === 'strict' ? '#dc2626' : '#10b981';
                }
                return;
            }
            
            let nextId = autoPlayQueue[autoPlayCurrentIndex];
            let prefix = currentPlayMode === 'strict' ? 'strict-' : '';
            let row = document.getElementById(`${prefix}q-${nextId}`);
            
            if(row) {
                row.scrollIntoView({behavior: 'smooth', block: 'center'});
            }
            
            if (activeQuestionId && activeQuestionId !== nextId) {
                synth.cancel();
                let prevBtn = document.getElementById(`${prefix}toggle-btn-${activeQuestionId}`);
                if(prevBtn) {
                    prevBtn.innerText = currentPlayMode === 'strict' ? '▶ تشغيل الصوت' : '▶ تشغيل الصوت (مع الترجمة)';
                    prevBtn.classList.remove('playing', 'paused');
                }
                document.querySelectorAll('.word-group.highlight, .sound-only-word.active-word').forEach(el => el.classList.remove('highlight', 'active-word'));
            }
            
            activeQuestionId = nextId; 
            activeIsStrict = currentPlayMode === 'strict';
            isPaused = false;
            cancelForPause = false;
            
            let btn = document.getElementById(`${prefix}toggle-btn-${nextId}`);
            if(btn) {
                btn.innerText = '⏸ إيقاف مؤقت'; 
                btn.classList.add('playing');
            }
            
            buildSequenceForQuestion(nextId, activeIsStrict);
            currentSeqIndex = 0;
            playNextInSequence();
        }

        window.togglePlayQuestion = function(id, isStrict) {
            if(!synth) return;
            let prefix = isStrict ? 'strict-' : '';
            let btn = document.getElementById(`${prefix}toggle-btn-${id}`);
            
            if (activeQuestionId === id && activeIsStrict === isStrict) {
                if (isPaused) { 
                    isPaused = false; 
                    btn.innerText = '⏸ إيقاف مؤقت'; 
                    btn.classList.remove('paused');
                    btn.classList.add('playing'); 
                    playNextInSequence(); 
                } else { 
                    isPaused = true; 
                    btn.innerText = '▶ استئناف'; 
                    btn.classList.remove('playing'); 
                    btn.classList.add('paused');
                    cancelForPause = true; 
                    synth.cancel(); 
                }
                return;
            }
            
            if (activeQuestionId !== null) { 
                let prevPrefix = activeIsStrict ? 'strict-' : '';
                synth.cancel(); 
                document.querySelectorAll('.word-group.highlight, .sound-only-word.active-word').forEach(el => el.classList.remove('highlight', 'active-word')); 
                let prevBtn = document.getElementById(`${prevPrefix}toggle-btn-${activeQuestionId}`);
                if(prevBtn) {
                    prevBtn.innerText = activeIsStrict ? '▶ تشغيل الصوت' : '▶ تشغيل الصوت (مع الترجمة)';
                    prevBtn.classList.remove('playing', 'paused');
                }
            }
            
            activeQuestionId = id; 
            activeIsStrict = isStrict;
            isPaused = false;
            
            btn.innerText = '⏸ إيقاف مؤقت'; 
            btn.classList.add('playing');
            cancelForPause = false;
            
            buildSequenceForQuestion(id, isStrict);
            currentSeqIndex = 0;
            playNextInSequence();
        };

        window.buildSequenceForQuestion = function(id, isStrict) {
            currentSequence = [];
            let prefix = isStrict ? 'strict-' : '';
            
            let sentArea = document.getElementById(`${prefix}sent-area-${id}`);
            if(sentArea) {
                sentArea.querySelectorAll(isStrict ? '.sound-only-word' : '.word-group').forEach(w => {
                    let speakText = isStrict ? w.textContent : w.getAttribute('data-speak');
                    if (speakText) speakText = speakText.replace(/[\._]/g, '').trim();
                    if(speakText) currentSequence.push({type: 'word', text: speakText, element: w});
                });
            }

            let optsArea = document.getElementById(`${prefix}opts-area-${id}`);
            if(optsArea) {
                optsArea.querySelectorAll('.opt-item').forEach((optItem) => {
                    optItem.querySelectorAll(isStrict ? '.sound-only-word' : '.word-group').forEach(w => {
                        let speakText = isStrict ? w.textContent : w.getAttribute('data-speak');
                        if (speakText) speakText = speakText.replace(/[\._]/g, '').trim();
                        if(speakText) currentSequence.push({type: 'word', text: speakText, element: w, container: optItem});
                    });
                });
            }
        };

        window.playNextInSequence = function() {
            if(!synth || isPaused || activeQuestionId === null) return; 

            if (currentSeqIndex >= currentSequence.length) { 
                document.querySelectorAll('.word-group.highlight, .sound-only-word.active-word').forEach(el => el.classList.remove('highlight', 'active-word'));
                let prefix = activeIsStrict ? 'strict-' : '';
                let btn = document.getElementById(`${prefix}toggle-btn-${activeQuestionId}`);
                if(btn) { 
                    btn.innerText = activeIsStrict ? '▶ تشغيل الصوت' : '▶ تشغيل الصوت (مع الترجمة)';
                    btn.classList.remove('playing', 'paused'); 
                }
                activeQuestionId = null;
                
                if (isAutoPlayingAll) {
                    autoPlayCurrentIndex++;
                    setTimeout(() => {
                        playQuestionFromQueue();
                    }, 1200); 
                }
                return; 
            }

            let item = currentSequence[currentSeqIndex];
            
            if (!item.text) {
                currentSeqIndex++;
                playNextInSequence();
                return;
            }

            document.querySelectorAll('.word-group.highlight, .sound-only-word.active-word').forEach(el => el.classList.remove('highlight', 'active-word'));

            if (item.element) item.element.classList.add(activeIsStrict ? 'active-word' : 'highlight'); 

            let u = new SpeechSynthesisUtterance(item.text); u.lang = 'en-US'; u.rate = 0.85;
            
            u.onend = function() {
                if (cancelForPause) { cancelForPause = false; return; }
                if (item.element) item.element.classList.remove('highlight', 'active-word');
                currentSeqIndex++; 
                if(!isPaused) playNextInSequence();
            };
            u.onerror = function() { 
                if (cancelForPause) { cancelForPause = false; return; }
                if (item.element) item.element.classList.remove('highlight', 'active-word');
                currentSeqIndex++; 
                if(!isPaused) playNextInSequence(); 
            };
            synth.speak(u);
        };

        window.openTab = function(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        };

        window.revealAnswer = function(id, isStrict = false) {
            let prefix = isStrict ? 'strict-' : '';
            let box = document.getElementById(`${prefix}ans-box-${id}`); 
            let btn = document.getElementById(`${prefix}btn-ans-${id}`);
            
            if (box.style.display === 'none' || box.style.display === '') { 
                box.style.display = 'block'; 
                btn.innerHTML = '🙈 إخفاء الإجابة والشرح'; 
            } else { 
                box.style.display = 'none'; 
                btn.innerHTML = '👁️ إظهار الإجابة والشرح'; 
            }
        };

        window.showSectionResult = function(tabId) {
            let container = document.querySelector(`#${tabId} .questions-container`);
            let rows = container.querySelectorAll('.question-row');
            let correctCount = container.querySelectorAll('.opt-item.selected.correct').length;
            let totalCount = rows.length;
            
            let resId = `res-${tabId}`;
            let msg = `النتيجة: ${correctCount} / ${totalCount}`;
            if(correctCount === totalCount) msg += " 🏆 أسطورة!";
            else if(correctCount >= totalCount/2) msg += " 🌟 بطل!";
            else msg += " 📚 حاول مجدداً!";
            
            let resEl = document.getElementById(resId);
            resEl.textContent = msg;
            resEl.style.display = "block";
        };

        window.showStrictResult = function(tabId) {
            let container = document.querySelector(`#${tabId} .strict-questions-container`);
            let rows = container.querySelectorAll('.question-row');
            let correctCount = container.querySelectorAll('.opt-item.selected.correct').length;
            let totalCount = rows.length;
            
            let resId = `strict-res-${tabId}`;
            let msg = `النتيجة: ${correctCount} / ${totalCount}`;
            if(correctCount === totalCount) msg += " 🏆 أسطورة!";
            else if(correctCount >= totalCount/2) msg += " 🌟 بطل!";
            else msg += " 📚 حاول مجدداً!";
            
            let resEl = document.getElementById(resId);
            resEl.textContent = msg;
            resEl.style.display = "block";
        };

        window.resetAndShuffle = function(tabId) {
            document.getElementById(`res-${tabId}`).style.display = 'none';
            if(isAutoPlayingAll && currentContainerId === tabId && currentPlayMode === 'normal') {
                isAutoPlayingAll = false;
                synth.cancel();
                let btn = document.getElementById(`play-all-btn-${tabId}`);
                if(btn) { btn.innerHTML = '▶ تشغيل جميع الأسئلة تلقائياً (قراءة وترجمة)'; btn.style.backgroundColor = '#10b981'; }
            }
            let container = document.querySelector(`#${tabId} .questions-container`);
            doShuffle(container);
        };

        window.resetAndShuffleStrict = function(tabId) {
            document.getElementById(`strict-res-${tabId}`).style.display = 'none';
            if(isAutoPlayingAll && currentContainerId === tabId && currentPlayMode === 'strict') {
                isAutoPlayingAll = false;
                synth.cancel();
                let btn = document.getElementById(`play-all-btn-strict-${tabId}`);
                if(btn) { btn.innerHTML = '▶ تشغيل جميع الأسئلة تلقائياً (استماع فقط)'; btn.style.backgroundColor = '#dc2626'; }
            }
            let container = document.querySelector(`#${tabId} .strict-questions-container`);
            doShuffle(container);
        };

        function doShuffle(container) {
            let rows = Array.from(container.querySelectorAll('.question-row'));
            
            rows.forEach(row => {
                row.classList.remove('answered');
                row.querySelectorAll('.opt-item').forEach(item => {
                    item.classList.remove('selected', 'correct', 'wrong');
                });
            });

            // خلط الخيارات داخلياً
            rows.forEach(row => {
                let optContainer = row.querySelector('.options-inline');
                let opts = Array.from(optContainer.querySelectorAll('.opt-item'));
                let letters = ["A", "B", "C", "D"];
                
                for (let i = opts.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    optContainer.appendChild(opts[j]);
                    let temp = opts[i];
                    opts[i] = opts[j];
                    opts[j] = temp;
                }
                
                let shuffledOpts = Array.from(optContainer.querySelectorAll('.opt-item'));
                shuffledOpts.forEach((opt, idx) => {
                    opt.querySelector('.choice-badge').textContent = letters[idx];
                });
            });

            // خلط الأسئلة
            for (let i = rows.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                container.appendChild(rows[j]);
                let temp = rows[i];
                rows[i] = rows[j];
                rows[j] = temp;
            }
            
            updateQuestionNumbers(container);
        }

        buildApp();

    } catch (e) {
        document.body.innerHTML += '<div style="color:white; background:#e74c3c; padding:20px; font-size:18px; text-align:right; direction:rtl; margin-top:20px; border-radius:10px; font-family:monospace; box-shadow: 0 4px 10px rgba(0,0,0,0.2);"><b>خطأ برمجي (تم اصطياده):</b><br>' + e.message + '</div>';
        console.error(e);
    }
})();
</script>
