<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIS 110 - Official Listening Master (10 Passages)</title>
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --success-color: #059669;
            --success-hover: #047857;
            --success-bg: #d1fae5;
            --success-border: #047857;
            --translate-color: #dc2626;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --btn-reset-bg: #64748b;
            --btn-reset-hover: #475569;
            --exam-mode-bg: #fff1f2;
            --exam-border: #e11d48;
            --highlight-answer: #fef08a;
            --audio-btn-bg: #0ea5e9;
            --audio-btn-hover: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        /* Top Bar Mode Switcher */
        .mode-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .mode-btn {
            background-color: #e2e8f0;
            border: 2px solid #cbd5e1;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #334155;
            transition: all 0.2s;
        }

        .mode-btn.active-practice {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .mode-btn.active-exam {
            background-color: #e11d48;
            color: white;
            border-color: #e11d48;
        }

        /* Tabs Navigation for 10 Listening Passages */
        .tabs-nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #475569;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background-color: #cbd5e1;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
            transition: border-color 0.3s;
        }

        .exam-mode-active .section-box {
            border: 2px solid var(--exam-border);
            background-color: var(--exam-mode-bg);
        }

        h2 {
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            color: #1e293b;
            margin-top: 0;
            font-size: 1.4rem;
        }

        /* Audio Player Bar */
        .audio-bar {
            background: #e0f2fe;
            border: 2px solid #bae6fd;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .audio-title {
            font-weight: bold;
            color: #0369a1;
            font-size: 1.05rem;
        }

        button.audio-btn {
            background-color: var(--audio-btn-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            box-shadow: 0 2px 5px rgba(2, 132, 199, 0.2);
        }

        button.audio-btn:hover {
            background-color: var(--audio-btn-hover);
        }

        /* Reading Passage Box */
        .passage-box {
            background: #f8fafc;
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 1.05rem;
            border: 1px solid #e2e8f0;
        }

        .passage-paragraph {
            margin: 10px 0;
            padding: 6px 10px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .passage-paragraph.highlight-target {
            background-color: var(--highlight-answer);
            border: 2px dashed #ca8a04;
        }

        .paragraph-ar {
            color: var(--translate-color);
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 2px;
        }

        .score-board {
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--translate-color);
            background-color: #fef2f2;
            border: 2px dashed #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button.btn-action {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        button.btn-action:hover {
            background-color: var(--success-hover);
        }

        button.btn-reset {
            background-color: var(--btn-reset-bg);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        button.btn-reset:hover {
            background-color: var(--btn-reset-hover);
        }

        /* Clickable Words & Translation without Box */
        .word-wrapper {
            position: relative;
            display: inline-block;
            margin: 0 2px;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: background 0.15s;
        }

        .word-wrapper:hover {
            background-color: #e2e8f0;
        }

        .word-wrapper.active-word {
            background-color: #fef08a !important;
        }

        .word-trans {
            display: none;
            position: absolute;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            color: var(--translate-color);
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
        }

        /* Multiple Choice Styles */
        .mc-question-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 22px;
            transition: box-shadow 0.2s;
        }

        .exam-mode-active .mc-question-card {
            background: #ffffff;
            border-color: #fda4af;
        }

        .mc-question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .mc-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mc-option {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .mc-option:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }

        .mc-option.correct-choice {
            background-color: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: #065f46;
            font-weight: bold;
        }

        .mc-option.wrong-choice {
            background-color: #fee2e2 !important;
            border-color: var(--translate-color) !important;
            color: #991b1b;
        }
    </style>
</head>

    <h1>ELIS 110 - Official Listening Master</h1>
    <div class="subtitle">10 نماذج اختبارات استماع تفاعلية (مع زر تشغيل وإيقاف الصوت بضغطة واحدة)</div>

        <button id="btn-exam-mode" class="mode-btn" onclick="setExamMode(true)">وضع الاختبار الصارم (بدون نطق أو ترجمة)</button>
    </div>

    <!-- شريط التبويبات لقطع الاستماع العشرة -->
    <div class="tabs-nav" id="listening-nav"></div>

    <!-- حاويات قطع الاستماع -->
    <div id="tabs-container"></div>

</div>

        "weather": "طقس", "hot": "حار", "cold": "بارد", "rain": "مطر", "city": "مدينة", "town": "بلدة"

    let isExamMode = false;

    function setExamMode(examState) {
        isExamMode = examState;
        const mainContainer = document.getElementById('main-container');
        const btnPrac = document.getElementById('btn-practice-mode');
        const btnExam = document.getElementById('btn-exam-mode');

        if (isExamMode) {
            mainContainer.classList.add('exam-mode-active');
            btnPrac.classList.remove('active-practice');
            btnExam.classList.add('active-exam');
            window.speechSynthesis.cancel();
            resetAllAudioButtons();
            alert("تم تفعيل وضع الاختبار الصارم: تم إيقاف الصوت والترجمة نهائياً.");
        } else {
            mainContainer.classList.remove('exam-mode-active');
            btnPrac.classList.add('active-practice');
            btnExam.classList.remove('active-exam');
        }
        buildAllListeningPassages();
    }

    function getWordTranslation(word) {
        let clean = word.replace(/[^a-zA-Z]/g, '').toLowerCase();
        if (!clean) return '';
        if (dictionary[clean]) return dictionary[clean];
        if (clean.endsWith('s') && dictionary[clean.slice(0, -1)]) return dictionary[clean.slice(0, -1)];
        if (clean.endsWith('ed') && dictionary[clean.slice(0, -2)]) return dictionary[clean.slice(0, -2)];
        if (clean.endsWith('ing') && dictionary[clean.slice(0, -3)]) return dictionary[clean.slice(0, -3)];
        return clean;
    }

    function speakText(text) {
        if (isExamMode) return;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderClickableText(text) {
        if (isExamMode) return text;
        const words = text.split(' ');
        return words.map(word => {
            const cleanWord = word.replace(/[^a-zA-Z]/g, '');
            const translation = getWordTranslation(word);
            return `<span class="word-wrapper" onclick="handleWordClick(event, this, '${word}', '${translation}')">
                <span class="word-trans">${translation}</span>${word}
            </span>`;
        }).join(' ');
    }

    function handleWordClick(event, element, word, translation) {
        if (isExamMode) return;
        event.stopPropagation();
        const container = element.closest('.tab-content');
        if (container) {
            container.querySelectorAll('.word-trans').forEach(el => el.style.display = 'none');
            container.querySelectorAll('.word-wrapper').forEach(el => el.classList.remove('active-word'));
        }
        element.classList.add('active-word');
        const transSpan = element.querySelector('.word-trans');
        if (transSpan) transSpan.style.display = 'block';

        const cleanWord = word.replace(/[^a-zA-Z]/g, '');
        if (cleanWord) speakText(cleanWord);
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.word-trans').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.word-wrapper').forEach(el => el.classList.remove('active-word'));
    });

    function switchTab(index) {
        window.speechSynthesis.cancel();
        resetAllAudioButtons();
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === index);
        });
        document.querySelectorAll('.tab-content').forEach((content, idx) => {
            content.classList.toggle('active', idx === index);
        });

    function buildAllListeningPassages() {
        const nav = document.getElementById('listening-nav');
        const container = document.getElementById('tabs-container');
        nav.innerHTML = '';
        container.innerHTML = '';

        listeningData.forEach((passage, pIndex) => {
            const modelNum = pIndex + 1;

            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn ${pIndex === 0 ? 'active' : ''}`;
            tabBtn.innerText = `قطعة الاستماع ${modelNum}`;
            tabBtn.onclick = () => switchTab(pIndex);
            nav.appendChild(tabBtn);

            const tabDiv = document.createElement('div');
            tabDiv.id = `tab-${pIndex}`;
            tabDiv.className = `tab-content ${pIndex === 0 ? 'active' : ''}`;

            tabDiv.innerHTML = `
                <div class="section-box">
                    <h2>${passage.title}</h2>
                    
                    <!-- شريط الصوت وزر التشغيل والإيقاف المدمج -->
                    <div class="audio-bar">
                        <div class="audio-title">🎧 استمع إلى القطعة الصوتية للإجابة على الأسئلة</div>
                        <button class="audio-btn" id="audio-btn-${pIndex}" onclick="toggleListeningAudio(${pIndex}, this)">
                            🔊 تشغيل الصوت (Play Audio)
                        </button>
                    </div>

                    <div class="score-board" id="score-top-${modelNum}"></div>

                    <div class="controls">
                        <button class="btn-action" onclick="showListeningAnswer(${pIndex})">عرض النتيجة</button>
                        <button class="btn-reset" onclick="initListening(${pIndex})">إعادة ترتيب الأسئلة</button>
                    </div>

                    <div id="questions-container-${pIndex}"></div>

                    <div class="controls" style="margin-top: 30px;">
                        <button class="btn-action" onclick="showListeningAnswer(${pIndex})">عرض النتيجة</button>
                        <button class="btn-reset" onclick="initListening(${pIndex})">إعادة ترتيب الأسئلة</button>
                    </div>

                    <div class="score-board" id="score-bottom-${modelNum}"></div>
                </div>
            `;
            container.appendChild(tabDiv);

            initListening(pIndex);
        });
    }

    function toggleListeningAudio(pIndex, btn) {
        if (isExamMode) {
            alert("عذراً، وضع الاختبار الصارم مفعل ولا يمكن تشغيل الصوت.");
            return;
        }

        if ('speechSynthesis' in window) {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                resetAllAudioButtons();
                return;
            }

            resetAllAudioButtons();
            const textToSpeech = listeningData[pIndex].audioText;
            const utterance = new SpeechSynthesisUtterance(textToSpeech);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;

            btn.innerHTML = "⏹️ إيقاف الصوت (Stop Audio)";
            btn.style.backgroundColor = "#e11d48";

            utterance.onend = function() {
                btn.innerHTML = "🔊 تشغيل الصوت (Play Audio)";
                btn.style.backgroundColor = "";
            };

            utterance.onerror = function() {
                btn.innerHTML = "🔊 تشغيل الصوت (Play Audio)";
                btn.style.backgroundColor = "";
            };

            window.speechSynthesis.speak(utterance);
        }
    }

    function resetAllAudioButtons() {
        document.querySelectorAll('.audio-btn').forEach(b => {
            b.innerHTML = "🔊 تشغيل الصوت (Play Audio)";
            b.style.backgroundColor = "";
        });
    }

    function initListening(pIndex) {
        const modelNum = pIndex + 1;
        const qContainer = document.getElementById(`questions-container-${pIndex}`);
        qContainer.innerHTML = '';

        document.getElementById(`score-top-${modelNum}`).style.display = 'none';
        document.getElementById(`score-bottom-${modelNum}`).style.display = 'none';

        const passage = listeningData[pIndex];
        const shuffledQ = [...passage.questions].sort(() => Math.random() - 0.5);

        shuffledQ.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'mc-question-card';
            card.dataset.userCorrect = "false";

            const origCorrect = item.options[item.correct];
            const shuffledOpts = [...item.options].sort(() => Math.random() - 0.5);
            const newCorrIdx = shuffledOpts.indexOf(origCorrect);
            card.dataset.correctIndex = newCorrIdx;

            let optsHtml = '';
            shuffledOpts.forEach((opt, optIdx) => {
                const renderedOpt = renderClickableText(opt);
                optsHtml += `<div class="mc-option" onclick="checkChoice(this, event, ${optIdx}, ${newCorrIdx})">${renderedOpt}</div>`;
            });

            const dispNum = index + 1;
            const qText = renderClickableText(`${dispNum}. ${item.q}`);

            let passageHtml = '';
            passage.paragraphs.forEach((p, pIdx) => {
                const isHighlight = (pIdx === item.targetPara) ? 'highlight-target' : '';
                passageHtml += `
                    <div class="passage-paragraph ${isHighlight}">
                        <div class="paragraph-en">${renderClickableText(p.en)}</div>
                        <div class="paragraph-ar">${p.ar}</div>
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="passage-box" style="margin-bottom: 15px;">
                    <strong>📖 Listening Script Reference (الفقرة المميزة بالأصفر توضح مكان الإجابة):</strong>
                    ${passageHtml}
                </div>
                <div class="mc-question-text">${qText}</div>
                <div class="mc-options">${optsHtml}</div>
            `;
            qContainer.appendChild(card);
        });
    }

    function checkChoice(element, event, selectedIndex, correctIndex) {
        if (!isExamMode && event && event.target.closest('.word-wrapper')) {
            return;
        }

        const parentCard = element.closest('.mc-question-card');
        const options = parentCard.querySelectorAll('.mc-option');
        if (parentCard.dataset.answered === "true") return;

        parentCard.dataset.userSelected = selectedIndex;

        if (selectedIndex === correctIndex) {
            element.classList.add('correct-choice');
            parentCard.dataset.userCorrect = "true";
        } else {
            element.classList.add('wrong-choice');
            options[correctIndex].classList.add('correct-choice');
            parentCard.dataset.userCorrect = "false";
        }
        parentCard.dataset.answered = "true";
    }

    function showListeningAnswer(pIndex) {
        const modelNum = pIndex + 1;
        const tabDiv = document.getElementById(`tab-${pIndex}`);
        const cards = tabDiv.querySelectorAll('.mc-question-card');
        let score = 0;

        cards.forEach(card => {
            const options = card.querySelectorAll('.mc-option');
            const correctIdx = parseInt(card.dataset.correctIndex);

            options.forEach((opt, idx) => {
                if (idx === correctIdx) {
                    opt.classList.add('correct-choice');
                }
            });

            if (card.dataset.userCorrect === "true") {
                score++;
            }
            card.dataset.answered = "true";
        });

        const scoreMessage = `النتيجة النهائية لاختبار الاستماع ${modelNum}: ${score} من 8`;
        
        const topScore = document.getElementById(`score-top-${modelNum}`);
        const bottomScore = document.getElementById(`score-bottom-${modelNum}`);
        
        topScore.innerText = scoreMessage;
        topScore.style.display = 'block';
        
        bottomScore.innerText = scoreMessage;
        bottomScore.style.display = 'block';
    }

    window.onload = function() {
        buildAllListeningPassages();
    };
</script>
