<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة التدريبات الإنجليزية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff; /* لون خلفية أزرق فاتح مريح للعين */
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            margin-top: 20px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* المسافة بين الأزرار */
        }
        .btn {
            display: block;
            width: 85%;
            max-width: 300px;
            padding: 15px;
            background-color: #007bff; /* لون الزر أزرق */
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px; /* جعل أطراف الزر دائرية */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* ظل خفيف للزر */
            border: 2px solid #0056b3;
        }
    </style>
</head>
<body>

    <h1>مكتبة الأستاذ حمادة</h1>
    <p>اختر التدريب الذي تريد البدء فيه:</p>
    
    <div class="button-container">
        <!-- الأزرار التي سيضغط عليها الطالب -->
        <a href="step.html" class="btn">تدريب STEP الأساسي</a>
        <a href="step50.html" class="btn">تدريب STEP (50)</a>
        <a href="vocabulary.html" class="btn">تدريب الكلمات (Vocabulary)</a>
    </div>

</body>
</html>
