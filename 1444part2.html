{q:"In which of the following phases do teachers have the opportunity to consider the success of the learning process used and to make modifications to subsequent teaching?", o:["A. Reflection | مرحلة التأمل والتقييم الذاتي", "B. preparation | مرحلة الإعداد والتحضير", "C. Administration | مرحلة الإدارة والتنفيذ", "D. Implementation | مرحلة التطبيق داخل الفصل"], c:0, t:"في أي مرحلة تتاح للمعلمين فرصة النظر في نجاح عملية التعلم وإجراء تعديلات للتدريس اللاحق؟", e:"<span class='box-hint'>من تجميعات 1444: التأمل (Reflection) هو مراجعة المعلم لأدائه بعد الدرس لتحديد ما نجح وما يحتاج تحسين.</span>"},
{q:"In a writing lesson, students are asked to write a process essay. The teacher distributes worksheets with empty ........ to be used in the outline phase", o:["A. Venn diagram | مخطط فين الثنائي", "B. cycle graph | مخطط أو رسم بياني دائري دوري", "C. mind maps | خرائط ذهنية شجرية", "D. T-charts | جداول T للمقارنة"], c:1, t:"في مقال عن الخطوات والعمليات (Process essay)، وزع المعلم أوراقاً بها ........ فارغة لتستخدم في مرحلة التخطيط.", e:"<span class='box-hint'>من تجميعات 1444: لشرح 'عملية' أو خطوات متتابعة، يكون المخطط الدوري أو الانسيابي (Cycle graph/Flowchart) هو الأنسب.</span>"},
{q:"Which of the following practices discourage students participation in the class?", o:["A. Giving them immediate criticism | توجيه الانتقاد المباشر والفوري لهم", "B. Making participation optional | جعل المشاركة اختيارية", "C. Giving anonymous feedback | تقديم تغذية راجعة دون كشف الأسماء", "D. Linking participation to grades | ربط المشاركة بالدرجات الأكاديمية"], c:0, t:"أي من الممارسات التالية تثبط وتعيق مشاركة الطلاب في الفصل؟", e:"<span class='box-hint'>من تجميعات 1444: النقد الفوري والمباشر (Immediate criticism) يحطم ثقة الطالب ويجعله يتردد في المشاركة مجدداً.</span>"},
{q:"A teenage learner's difficulty in pronouncing certain sounds of a foreign language is most likely attributed to ........", o:["A. physical difficulties | صعوبات جسدية", "B. learning disabilities | إعاقات أو صعوبات تعلم", "C. self-consciousness | الخجل والوعي المفرط بالذات", "D. stress | الضغط النفسي"], c:2, t:"صعوبة المتعلم المراهق في نطق أصوات معينة للغة أجنبية تُعزى غالباً إلى ........", e:"<span class='box-hint'>من تجميعات 1444: المراهقون يعانون من حساسية مفرطة تجاه صورتهم أمام زملائهم (Self-consciousness) مما يعيق جرأتهم في النطق.</span>"},
{q:"What is not suitable in teaching practice to enhance L2 learners' motivation?", o:["A. Making U-shape seating arrangements | ترتيب المقاعد بشكل حرف U", "B. Engaging pair-group work | تشجيع العمل الثنائي", "C. Correcting every mistake for accuracy | تصحيح كل خطأ فوراً من أجل الدقة", "D. Total use of L1 when the instructions misunderstood | الاستخدام الكلي للغة الأم عند سوء الفهم"], c:2, t:"ما هو الممارسة غير المناسبة لتعزيز دافعية متعلمي اللغة الثانية؟", e:"<span class='box-hint'>من تجميعات 1444: مقاطعة الطالب لتصحيح كل خطأ (Correcting every mistake) يُفقده الثقة والدافعية.</span>"},
{q:"One kinds of essay where you employ logic and evidence to convince a reader to accept your point of view. This refers to a/an ........ essay.", o:["A. narrative | مقال سردي (قصصي)", "B. expository | مقال تفسيري (معلوماتي)", "C. persuasive | مقال إقناعي (جدلي)", "D. descriptive | مقال وصفي"], c:2, t:"المقال الذي توظف فيه المنطق والأدلة لإقناع القارئ بقبول وجهة نظرك هو المقال:", e:"<span class='box-hint'>من تجميعات 1444: المقال الذي يسعى للإقناع بالأدلة يسمى Persuasive essay.</span>"},
{q:"To measure the highest level of critical thinking, you should ........", o:["A. answer who and what questions | الإجابة عن أسئلة بسيطة (من وماذا)", "B. study a rule and then form examples | دراسة قاعدة ثم صياغة أمثلة عليها", "C. use the difference between the past tense and the present continuous | استخدام الفرق بين الأزمان النحوية", "D. Evaluate and analyze information to form judgments | تقييم وتحليل المعلومات لتكوين أحكام واستنتاجات"], c:3, t:"لقياس أعلى مستويات التفكير النقدي، يجب عليك ........", e:"<span class='box-hint'>من تجميعات 1444: أعلى مستويات بلوم للتفكير النقدي تتطلب التقييم وإصدار الأحكام بناءً على معايير.</span>"},
{q:"Grammarly program is used in ........ skill.", o:["A. writing | مهارة الكتابة", "B. speaking | مهارة التحدث", "C. listening | مهارة الاستماع", "D. reading | مهارة القراءة"], c:0, t:"برنامج 'جرامرلي' (Grammarly) يُستخدم بشكل أساسي لدعم مهارة ........", e:"<span class='box-hint'>من تجميعات 1444: Grammarly هو مساعد ذكاء اصطناعي لتدقيق وتحسين النصوص المكتوبة (Writing).</span>"},
{q:"Listening allows the listener to analyze common messages before accepting or rejecting it. This refers to ........ listening.", o:["A. critical | الاستماع النقدي أو التحليلي", "B. selective | الاستماع الانتقائي", "C. therapeutic | الاستماع العلاجي العاطفي", "D. appreciative | الاستماع التقديري للتذوق"], c:0, t:"تحليل الرسائل قبل قبولها أو رفضها يشير إلى الاستماع ........", e:"<span class='box-hint'>من تجميعات 1444: الاستماع الذي يتضمن التقييم والتحليل والفرز هو الاستماع النقدي (Critical listening).</span>"},
{q:"Which of the following tasks can be used to assess listening skills?", o:["A. Spell words correctly | تهجئة الكلمات غيابياً", "B. Summarize through speaking and writing | التلخيص عبر التحدث والكتابة", "C. Listen for pronunciation | الاستماع لتمييز النطق والأصوات", "D. Skim for supporting the main idea | التصفح السريع لدعم الفكرة"], c:2, t:"أي من المهام التالية يمكن استخدامها لتقييم مهارات الاستماع؟", e:"<span class='box-hint'>من تجميعات 1444: من مهام تقييم الاستماع المباشرة هي التمييز الصوتي والاستماع للنطق (Listen for pronunciation).</span>"},
{q:"Learning objectives of the course should be at ........", o:["A. at the beginning of the lesson | في بداية الدرس الفردي", "B. at the beginning of the course | في بداية المقرر الدراسي كاملاً بوضوح", "C. at the end of the lesson | في نهاية الدرس", "D. give them more task | إعطاء مهام إضافية"], c:1, t:"يجب أن تُعلن أهداف التعلم للمقرر في ........", e:"<span class='box-hint'>من تجميعات 1444: الأهداف العامة للمقرر يجب أن تُطرح للطلاب في بداية المقرر (beginning of the course) لتوجيه المسار.</span>"},
{q:"According to Krashen, learners can learn best when they are highly motivated and confident. This is known as ........ hypothesis", o:["A. an affective filter | فرضية المرشح الوجداني", "B. an input monitor | مراقب المدخلات", "C. a natural order | الترتيب الطبيعي للاكتساب", "D. the acquisition of learning | فرضية الاكتساب والتعلم"], c:0, t:"وفقاً لكراشن، يتعلم الطلاب بشكل أفضل عندما يكونون متحفزين وواثقين من أنفسهم. تُعرف هذه بفرضية:", e:"<span class='box-hint'>من تجميعات 1444: الثقة والدافعية العالية تخفضان 'المرشح الوجداني' (Affective filter) مما يسمح للغة بالدخول للعقل.</span>"},
{q:"To help you guess an approximate meaning of unfamiliar words is ........", o:["A. length | طول الكلمة الفيزيائي", "B. sense | الإحساس اللغوي والمعنى السياقي للكلمة", "C. spelling | التهجئة الإملائية", "D. syllabe | عدد المقاطع الصوتية"], c:1, t:"لمساعدتك على تخمين المعنى التقريبي للكلمات غير المألوفة نعتمد على ........", e:"<span class='box-hint'>من تجميعات 1444: 'Sense' يشير إلى الإحساس بالمعنى والسياق الذي وردت فيه الكلمة، وهو مفتاح التخمين.</span>"},
{q:"Placing emphasis on L2 learners' expression of their opinions in their L2 writing is known as ........", o:["A. style | الأسلوب الشكلي", "B. voice | الصوت (البصمة الشخصية للكاتب)", "C. genre | النوع الأدبي للنص", "D. mood | الحالة المزاجية"], c:1, t:"التركيز على تعبير متعلمي اللغة الثانية عن آرائهم وشخصيتهم في كتاباتهم يُعرف بـ ........", e:"<span class='box-hint'>من تجميعات 1444: إبراز رأي الكاتب وهويته الفريدة في النص الأكاديمي يُسمى 'Voice'.</span>"},
{q:"In EFL listening class, learners are asked to guess the meanings of the new words using the context. This is called ........", o:["A. listening for gist | الاستماع للفكرة العامة", "B. inferring meaning | استنتاج المعنى من السياق والقرائن", "C. listening for detail | الاستماع لتفاصيل دقيقة", "D. predicting meaning | التنبؤ القَبلي بالمعنى"], c:1, t:"في فصل الاستماع، يُطلب من المتعلمين تخمين معاني الكلمات الجديدة باستخدام السياق. هذا يسمى:", e:"<span class='box-hint'>من تجميعات 1444: استخلاص معنى مخفي أو مفردة مجهولة اعتماداً على ما يحيط بها يسمى استنتاج (Inferring).</span>"},
{q:"........ is used when a student works with a teacher or more advanced student.", o:["A. scaffold | المساندة والسقالات التعليمية (الدعم التدريجي)", "B. alignment | المواءمة والربط بين الأهداف والتقييم"], c:0, t:"........ يُستخدم عندما يعمل الطالب مع معلم أو زميل أكثر تقدماً لمساعدته.", e:"<span class='box-hint'>من تجميعات 1444: الدعم المؤقت الذي يقدمه المعلم أو الخبير للمتعلم حتى يعتمد على نفسه يُسمى (Scaffolding).</span>"}
];

let synth = window.speechSynthesis, isExam = false, tooltip = document.getElementById('word-tooltip');

function formatInteractive(text) {
    return text.split(/([a-zA-Z0-9'-]+)/).map(tok => {
        if(/^[a-zA-Z0-9'-]+$/.test(tok)) {
            let clean = tok.toLowerCase();
            return `<span class="w-int" onclick="spk(this, event, '${clean}')">${tok}</span>`;
        }
        return tok;
    }).join('');
}

window.spk = function(el, ev, word) {
    ev.stopPropagation();
    if(!synth) return;
    synth.cancel();
    document.querySelectorAll('.w-int.active-speak').forEach(e => e.classList.remove('active-speak'));
    el.classList.add('active-speak');
    tooltip.textContent = dict[word] || "معنى سياقي";
    let rect = el.getBoundingClientRect();
    tooltip.style.left = (rect.left + window.scrollX) + 'px';
    tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
    tooltip.style.display = 'block';
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
        el.classList.remove('active-speak');
        setTimeout(() => { tooltip.style.display = 'none'; }, 1200);
    };
    synth.speak(u);
};

function build() {
    let cont = document.getElementById('q-container'); cont.innerHTML = '';
    db.forEach((qObj, idx) => {
        let row = document.createElement('div');
        row.className = 'question-row';
        row.setAttribute('data-ans', qObj.c);
        row.setAttribute('data-orig', idx);
        let opts = qObj.o.map((opt, i) => {
            let p = opt.split('|');
            return `<div class="opt-item" data-i="${i}" onclick="sel(this, event)"><div class="choice-badge">${["A","B","C","D"][i]}</div><div class="choice-content"><div class="choice-en" dir="ltr">${formatInteractive(p[0].trim())}</div>${p[1]?`<div class="choice-ar" dir="rtl">${p[1].trim()}</div>`:''}</div></div>`;
        }).join('');
        row.innerHTML = `<div class="q-text-container"><span class="q-number-span">${idx + 36}. </span><div class="q-text" dir="ltr">${formatInteractive(qObj.q)}</div></div>${qObj.t?`<div class="full-sentence-translation">📝 ${qObj.t}</div>`:''}<div class="options-inline">${opts}</div><button class="btn-answer" onclick="rev(this)">👁️ إظهار الشرح والمفاتيح</button><div class="answer-box"><div class="grammar-explanation">${qObj.e}</div></div>`;
        cont.appendChild(row);
    });
}

window.sel = function(optItem, event) {
    if(event.target.classList.contains('w-int')) return;
    let row = optItem.closest('.question-row');
    if(row.classList.contains('answered')) return; 
    let correctIndex = row.getAttribute('data-ans');
    let selectedIndex = optItem.getAttribute('data-i');
    row.classList.add('answered'); optItem.classList.add('selected');
    row.querySelectorAll('.opt-item').forEach(item => { if (item.getAttribute('data-i') === correctIndex) item.classList.add('correct'); });
    if (selectedIndex !== correctIndex) optItem.classList.add('wrong');
    if (!isExam) { let btn = row.querySelector('.btn-answer'); if (btn) btn.click(); }
};

window.rev = function(btn) {
    let box = btn.nextElementSibling;
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; btn.innerHTML = '🙈 إخفاء الشرح والمفاتيح'; } 
    else { box.style.display = 'none'; btn.innerHTML = '👁️ إظهار الشرح والمفاتيح'; }
};

window.setMode = function(m) {
    isExam = (m === 'exam');
    let c = document.getElementById('q-container');
    document.getElementById('btn-study').className = `mode-btn btn-study ${!isExam?'active-mode':''}`;
    document.getElementById('btn-exam').className = `mode-btn btn-exam ${isExam?'active-mode':''}`;
    document.getElementById('btn-result').style.display = isExam ? 'block' : 'none';
    document.getElementById('res-box').style.display = 'none';
    c.className = isExam ? 'questions-container exam-mode' : 'questions-container train-mode';
    if(synth) synth.cancel(); tooltip.style.display = 'none';
    
    let rows = Array.from(c.querySelectorAll('.question-row'));
    rows.forEach(r => {
        r.classList.remove('answered');
        r.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected','correct','wrong'));
        r.querySelector('.answer-box').style.display = 'none';
        r.querySelector('.btn-answer').innerHTML = '👁️ إظهار الشرح والمفاتيح';
    });

    if(isExam) {
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort(() => Math.random() - 0.5).forEach(o => optsCont.appendChild(o));
        });
        rows.sort(() => Math.random() - 0.5).forEach(r => c.appendChild(r));
    } else {
        rows.sort((a,b) => a.getAttribute('data-orig') - b.getAttribute('data-orig'));
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort((a,b) => a.getAttribute('data-i') - b.getAttribute('data-i')).forEach(o => optsCont.appendChild(o));
            c.appendChild(r);
        });
    }
    c.querySelectorAll('.question-row').forEach((r, idx) => r.querySelector('.q-number-span').textContent = (idx + 36) + ". ");
};

window.showResult = function() {
    let rows = document.querySelectorAll('.question-row'), corr = 0, ans = 0;
    rows.forEach(r => { let s = r.querySelector('.opt-item.selected'); if(s) { ans++; if(s.classList.contains('correct')) corr++; } });
    let res = document.getElementById('res-box');
    res.innerHTML = ans < rows.length ? `⚠️ أجبت على ${ans} من ${rows.length}.<br> نتيجتك: ${corr} / ${rows.length}` : `النتيجة النهائية: ${corr} / ${rows.length}<br>🏆 ممتاز يا أستاذ حمادة!`;
    res.style.display = "block"; window.scrollTo({ top: res.offsetTop - 100, behavior: 'smooth' });
};

document.addEventListener('click', e => { if(!e.target.classList.contains('w-int')) { tooltip.style.display = 'none'; if(document.querySelector('.w-int.active-speak')) document.querySelector('.w-int.active-speak').classList.remove('active-speak'); } });
build();
})();
</script>
