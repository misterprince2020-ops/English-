<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الكلمات الشامل - إعداد الأستاذ حمادة الديب</title>
    <style>
        :root {
            --primary: #4F46E5; 
            --secondary: #10B981; 
            --danger: #EF4444; 
            --warning: #F59E0B;
            --highlight: #FEF08A; 
            --bg-color: #EEF2FF;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 4px solid white;
            position: relative;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            font-weight: 900;
        }

        .credits {
            font-size: 13px;
            color: #E0E7FF;
            font-weight: bold;
        }

        .btn-report {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-report:hover { background: rgba(255, 255, 255, 0.3); }

        .parts-container {
            background: #F8FAFC;
            padding: 10px 20px;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .parts-container select {
            padding: 6px;
            border-radius: 8px;
            border: 2px solid #CBD5E1;
            font-weight: bold;
            color: var(--primary);
            outline: none;
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F3F4F6;
            padding: 10px 20px;
            border-bottom: 2px solid #E5E7EB;
            font-size: 15px;
            font-weight: bold;
        }
        .progress-text {
            color: var(--primary);
            background: #E0E7FF;
            padding: 5px 12px;
            border-radius: 12px;
            direction: ltr;
        }

        .score-board {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #E5E7EB;
        }
        .score-correct { color: var(--secondary); font-size: 14px; font-weight: bold;}
        .score-wrong { color: var(--danger); font-size: 14px; font-weight: bold;}
        
        .btn-reset {
            background: #FEE2E2;
            color: var(--danger);
            border: 1px solid #FCA5A5;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .game-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .english-word {
            font-size: 40px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 10px; 
            direction: ltr;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: #F8FAFC;
            padding: 10px 25px;
            border-radius: 15px;
            border: 2px dashed #CBD5E1;
            cursor: pointer;
            transition: 0.3s;
            width: 90%;
            box-sizing: border-box;
        }
        .english-word:hover {
            background: #E0E7FF;
            transform: scale(1.02);
        }

        .repeat-icon {
            font-size: 24px;
            background: #E0E7FF;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary);
        }

        .example-sentence {
            font-size: 19px;
            color: #334155;
            margin-bottom: 20px;
            text-align: left;
            direction: ltr;
            background: #F1F5F9;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            box-sizing: border-box;
            border: 1px solid #E2E8F0;
            border-left: 5px solid var(--secondary);
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        .example-sentence:hover {
            transform: scale(1.02);
        }

        .highlight-yellow {
            background-color: var(--highlight) !important;
            border-color: #FACC15 !important;
            color: #000;
            box-shadow: 0 4px 10px rgba(250, 204, 21, 0.2);
        }

        .highlight-word {
            color: var(--danger);
            font-weight: bold;
            text-decoration: underline;
        }

        .options-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #CBD5E1;
            padding: 12px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
        }
        .option-correct { background: #D1FAE5 !important; border-color: var(--secondary) !important; color: #065F46 !important; }
        .option-wrong { background: #FEE2E2 !important; border-color: var(--danger) !important; color: #991B1B !important; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #F8FAFC;
            border-top: 2px solid #E2E8F0;
            direction: rtl; /* لضمان الترتيب الصحيح للأزرار */
        }
        .btn-nav, .btn-toggle {
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-next { background: var(--secondary); } 
        .btn-prev { background: #94A3B8; }
        .btn-next:hover, .btn-prev:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-next.disabled { background: #CBD5E1; cursor: not-allowed; transform: none; }
        
        .btn-toggle { background: var(--primary); width: 170px; }
        .btn-toggle.inactive { background: var(--danger); }
        .btn-toggle:hover { opacity: 0.9; }

        /* النوافذ المنبثقة */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(31, 41, 55, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            border-radius: 20px;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-sizing: border-box;
        }
        .modal-content h2 { margin-top: 0; color: var(--primary); font-size: 24px; }

        .modal-buttons-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-continue {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-retry-part {
            background: #F1F5F9;
            color: var(--danger);
            border: 2px solid #CBD5E1;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .report-summary {
            background: #F8FAFC;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            margin-bottom: 15px;
        }
        .report-summary h3 { margin: 0 0 10px 0; color: var(--primary); }
        .report-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: right;
            margin-bottom: 20px;
        }
        .report-item {
            background: #F1F5F9;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            border-right: 4px solid var(--secondary);
        }
        .close-modal {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="partResultModal" class="modal-overlay">
            <div class="modal-content">
                <h2 id="partResultTitle">نهاية الجزء</h2>
                <div style="font-size: 40px; font-weight: 900; color: var(--secondary); margin: 10px 0; direction: ltr;" id="partResultScore">20 / 20</div>
                
                <div class="modal-buttons-group">
                    <button class="btn-continue" id="btnNextPart" onclick="startNextPart()">الانتقال إلى الجزء التالي 🚀</button>
                    <button class="btn-retry-part" onclick="retryCurrentPart()">🔄 إعادة الجزء الحالي</button>
                </div>
            </div>
        </div>

        <div id="finalReportModal" class="modal-overlay">
            <div class="modal-content">
                <h2>تقرير النتيجة الشامل 📊</h2>
                <div class="report-summary">
                    <h3>الإجمالي من 300</h3>
                    <div style="font-size: 20px; font-weight: bold;">
                        <span style="color:var(--secondary)">✔ إجابات صحيحة: <span id="reportTotalCorrect">0</span></span><br>
                        <span style="color:var(--danger)">✖ إجابات خاطئة: <span id="reportTotalWrong">0</span></span>
                    </div>
                </div>
                <div class="report-list" id="reportPartsList"></div>
                <button class="close-modal" onclick="closeReport()">إغلاق التقرير ✖</button>
            </div>
        </div>

        <div class="header">
            <button class="btn-report" onclick="showFinalReport()">📊 التقرير</button>
            <h1>اختبار المفردات (300 كلمة)</h1>
            <div class="credits">إعداد الأستاذ حمادة الديب | مدارس آفاق الهداية</div>
        </div>

        <div class="parts-container">
            <label for="partSelect">اختر الجزء:</label>
            <select id="partSelect" onchange="changePart(this.value)"></select>
        </div>

        <div class="stats-bar">
            <div class="score-board">
                <span class="score-correct" id="correctScore">✔ 0</span>
                <span style="color: #CBD5E1;">|</span>
                <span class="score-wrong" id="wrongScore">✖ 0</span>
                <button class="btn-reset" onclick="resetAllScores()" title="إعادة من البداية">🔄 تصفير</button>
            </div>
            <span class="progress-text" id="wordCounter">1 / 20</span>
        </div>

        <div class="game-area">
            <div class="english-word" onclick="speakSequence()" title="اضغط لسماع الكلمة والجملة">
                <span id="theWordText">Word</span>
                <div class="repeat-icon">🔊</div>
            </div>
            
            <div id="exampleSentence" class="example-sentence" onclick="speakSequence()" title="اضغط لسماع الكلمة والجملة">
                <span id="theSentenceText">Sentence</span>
            </div>
            
            <div id="optionsContainer" class="options-container"></div>
        </div>

        <div class="controls">
            <!-- الترتيب المضبوط 100%: السابق (يمين) - الزر (وسط) - التالي (يسار) -->
            <button class="btn-nav btn-prev" onclick="prevWord()">السابق &raquo;</button>
            
            <button id="btnAutoToggle" class="btn-toggle" onclick="toggleAutoPlay()">
                الانتقال: <span>تلقائي ⚡</span>
            </button>

            <button id="btnNext" class="btn-nav btn-next disabled" onclick="nextWord()">&laquo; التالي</button>
        </div>
    </div>

        const WORDS_PER_PART = 20;
        const TOTAL_PARTS = 15; 

        let currentPart = 0; 
        let currentWordInPart = 0; 
        let hasAnsweredThisWord = false; 
        let autoPlay = true; 
        let synth = window.speechSynthesis;
        let autoTimeout = null;
        
        let partsScores = Array.from({length: TOTAL_PARTS}, () => ({correct: 0, wrong: 0}));

        function populateParts() {
            const select = document.getElementById('partSelect');
            for(let i = 0; i < TOTAL_PARTS; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `الجزء ${i + 1} (الكلمات ${(i*WORDS_PER_PART)+1} - ${Math.min((i+1)*WORDS_PER_PART, wordsList.length)})`;
                select.appendChild(opt);
            }
        }

        function changePart(partIndex) {
            currentPart = parseInt(partIndex);
            currentWordInPart = 0;
            updateGlobalScoresUI();
            initGame();
        }

        function resetAllScores() {
            partsScores = Array.from({length: TOTAL_PARTS}, () => ({correct: 0, wrong: 0}));
            currentPart = 0;
            document.getElementById('partSelect').value = 0;
            currentWordInPart = 0;
            updateGlobalScoresUI();
            initGame();
        }

        function updateGlobalScoresUI() {
            document.getElementById('correctScore').innerText = `✔ ${partsScores[currentPart].correct}`;
            document.getElementById('wrongScore').innerText = `✖ ${partsScores[currentPart].wrong}`;
        }

        // --- التعديل الأهم هنا لضمان عمل الزر بفعالية 100% وفي اللحظة ---
        function toggleAutoPlay() {
            autoPlay = !autoPlay;
            const btn = document.getElementById('btnAutoToggle');
            
            if (autoPlay) {
                // تفعيل الوضع التلقائي
                btn.classList.remove('inactive');
                btn.innerHTML = 'الانتقال: <span>تلقائي ⚡</span>';
                
                // إذا كان الطالب قد أجاب بالفعل، والبرنامج لا يتحدث الآن، ننتقل للكلمة التالية فوراً
                if (hasAnsweredThisWord && !synth.speaking) {
                    clearTimeout(autoTimeout);
                    autoTimeout = setTimeout(nextWord, 1000);
                }
            } else {
                // تفعيل الوضع اليدوي
                btn.classList.add('inactive');
                btn.innerHTML = 'الانتقال: <span>يدوي ✋</span>';
                
                // إيقاف أي عملية انتقال تلقائي مبرمجة حالياً حتى يأخذ الطالب وقته
                clearTimeout(autoTimeout); 
                
                // نفعل زر (التالي) فوراً حتى لو لم يجب الطالب بعد بناءً على طلبك
                document.getElementById('btnNext').classList.remove('disabled');
                hasAnsweredThisWord = true; // للسماح له بتجاوز السؤال والانتقال بحرية
            }
        }

        function initGame() {
            clearTimeout(autoTimeout);
            hasAnsweredThisWord = false;
            
            // قفل زر التالي إلا إذا كان الوضع يدوياً
            if (!autoPlay) {
                document.getElementById('btnNext').classList.remove('disabled');
                hasAnsweredThisWord = true; 
            } else {
                document.getElementById('btnNext').classList.add('disabled');
            }
            
            document.getElementById('partResultModal').style.display = 'none'; 
            document.getElementById('finalReportModal').style.display = 'none';
            document.getElementById('exampleSentence').classList.remove('highlight-yellow');

            let actualIndex = (currentPart * WORDS_PER_PART) + currentWordInPart;
            let currentItem = wordsList[actualIndex];
            
            document.getElementById('theWordText').innerText = currentItem.e;
            document.getElementById('theSentenceText').innerHTML = currentItem.ex;
            document.getElementById('wordCounter').innerText = `${currentWordInPart + 1} / ${WORDS_PER_PART}`;
            
            generateOptions(currentItem);
            
            setTimeout(() => speakSequence(false), 300);
        }

        function generateOptions(currentItem) {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            let options = [currentItem];
            let wrongOptionsPool = wordsList.filter(v => v.e !== currentItem.e);
            wrongOptionsPool.sort(() => 0.5 - Math.random());
            options.push(wrongOptionsPool[0]);
            options.push(wrongOptionsPool[1]);

            options.sort(() => 0.5 - Math.random());

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.a;
                btn.onclick = () => checkAnswer(btn, opt.a, currentItem.a);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btnElement, selectedAr, correctAr) {
            // لمنع تكرار حساب النتيجة
            if (btnElement.classList.contains('option-correct') || btnElement.classList.contains('option-wrong')) return;
            
            hasAnsweredThisWord = true; 
            document.getElementById('btnNext').classList.remove('disabled');

            if (selectedAr === correctAr) {
                partsScores[currentPart].correct++;
                btnElement.classList.add('option-correct');
            } else {
                partsScores[currentPart].wrong++;
                btnElement.classList.add('option-wrong');
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(btn => {
                    if (btn.innerText === correctAr) btn.classList.add('option-correct');
                });
            }

            updateGlobalScoresUI();
            
            // نطق الكلمة والجملة، وإذا كان الوضع تلقائياً سينتقل بعدها
            speakSequence(true); 
        }

        function speakSequence(isAfterAnswer = false) {
            let actualIndex = (currentPart * WORDS_PER_PART) + currentWordInPart;
            let currentItem = wordsList[actualIndex];
            
            synth.cancel();
            clearTimeout(autoTimeout);
            document.getElementById('exampleSentence').classList.remove('highlight-yellow');

            let wordUtterance = new SpeechSynthesisUtterance(currentItem.e);
            wordUtterance.lang = 'en-US';
            wordUtterance.rate = 0.85;

            let cleanText = currentItem.ex.replace(/<[^>]*>?/gm, '');
            let sentenceUtterance = new SpeechSynthesisUtterance(cleanText);
            sentenceUtterance.lang = 'en-US';
            sentenceUtterance.rate = 0.85;

            sentenceUtterance.onstart = function() {
                document.getElementById('exampleSentence').classList.add('highlight-yellow');
            };

            // هنا يكمن السر: نربط الانتقال التلقائي بنهاية نطق الصوت
            sentenceUtterance.onend = function() {
                document.getElementById('exampleSentence').classList.remove('highlight-yellow');
                
                // إذا كان الطالب قد اختار إجابة والوضع "تلقائي"، ننتظر ثانية واحدة ثم ننتقل!
                if (isAfterAnswer && autoPlay) {
                    autoTimeout = setTimeout(nextWord, 1000); 
                }
            };

            synth.speak(wordUtterance);
            synth.speak(sentenceUtterance);
        }

        function nextWord() {
            if (!hasAnsweredThisWord) {
                const allBtns = document.querySelectorAll('.option-btn');
                allBtns.forEach(btn => {
                    btn.style.borderColor = "var(--danger)";
                    setTimeout(() => btn.style.borderColor = "#CBD5E1", 400);
                });
                return;
            }
            
            synth.cancel(); 
            clearTimeout(autoTimeout);
            
            currentWordInPart++;
            
            if (currentWordInPart >= WORDS_PER_PART) {
                showPartResultModal();
                return; 
            }
            
            initGame();
        }

        function showPartResultModal() {
            document.getElementById('partResultTitle').innerText = `نتيجة الجزء ${currentPart + 1} 🏆`;
            
            let cScore = partsScores[currentPart].correct;
            const scoreElement = document.getElementById('partResultScore');
            scoreElement.innerText = `${cScore} / ${WORDS_PER_PART}`;
            scoreElement.style.color = (cScore >= WORDS_PER_PART / 2) ? 'var(--secondary)' : 'var(--danger)';

            const isLastPart = (currentPart >= TOTAL_PARTS - 1);
            document.getElementById('btnNextPart').innerText = isLastPart ? "عرض التقرير النهائي 📊" : `الانتقال إلى الجزء ${currentPart + 2} 🚀`;

            document.getElementById('partResultModal').style.display = 'flex';
        }

        function startNextPart() {
            document.getElementById('partResultModal').style.display = 'none';
            
            if (currentPart >= TOTAL_PARTS - 1) {
                showFinalReport();
                return;
            }
            
            currentPart++;
            currentWordInPart = 0;
            document.getElementById('partSelect').value = currentPart;
            updateGlobalScoresUI();
            initGame();
        }

        function retryCurrentPart() {
            document.getElementById('partResultModal').style.display = 'none';
            partsScores[currentPart] = {correct: 0, wrong: 0};
            currentWordInPart = 0;
            updateGlobalScoresUI();
            initGame();
        }

        function prevWord() {
            clearTimeout(autoTimeout);
            synth.cancel();
            currentWordInPart--;
            if (currentWordInPart < 0) {
                currentWordInPart = WORDS_PER_PART - 1; 
            }
            initGame();
        }

        function showFinalReport() {
            synth.cancel(); 
            clearTimeout(autoTimeout);
            
            let totalC = 0;
            let totalW = 0;
            const listContainer = document.getElementById('reportPartsList');
            listContainer.innerHTML = '';

            partsScores.forEach((scoreObj, index) => {
                totalC += scoreObj.correct;
                totalW += scoreObj.wrong;

                let row = document.createElement('div');
                row.className = 'report-item';
                row.innerHTML = `
                    <span style="font-weight:bold; color:var(--primary)">الجزء ${index + 1}</span>
                    <span>
                        <span style="color:var(--secondary); margin-left:15px;">✔ ${scoreObj.correct}</span>
                        <span style="color:var(--danger)">✖ ${scoreObj.wrong}</span>
                    </span>
                `;
                listContainer.appendChild(row);
            });

            document.getElementById('reportTotalCorrect').innerText = totalC;
            document.getElementById('reportTotalWrong').innerText = totalW;
            
            document.getElementById('finalReportModal').style.display = 'flex';
        }

        function closeReport() {
            document.getElementById('finalReportModal').style.display = 'none';
        }

        window.onload = () => {
            populateParts();
            initGame();
        };
    </script>
</body>
</html>
