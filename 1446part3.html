{q:"58. It is a program a writer uses. It provides real-time collaboration with others.", o:["A. Weblog | مدونة", "B. OneNote | ون نوت", "C. Word | وورد", "D. Grammarly | جرامرلي"], c:1, t:"إنه برنامج يستخدمه الكاتب. يوفر التعاون في الوقت الفعلي مع الآخرين.", e:"<div class='box-hint'>من تجميعات 1446: برنامج OneNote (وكذلك Google Docs) يدعم الكتابة والتحرير التعاوني المباشر في نفس الوقت.</div>"},
{q:"59. The classes of virtual learning environment use...", o:["A. Skype | سكايب", "B. Blackboard | بلاك بورد", "C. Facebook | فيسبوك", "D. Twitter | تويتر"], c:1, t:"فصول بيئة التعلم الافتراضية تستخدم...", e:"<div class='box-hint'>من تجميعات 1446: بيئة التعلم الافتراضية التعليمية المتكاملة والمخصصة للمقررات هي البلاك بورد (Blackboard).</div>"},
{q:"60. A word that shares the same spelling or pronunciation as another word but has a different meaning.", o:["A. Homonym | متجانس لفظي (نفس الكتابة والنطق)", "B. Homophone | متجانس صوتي (نفس النطق فقط)", "C. Hyponymy | اندراج (عام وخاص)", "D. Synonym | مرادف (نفس المعنى)"], c:0, t:"كلمة تشترك في نفس التهجئة أو النطق مع كلمة أخرى ولكن لها معنى مختلف.", e:"<div class='box-hint'>من تجميعات 1446: الكلمات التي تتطابق في النطق والتهجئة مع اختلاف المعنى (مثل bank بنك، و bank ضفة) تسمى Homonym.</div>"},
{q:"61. Group-based activities and peer work are fantastic ways to enrich students'...", o:["A. Knowledge | المعرفة", "B. Dependence | الاعتمادية", "C. Interpersonal skills | المهارات الاجتماعية بين الأفراد", "D. Intrapersonal skills | المهارات الذاتية"], c:2, t:"الأنشطة الجماعية والعمل مع الأقران طرق رائعة لإثراء ........ للطلاب.", e:"<div class='box-hint'>من تجميعات 1446: العمل الجماعي ينمي التواصل الاجتماعي والتفاعل مع الآخرين (Interpersonal skills).</div>"},
{q:"62. The best way to know about another language's culture is to learn...", o:["A. Vocabulary | المفردات", "B. Scientific studies | الدراسات العلمية", "C. Idioms | المصطلحات والأمثال الشعبية", "D. Grammar | القواعد"], c:2, t:"أفضل طريقة لمعرفة ثقافة لغة أخرى هي تعلم...", e:"<div class='box-hint'>من تجميعات 1446: الأمثال والمصطلحات (Idioms) تعكس تفكير الناس وثقافتهم وتاريخهم بشكل عميق لا توفره القواعد أو المفردات الفردية.</div>"},
{q:"63. A learner listened to a listening text, but there was a part he couldn't listen to. He tried to understand the missing parts and make inferences. Which strategy is that?", o:["A. Memorizing | الحفظ", "B. Analyzing the content | تحليل المحتوى", "C. Compensation | استراتيجية التعويض والتخمين", "D. Metacognitive strategies | الاستراتيجيات ما وراء المعرفية"], c:2, t:"استمع متعلم لنص استماع، ولكن كان هناك جزء لم يتمكن من سماعه. فحاول فهم الأجزاء المفقودة وإجراء استنتاجات. ما هي هذه الاستراتيجية؟", e:"<div class='box-hint'>من تجميعات 1446: استخدام السياق لتعويض النقص اللغوي أو الكلمات المفقودة يسمى استراتيجية التعويض (Compensation).</div>"},
{q:"64. Which of the following is an example of a specific and measurable learning objective?", o:["A. Students will be able to use nouns correctly. | (هدف عام جداً)", "B. Students will be able to write down countable and uncountable nouns. | (هدف محدد وقابل للقياس)", "C. I will teach students how to distinguish between countable and uncountable nouns. | (هذا ما سيفعله المعلم وليس الطالب)", "D. Students will understand the difference between countable and uncountable nouns. | (فعل understand غير قابل للقياس المباشر)"], c:1, t:"أي مما يلي يُعد مثالاً على هدف تعليمي محدد وقابل للقياس؟", e:"<div class='box-hint'>من تجميعات 1446: الفعل 'write down' محدد، يمكن ملاحظته، وقياسه بدقة مقارنة بأفعال مثل use أو understand.</div>"},
{q:"65. Which of the following concepts refers to the scientific study of language and its structure?", o:["A. Syntactics | علم التراكيب", "B. Semantics | علم الدلالة", "C. Pragmatics | التداولية", "D. Linguistics | اللغويات (علم اللغة العام)"], c:3, t:"أي من المفاهيم التالية يشير إلى الدراسة العلمية للغة وبنيتها؟", e:"<div class='box-hint'>من تجميعات 1446: اللغويات (Linguistics) هو العلم الشامل الذي يدرس اللغة الإنسانية من كافة جوانبها (صوتاً وصرفاً ونحواً).</div>"},
{q:"66. The first stage in reading skill is...", o:["A. Comprehension | الفهم والاستيعاب", "B. Sentence analysis | تحليل الجملة", "C. Retention of vocabulary | الاحتفاظ بالمفردات", "D. Decoding | فك التشفير (نطق الحروف والكلمات)"], c:3, t:"المرحلة الأولى في مهارة القراءة هي...", e:"<div class='box-hint'>من تجميعات 1446: أول خطوة يقوم بها القارئ المبتدئ هي التعرف على الحروف والأصوات لتكوين الكلمات، وتسمى فك التشفير (Decoding).</div>"},
{q:"67. The teacher asks students to explain the feelings behind the character's actions in a story. What type of learning objective does this represent?", o:["A. Knowledge | المعرفة (تذكر)", "B. Comprehension | الفهم", "C. Application | التطبيق", "D. Evaluation | التقييم (نقد وإصدار أحكام)"], c:3, t:"يطلب المعلم من الطلاب شرح المشاعر والدوافع وراء أفعال الشخصية في القصة. ما نوع هدف التعلم الذي يمثله هذا؟", e:"<div class='box-hint'>من تجميعات 1446: تحليل دوافع الشخصية والحكم على مشاعرها يتطلب مهارات التقييم (Evaluation) وإصدار الأحكام.</div>"},
{q:"68. A student is new to your English class and feels very shy. He avoids speaking in the class and seems reluctant to participate in group activities. This is explained in ........ hypothesis.", o:["A. Monitor | المراقب", "B. Affective filter | المرشح الوجداني (حاجز القلق)", "C. Natural order | الترتيب الطبيعي", "D. Input | المدخلات"], c:1, t:"طالب جديد في فصلك ويشعر بخجل شديد. يتجنب التحدث ويبدو متردداً في المشاركة. يُفسر هذا في فرضية ........", e:"<div class='box-hint'>من تجميعات 1446: الخجل والتوتر والقلق كلها عوامل عاطفية ترفع حاجز التعلم، وهذا يسمى (Affective filter).</div>"},
{q:"69. (-ment) in the word government is ........", o:["A. prefix | سابقة", "B. suffix | لاحقة", "C. root | جذر", "D. inflectional morpheme | مورفيم تصريفي"], c:1, t:"(-ment) في كلمة government تعتبر ........", e:"<div class='box-hint'>من تجميعات 1446: الإضافة التي توضع في نهاية الكلمة (govern + ment) وتغير قسم الكلام من فعل إلى اسم تسمى لاحقة اشتقاقية (suffix).</div>"},
{q:"70. Teaching English to learners from diverse cultural backgrounds like Egypt, Saudi Arabia, Kuwait is an example of:", o:["A. cross-cultural communication | تواصل عابر للثقافات", "B. multilingual education | تعليم متعدد اللغات", "C. cross-cultural teaching | تعليم عابر للثقافات (بين ثقافات مختلفة)", "D. monocultural teaching | تعليم أحادي الثقافة"], c:2, t:"تعليم اللغة الإنجليزية لمتعلمين من خلفيات ثقافية متنوعة مثل مصر والسعودية والكويت هو مثال على:", e:"<div class='box-hint'>من تجميعات 1446: التدريس لفصل يضم ثقافات وعادات مختلفة يتطلب وعياً بـ (Cross-cultural teaching).</div>"},
{q:"71. We should teach students the ........ meaning, because some words have other conceptual or figurative meaning. For example: owl, wolf.", o:["A. connotative | المعنى الدلالي الإيحائي (الرمزي)", "B. literal | المعنى الحرفي المعجمي", "C. denotative | المعنى الصريح المباشر", "D. figurative | المعنى المجازي"], c:0, t:"يجب أن نعلم الطلاب المعنى ........، لأن بعض الكلمات لها معاني رمزية أو إيحائية أخرى. مثال: البومة، الذئب.", e:"<div class='box-hint'>من تجميعات 1446: الكلمات قد تحمل إيحاءات ثقافية (Connotative)، فالبومة قد ترمز للشؤم في ثقافة، وللحكمة في ثقافة أخرى.</div>"},
{q:"72. This activity combines practicing your L2 (second language) with fun and entertainment.", o:["A. Discussion | نقاش", "B. Problem solving | حل المشكلات", "C. Debate | مناظرة", "D. Role playing | لعب الأدوار (التمثيل)"], c:3, t:"يجمع هذا النشاط بين ممارسة لغتك الثانية والمرح والتسلية.", e:"<div class='box-hint'>من تجميعات 1446: لعب الأدوار وتقمص الشخصيات (Role playing) يضفي جواً من المرح ويكسر حاجز الملل أثناء التعلم.</div>"},
{q:"73. At very early stages of learning English, the language is characterized by...", o:["A. Nodding yes, no | الإيماء بنعم أو لا", "B. Limited production | إنتاج لغوي محدود جداً (كلمات قصيرة)", "C. Production | إنتاج لغوي كامل", "D. Short familiar phrase | عبارات قصيرة مألوفة"], c:1, t:"في المراحل المبكرة جداً من تعلم اللغة الإنجليزية، تتميز اللغة بـ...", e:"<div class='box-hint'>من تجميعات 1446: في البدايات، يمر المتعلم بمرحلة صمت وإنتاج محدود للغة (Limited production) قبل أن يكتسب الطلاقة.</div>"},
{q:"74. Which one is the main principle of the direct method in teaching?", o:["A. Grammar is learned deductively | القواعد تُدرس استنتاجياً", "B. Explicit grammar is used | استخدام قواعد صريحة", "C. Use only the target language | الاستخدام الحصري للغة المستهدفة", "D. Learning without analysis | تعلم بدون تحليل"], c:2, t:"ما هو المبدأ الأساسي للطريقة المباشرة (Direct method) في التدريس؟", e:"<div class='box-hint'>من تجميعات 1446: القاعدة الذهبية للطريقة المباشرة هي منع استخدام اللغة الأم تماماً واستخدام اللغة المستهدفة فقط.</div>"},
{q:"75. To enhance critical thinking among learners, the teacher uses a topic about...", o:["A. Asking About Directions | السؤال عن الاتجاهات", "B. The National Day | اليوم الوطني", "C. The World Bank | البنك الدولي", "D. Crisis Management | إدارة الأزمات"], c:3, t:"لتعزيز التفكير النقدي لدى المتعلمين، يستخدم المعلم موضوعاً حول...", e:"<div class='box-hint'>من تجميعات 1446: مواضيع 'إدارة الأزمات' تتطلب مهارات عقلية عليا كتحليل المشكلة وتقييم الحلول واتخاذ القرارات، مما ينمي التفكير النقدي.</div>"},
{q:"76. The activities (puzzle, crossword, odd one out) are used in teaching...", o:["A. Grammar | القواعد", "B. Writing | الكتابة", "C. Reading | القراءة", "D. Vocabulary | المفردات"], c:3, t:"تُستخدم الأنشطة (لغز، كلمات متقاطعة، استخرج الكلمة الشاذة) في تدريس...", e:"<div class='box-hint'>من تجميعات 1446: هذه الألعاب الذهنية هي أنشطة كلاسيكية فعالة لتعليم ومراجعة المفردات (Vocabulary) بطريقة ممتعة.</div>"},
{q:"77. Which is the popular usage form of the past perfect in American English:", o:["A. -ed | إضافة ed", "B. -t | إضافة t", "C. -en | إضافة en", "D. -in | إضافة in"], c:0, t:"ما هي صيغة الاستخدام الشائعة للماضي التام في الإنجليزية الأمريكية:", e:"<div class='box-hint'>من تجميعات 1446: الأمريكان يميلون لاستخدام التصريف المنتظم (-ed) لمعظم الأفعال كبديل للتصريفات الشاذة البريطانية (مثل learned بدلاً من learnt).</div>"},
{q:"78. Information gap activity can be used in...", o:["A. reading | القراءة", "B. writing | الكتابة", "C. listening | الاستماع", "D. speaking | التحدث (والمحادثة)"], c:3, t:"يمكن استخدام نشاط فجوة المعلومات (Information gap) في مهارة...", e:"<div class='box-hint'>من تجميعات 1446: نشاط (فجوة المعلومات) يجبر الطلاب على التحدث وتبادل المعلومات الشفوية لإكمال المهمة، لذا فهو ممتاز لمهارة التحدث (Speaking).</div>"},
{q:"79. ESP (English for Specific Purposes) courses in ........ are tailored English language training programs designed to meet the specific linguistic needs of employees in their professional context.", o:["A. workplace | مكان العمل (البيئة المهنية)", "B. teaching | التدريس", "C. academy | الأكاديمية", "D. language acquisition | اكتساب اللغة"], c:0, t:"دورات الإنجليزية لأغراض محددة (ESP) في ........ هي برامج مصممة لتلبية الاحتياجات اللغوية الخاصة للموظفين في سياقهم المهني.", e:"<div class='box-hint'>من تجميعات 1446: دورات الـ ESP المرتبطة بالموظفين وسياقهم المهني (Professional context) تُعقد عادة لتناسب بيئة العمل (Workplace).</div>"},
{q:"80. An Arab student from another culture does not know the word 'fish', He describes it as 'An animal lives in the water', He/she uses...", o:["A. Semantic competence | كفاءة دلالية", "B. Grammatical competence | كفاءة نحوية", "C. Strategic competence | كفاءة استراتيجية (لتعويض النقص)", "D. Communicative competence | كفاءة تواصلية عامة"], c:2, t:"طالب لا يعرف كلمة (fish) فوصفها بـ (حيوان يعيش في الماء)، إنه يستخدم استراتيجية:", e:"<div class='box-hint'>من تجميعات 1446: استخدام حيل تعويضية كالوصف (الالتفاف اللفظي) لتغطية نقص المفردات يُعد من الكفاءة الاستراتيجية (Strategic competence).</div>"},
{q:"81. Which of the following enhances negotiation of the meaning in writing activity:", o:["A. flipped classroom | الفصل المقلوب", "B. personalized learning | التعلم المخصص", "C. cooperative instruction | التعليم التعاوني (مع الأقران)", "D. differentiated instruction | التعليم المتمايز"], c:2, t:"أي مما يلي يعزز التفاوض على المعنى (Negotiation of meaning) في نشاط الكتابة:", e:"<div class='box-hint'>من تجميعات 1446: تفاوض المعنى يحدث بفعالية عندما يتفاعل الطلاب ويتعاونون مع بعضهم لتبادل الآراء، وهو صميم التعليم التعاوني (Cooperative instruction).</div>"},
{q:"82. ........ method overlooks speaking skill.", o:["A. Grammar Translation | طريقة القواعد والترجمة", "B. Communication | التواصلية", "C. Direct | المباشرة", "D. Audio-lingual | السمعية الشفوية"], c:0, t:"طريقة ........ تتجاهل مهارة التحدث.", e:"<div class='box-hint'>من تجميعات 1446: طريقة القواعد والترجمة الكلاسيكية تركز حصرياً على القراءة والكتابة وحفظ القواعد، وتهمل التحدث تماماً.</div>"},
{q:"83. The features of human language are...", o:["A. arbitrariness - creativity - semantic | الاعتباطية، الإبداع، الدلالة", "B. productivity - cultural transmission - generalization | الإنتاجية، النقل الثقافي، التعميم", "C. arbitrariness - rapid fading - Displacement | الاعتباطية، التلاشي السريع، الإزاحة", "D. Displacement - duality - receptiveness | الإزاحة، الازدواجية، الاستقبالية"], c:2, t:"(من) خصائص اللغة البشرية هي...", e:"<div class='box-hint'>من تجميعات 1446: من الخصائص المميزة للغة البشرية: الاعتباطية (لا رابط منطقي بين اللفظ والمعنى)، التلاشي السريع للصوت، والإزاحة (التحدث عن الماضي أو أماكن بعيدة).</div>"},
{q:"84. Teachers usually activate students' background knowledge about a topic through... activities.", o:["A. collaborative | تعاونية", "B. problem-solving | حل مشكلات", "C. the warm-up | الإحماء والتهيئة", "D. challenging | تحدي"], c:2, t:"عادة ما ينشط المعلمون المعرفة السابقة للطلاب حول موضوع ما من خلال أنشطة...", e:"<div class='box-hint'>من تجميعات 1446: أنشطة الإحماء (Warm-up) في بداية الحصة تهيئ ذهن الطالب وتستدعي معرفته السابقة.</div>"},
{q:"85. ........can be a powerful tool to boost creativity in teachers.", o:["A. Technology | التكنولوجيا", "B. Assessment | التقييم", "C. Lesson plans | خطط الدروس", "D. Exams | الاختبارات"], c:0, t:"........ يمكن أن تكون أداة قوية لتعزيز الابتكار والإبداع لدى المعلمين.", e:"<div class='box-hint'>من تجميعات 1446: التكنولوجيا توفر للمعلم أدوات وموارد غير محدودة لابتكار طرق تدريس تفاعلية وجذابة.</div>"},
{q:"86. A collection of images, charts, and minimal text that gives an overview understanding of a topic in one page is known as...", o:["A. PowerPoint | باوربوينت", "B. Prezi | بريزي", "C. Infographic | إنفوجرافيك", "D. Keynote | كينوت"], c:2, t:"مجموعة من الصور والرسوم البيانية والنصوص المصغرة التي تعطي نظرة عامة عن موضوع في صفحة واحدة تسمى...", e:"<div class='box-hint'>من تجميعات 1446: الإنفوجرافيك يعرض المعلومات المعقدة بصرياً لتسهيل الفهم السريع.</div>"},
{q:"87. Both children acquiring their first language and adults acquiring a second language develop grammatical structures in a predictable order. That is known as...", o:["A. Monitor hypothesis | فرضية المراقب", "B. Natural order hypothesis | فرضية الترتيب الطبيعي", "C. Affective filter hypothesis | فرضية المرشح الوجداني", "D. Learning-acquisition hypothesis | فرضية التعلم والاكتساب"], c:1, t:"كل من الأطفال الذين يكتسبون لغتهم الأولى والبالغين الذين يكتسبون لغة ثانية يطورون التراكيب النحوية في ترتيب متوقع. يُعرف هذا بـ...", e:"<div class='box-hint'>من تجميعات 1446: فرضية (الترتيب الطبيعي) تنص على أن القواعد تُكتسب بتسلسل فطري متوقع بغض النظر عن ترتيب تدريسها.</div>"},
{q:"88. ........focuses on reading large amounts of relatively easy and enjoyable texts. It's a cornerstone technique for developing fluency and vocabulary.", o:["A. Extensive reading | القراءة الموسعة (الحرة)", "B. Intensive reading | القراءة المكثفة (التحليلية)", "C. Reading for gist | القراءة للفكرة العامة", "D. Reading for details | القراءة للتفاصيل"], c:0, t:"........ تركز على قراءة كميات كبيرة من النصوص السهلة والممتعة نسبياً. إنها تقنية أساسية لتطوير الطلاقة والمفردات.", e:"<div class='box-hint'>من تجميعات 1446: القراءة الموسعة (Extensive) خارج المنهج للمتعة تبني طلاقة الطالب وتزيد حصيلته اللغوية بشكل طبيعي.</div>"},
{q:"89. Which one of the following is not applicable for communicative competence?", o:["A. Effective use of language in social context | الاستخدام الفعال للغة في السياق الاجتماعي", "B. The ability to be appropriate, to know the right thing at the right time | القدرة على أن تكون مناسباً للسياق", "C. The ability to produce sentences for communicative effect | القدرة على إنتاج جمل للتواصل", "D. The knowledge of linguistic competence is the same as communicative competence | المعرفة اللغوية (القواعد) تعادل تماماً الكفاءة التواصلية"], c:3, t:"أي مما يلي لا ينطبق على الكفاءة التواصلية؟", e:"<div class='box-hint'>من تجميعات 1446: الكفاءة اللغوية (النحو والصرف) هي جزء واحد فقط من الكفاءة التواصلية الأشمل، وليست مساوية لها.</div>"},

let synth = window.speechSynthesis, isExam = false, tooltip = document.getElementById('word-tooltip');

function formatInteractive(text) {
    return text.split(/([a-zA-Z0-9'-]+)/).map(tok => {
        if(/^[a-zA-Z0-9'-]+$/.test(tok)) {
            let clean = tok.toLowerCase();
            return `<b class="w-int" onclick="spk(this, event, '${clean}')">${tok}</b>`;
        }
        return tok;
    }).join('');
}

window.spk = function(el, ev, word) {
    ev.stopPropagation();
    if(!synth) return;
    synth.cancel();
    document.querySelectorAll('.w-int.active-speak').forEach(e => e.classList.remove('active-speak'));
    el.classList.add('active-speak');
    tooltip.textContent = dict[word] || "معنى سياقي";
    let rect = el.getBoundingClientRect();
    tooltip.style.left = (rect.left + window.scrollX) + 'px';
    tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
    tooltip.style.display = 'block';
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
        el.classList.remove('active-speak');
        setTimeout(() => { tooltip.style.display = 'none'; }, 1200);
    };
    synth.speak(u);
};

function build() {
    let cont = document.getElementById('q-container'); cont.innerHTML = '';
    db.forEach((qObj, idx) => {
        let row = document.createElement('div');
        row.className = 'question-row';
        row.setAttribute('data-ans', qObj.c);
        row.setAttribute('data-orig', idx);
        let opts = qObj.o.map((opt, i) => {
            let p = opt.split('|');
            return `<div class="opt-item" data-i="${i}" onclick="sel(this, event)"><div class="choice-badge">${["A","B","C","D"][i]}</div><div class="choice-content"><div class="choice-en" dir="ltr">${formatInteractive(p[0].trim())}</div>${p[1]?`<div class="choice-ar" dir="rtl">${p[1].trim()}</div>`:''}</div></div>`;
        }).join('');
        row.innerHTML = `<div class="q-text-container"><b class="q-number-lbl">${idx + 53}. </b><div class="q-text" dir="ltr">${formatInteractive(qObj.q.replace(/^\d+\.\s*/, ''))}</div></div>${qObj.t?`<div class="full-sentence-translation">📝 ${qObj.t}</div>`:''}<div class="options-inline">${opts}</div><button class="btn-answer" onclick="rev(this)">👁️ إظهار الشرح والمفاتيح</button><div class="answer-box"><div class="grammar-explanation">${qObj.e}</div></div>`;
        cont.appendChild(row);
    });
}

window.sel = function(optItem, event) {
    if(event.target.classList.contains('w-int')) return;
    let row = optItem.closest('.question-row');
    if(row.classList.contains('answered')) return; 
    let correctIndex = row.getAttribute('data-ans');
    let selectedIndex = optItem.getAttribute('data-i');
    row.classList.add('answered'); optItem.classList.add('selected');
    row.querySelectorAll('.opt-item').forEach(item => { if (item.getAttribute('data-i') === correctIndex) item.classList.add('correct'); });
    if (selectedIndex !== correctIndex) optItem.classList.add('wrong');
    if (!isExam) { let btn = row.querySelector('.btn-answer'); if (btn) btn.click(); }
};

window.rev = function(btn) {
    let box = btn.nextElementSibling;
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; btn.innerHTML = '🙈 إخفاء الشرح والمفاتيح'; } 
    else { box.style.display = 'none'; btn.innerHTML = '👁️ إظهار الشرح والمفاتيح'; }
};

window.setMode = function(m) {
    isExam = (m === 'exam');
    let c = document.getElementById('q-container');
    document.getElementById('btn-study').className = `mode-btn btn-study ${!isExam?'active-mode':''}`;
    document.getElementById('btn-exam').className = `mode-btn btn-exam ${isExam?'active-mode':''}`;
    document.getElementById('btn-result').style.display = isExam ? 'block' : 'none';
    document.getElementById('res-box').style.display = 'none';
    c.className = isExam ? 'questions-container exam-mode' : 'questions-container train-mode';
    if(synth) synth.cancel(); tooltip.style.display = 'none';
    
    let rows = Array.from(c.querySelectorAll('.question-row'));
    rows.forEach(r => {
        r.classList.remove('answered');
        r.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected','correct','wrong'));
        r.querySelector('.answer-box').style.display = 'none';
        r.querySelector('.btn-answer').innerHTML = '👁️ إظهار الشرح والمفاتيح';
    });

    if(isExam) {
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort(() => Math.random() - 0.5).forEach(o => optsCont.appendChild(o));
        });
        rows.sort(() => Math.random() - 0.5).forEach(r => c.appendChild(r));
    } else {
        rows.sort((a,b) => a.getAttribute('data-orig') - b.getAttribute('data-orig'));
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort((a,b) => a.getAttribute('data-i') - b.getAttribute('data-i')).forEach(o => optsCont.appendChild(o));
            c.appendChild(r);
        });
    }
};

window.showResult = function() {
    let rows = document.querySelectorAll('.question-row'), corr = 0, ans = 0;
    rows.forEach(r => { let s = r.querySelector('.opt-item.selected'); if(s) { ans++; if(s.classList.contains('correct')) corr++; } });
    let res = document.getElementById('res-box');
    res.innerHTML = ans < rows.length ? `⚠️ أجبت على ${ans} من ${rows.length}.<br> نتيجتك: ${corr} / ${rows.length}` : `النتيجة النهائية: ${corr} / ${rows.length}<br>🏆 ممتاز يا أستاذ حمادة!`;
    res.style.display = "block"; window.scrollTo({ top: res.offsetTop - 100, behavior: 'smooth' });
};

document.addEventListener('click', e => { if(!e.target.classList.contains('w-int')) { tooltip.style.display = 'none'; if(document.querySelector('.w-int.active-speak')) document.querySelector('.w-int.active-speak').classList.remove('active-speak'); } });
build();
})();
</script>
