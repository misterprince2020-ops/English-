                    { q: "___ your father working today <span class='text-red-600 font-bold'>right now</span>?", choices: ["Am", "Is", "Are", "Does"], ans: 1 },
                    { q: "We ___ lunch <span class='text-red-600 font-bold'>at present</span>.", choices: ["is having", "are having", "have", "has"], ans: 1 }

        // Function to tokenize text into clickable words for audio and translation
        function makeWordsClickable(htmlText) {
            // Temporarily replace HTML tags like <span ...> with tokens so we don't break them
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlText;
            
            // Recursively process text nodes
            function processNode(node) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.nodeValue;
                    const words = text.split(/(\s+)/);
                    const fragment = document.createDocumentFragment();
                    
                    words.forEach(word => {
                        if (word.trim().length > 0) {
                            const span = document.createElement('span');
                            span.className = 'word-token';
                            span.textContent = word;
                            span.onclick = (e) => {
                                e.stopPropagation();
                                handleWordClick(word);
                            };
                            fragment.appendChild(span);
                        } else {
                            fragment.appendChild(document.createTextNode(word));
                        }
                    });
                    node.parentNode.replaceChild(fragment, node);
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    Array.from(node.childNodes).forEach(processNode);
                }
            }
            
            processNode(tempDiv);
            return tempDiv.innerHTML;
        }

        function handleWordClick(word) {
            const cleanWord = word.replace(/[.,/#!$%^&*;:{}=\-_`~()?]/g, "").toLowerCase();
            const translation = dictionary[cleanWord] || "غير موجود في القاموس السريع";
            
            // Speak using Speech Synthesis
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(cleanWord);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }

            // Update floating box
            const infoBox = document.getElementById('selected-word-info');
            infoBox.innerHTML = `Word: <strong class="text-blue-600">"${cleanWord}"</strong> ➔ المعنى العربي: <strong class="text-green-700">"${translation}"</strong>`;
            
            const box = document.getElementById('translator-box');
            box.classList.add('bg-red-100', 'border-red-600');
            setTimeout(() => {
                box.classList.remove('bg-red-100', 'border-red-600');
            }, 500);
        }

        function clearTranslationBox() {
            document.getElementById('selected-word-info').textContent = 'Click any word in questions or choices...';
        }

        // Render Groups and Questions
        function renderTest() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';

            groupsData.forEach((group, gIndex) => {
                let groupHTML = `
                    <div class="bg-white rounded-2xl shadow-md p-6 mb-8 border border-slate-200">
                        <h2 class="text-2xl font-bold text-indigo-700 mb-6 pb-2 border-b-2 border-indigo-100">${group.title}</h2>
                        <div id="group-${gIndex}-questions" class="space-y-6">
                `;

                group.questions.forEach((q, qIndex) => {
                    const clickableQText = makeWordsClickable(q.q);
                    groupHTML += `
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 shadow-sm question-card" data-group="${gIndex}" data-q="${qIndex}" data-ans="${q.ans}">
                            <div class="text-xl font-semibold mb-3 text-slate-900 flex items-start">
                                <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-2.5 py-0.5 rounded mr-3 mt-1">${qIndex + 1}</span>
                                <div class="flex-1">${clickableQText}</div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-8 choices-container">
                    `;

                    q.choices.forEach((choice, cIndex) => {
                        const clickableChoice = makeWordsClickable(choice);
                        groupHTML += `
                            <label class="flex items-center p-3 bg-white border border-slate-300 rounded-lg cursor-pointer hover:bg-indigo-50 transition">
                                <input type="radio" name="q_${gIndex}_${qIndex}" value="${cIndex}" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 mr-3">
                                <span class="text-lg text-slate-700">${clickableChoice}</span>
                            </label>
                        `;
                    });

                    groupHTML += `
                            </div>
                            <div id="feedback_${gIndex}_${qIndex}" class="mt-3 pl-8 hidden font-semibold text-base"></div>
                        </div>
                    `;
                });

                groupHTML += `
                        </div>
                        <!-- Group Action Buttons -->
                        <div class="mt-8 flex flex-wrap gap-4 pt-4 border-t border-slate-200">
                            <button onclick="shuffleGroup(${gIndex})" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center">
                                🔀 Shuffle Questions
                            </button>
                            <button onclick="checkGroup(${gIndex})" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow transition flex items-center">
                                ✅ Show Score & Correction
                            </button>
                            <div id="score_result_${gIndex}" class="ml-auto text-xl font-extrabold flex items-center"></div>
                        </div>
                    </div>
                `;

                container.innerHTML += groupHTML;
            });
        }

        // Check Group Score and Show Instant Corrections
        function checkGroup(gIndex) {
            const group = groupsData[gIndex];
            let correctCount = 0;

            group.questions.forEach((q, qIndex) => {
                const radios = document.querySelectorAll(`input[name="q_${gIndex}_${qIndex}"]`);
                let selectedVal = -1;
                radios.forEach((radio, rIdx) => {
                    if (radio.checked) selectedVal = rIdx;
                });

                const feedbackDiv = document.getElementById(`feedback_${gIndex}_${qIndex}`);
                feedbackDiv.classList.remove('hidden');

                if (selectedVal === q.ans) {
                    correctCount++;
                    feedbackDiv.innerHTML = `<span class="text-emerald-600">✔ Correct! Great job.</span>`;
                } else if (selectedVal === -1) {
                    feedbackDiv.innerHTML = `<span class="text-amber-600">⚠ Not answered. The correct answer is: <strong>${q.choices[q.ans]}</strong></span>`;
                } else {
                    feedbackDiv.innerHTML = `<span class="text-red-600">✖ Incorrect. The correct answer is: <strong>${q.choices[q.ans]}</strong></span>`;
                }
            });

            const scoreDisplay = document.getElementById(`score_result_${gIndex}`);
            scoreDisplay.innerHTML = `Score: <span class="text-indigo-700">${correctCount} / 10</span>`;
        }

        // Shuffle Group Questions
        function shuffleGroup(gIndex) {
            // Fisher-Yates shuffle
            for (let i = groupsData[gIndex].questions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [groupsData[gIndex].questions[i], groupsData[gIndex].questions[j]] = [groupsData[gIndex].questions[j], groupsData[gIndex].questions[i]];
            }
            renderTest();
        }

        // Initialize test on load
        window.onload = renderTest;
    </script>
