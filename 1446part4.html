{q:"10. The difference between the American language and the British language is ........", o:["A. writing | أسلوب الكتابة", "B. reading | مهارة القراءة", "C. grammar | القواعد النحوية الأساسية", "D. vocabulary | المفردات والكلمات (وكذلك النطق)"], c:3, t:"الفرق بين اللغة الأمريكية واللغة البريطانية يكمن في ........", e:"<div class='box-hint'>من تجميعات 1446: الفرق الأساسي بين الإنجليزية الأمريكية والبريطانية يكمن غالباً في المفردات (مثل lorry - truck) والتهجئة.</div>"},

{q:"12. What is the teaching method where a teacher shares a video or learning material with students before class, and then uses class time for difficult tasks, discussions, and practical activities under the teacher's supervision?", o:["A. Flipped classroom | الفصل المقلوب", "B. Synchronous learning | التعلم المتزامن", "C. Asynchronous learning | التعلم غير المتزامن", "D. Distance learning | التعلم عن بعد"], c:0, t:"ما هي طريقة التدريس التي يشارك فيها المعلم مقطع فيديو مع الطلاب قبل الحصة، ثم يستخدم وقت الحصة للأنشطة العملية؟", e:"<div class='box-hint'>من تجميعات 1446: في الفصل المقلوب (Flipped classroom)، يتعلم الطلاب المادة الأساسية في المنزل ويتم استغلال وقت الحصة للتطبيق والمناقشة.</div>"},
{q:"13. The words (hence, in addition, moreover...) are the glue that holds your writing together. They help you smoothly connect ideas and are called...", o:["A. Compound words | كلمات مركبة", "B. Transition words | كلمات انتقال (روابط نصية)", "C. Sequencing words | كلمات تسلسل ترتيبي", "D. Ordering words | كلمات ترتيب"], c:1, t:"الكلمات (ومن ثم، بالإضافة إلى، علاوة على ذلك...) هي الغراء الذي يربط كتاباتك معاً. إنها تساعدك على ربط الأفكار بسلاسة وتسمى...", e:"<div class='box-hint'>من تجميعات 1446: كلمات الانتقال (Transition words) تُستخدم لربط الأفكار والجمل بسلاسة في الكتابة ونقل القارئ بين المعاني.</div>"},
{q:"14. Which of the following is a lexical morpheme?", o:["A. Cat | قطة (اسم مستقل)", "B. For | حرف جر", "C. Plural -s | حرف (s) الجمع", "D. Past tense -ed | لاحقة الماضي (ed)"], c:0, t:"أي مما يلي يُعد مورفيماً معجمياً (Lexical morpheme)؟", e:"<div class='box-hint'>من تجميعات 1446: المورفيم المعجمي (Lexical) يحمل معنى مستقلاً بذاته، مثل الأسماء والأفعال والصفات (Cat).</div>"},
{q:"15. Objectives should be ...", o:["A. General | عامة وفضفاضة", "B. Broad | واسعة النطاق", "C. Realistic | واقعية وقابلة للتحقيق", "D. Perceptual | إدراكية شعورية"], c:2, t:"يجب أن تكون الأهداف التعليمية ...", e:"<div class='box-hint'>من تجميعات 1446: من أهم شروط الأهداف الجيدة (SMART) أن تكون واقعية (Realistic) وقابلة للقياس والتحقيق في زمن الحصة.</div>"},
{q:"16. EFL students from collectivist cultures may have trouble with...", o:["A. Doing research | القيام بالأبحاث الأكاديمية", "B. Doing homework | إنجاز الواجبات المنزلية", "C. Asking questions | طرح الأسئلة والتعبير عن عدم الفهم", "D. Taking exams | خوض الاختبارات التحريرية"], c:2, t:"طلاب اللغة الإنجليزية من الثقافات الجماعية قد يواجهون مشاكل في...", e:"<div class='box-hint'>من تجميعات 1446: الطلاب من الثقافات الجماعية غالباً ما يترددون في المبادرة الفردية وطرح الأسئلة (Asking questions) احتراماً للمعلم وتجنباً للإحراج.</div>"},
{q:"17. The suffix (-en) in 'children' comes from ...", o:["A. Old English language | اللغة الإنجليزية القديمة", "B. Phonological | تغييرات صوتية", "C. Grammatical | قواعد نحوية حديثة", "D. Borrowing from another language | استعارة من لغة أخرى"], c:0, t:"اللاحقة (-en) في كلمة 'children' أصلها من ...", e:"<div class='box-hint'>من تجميعات 1446: اللاحقة '-en' هي صيغة جمع شاذة تعود في أصلها إلى جذور الإنجليزية القديمة (Old English).</div>"},
{q:"18. Ali made a mistake and corrected it by himself while speaking. This phenomenon is called ...", o:["A. Performance | أداء عادي", "B. Cultural awareness | وعي ثقافي بيئي", "C. Lack of competence | نقص أو ضعف في الكفاءة", "D. Meta-linguistic awareness | الوعي ما وراء اللغوي (الإدراك الذاتي للغة)"], c:3, t:"ارتكب علي خطأ وصححه بنفسه أثناء التحدث. هذه الظاهرة تسمى ...", e:"<div class='box-hint'>من تجميعات 1446: الوعي فوق اللغوي (Meta-linguistic) هو إدراك المتعلم للقواعد والأخطاء وقدرته على مراقبة وتصحيح لغته ذاتياً أثناء التحدث.</div>"},
{q:"19. ........ is a teaching method developed by the Bulgarian psychiatrist Georgi Lozanov", o:["A. Eclectic Method | الطريقة الانتقائية", "B. Direct Method | الطريقة المباشرة", "C. Suggestopedia | الطريقة الإيحائية (الاسترخاء والتعلم التلقائي)", "D. Silent Way | الطريقة الصامتة"], c:2, t:"........ هي طريقة تدريس طورها الطبيب النفسي البلغاري جورجي لوزانوف", e:"<div class='box-hint'>من تجميعات 1446: طريقة 'Suggestopedia' تعتمد على تهيئة بيئة مريحة للمتعلم (موسيقى واسترخاء) لكسر الحواجز النفسية واكتساب اللغة.</div>"},
{q:"20. I can see the sea from the window in my living room. The underlined words are ...", o:["A. Homophones | متجانسات صوتية (نفس النطق، إملاء مختلف)", "B. Homonyms | متجانسات لفظية (نفس النطق والإملاء)", "C. Allophones | ألوفونات صوتية متنوعة", "D. Synonyms | مترادفات لغوية"], c:0, t:"(أستطيع أن أرى see البحر sea من النافذة). الكلمتان المظللتان تعتبران ...", e:"<div class='box-hint'>من تجميعات 1446: الكلمتان (see / sea) لهما نفس النطق تماماً ولكنهما تختلفان في التهجئة والمعنى، فتسميان (Homophones).</div>"},
{q:"21. The difference between first language and second language can lead to ...", o:["A. Bilingualism | الثنائية اللغوية المثالية", "B. Fossilization | التحجر اللغوي وتثبيت الأخطاء", "C. Native level of pronunciation | إتقان النطق كمستوى أصلي", "D. Positive transfer | النقل الإيجابي المطلق"], c:1, t:"الاختلاف الجذري بين اللغة الأولى واللغة الثانية يمكن أن يؤدي إلى ...", e:"<div class='box-hint'>من تجميعات 1446: الاختلافات الكبيرة بين L1 و L2 تؤدي إلى تداخل سلبي قد ينتهي بـ (Fossilization) حيث يتجمد الخطأ ويصعب تصحيحه.</div>"},
{q:"22. Testing has an impact on teaching and learning, whether negative or positive. This is referred to as ........", o:["A. Reflection | التأمل والمراجعة", "B. Summative | التقييم الختامي", "C. Wash-back | الأثر الارتدادي للاختبارات", "D. Implementation | التنفيذ العملي"], c:2, t:"تأثير الاختبارات على التدريس والتعلم، سواء كان سلبياً أو إيجابياً، يُشار إليه بـ ........", e:"<div class='box-hint'>من تجميعات 1446: 'Wash-back' هو التأثير المباشر الذي يتركه شكل ومحتوى الاختبارات على طريقة التدريس وما يدرسه الطلاب.</div>"},
{q:"23. An application a student can use to cooperate and write an assignment:", o:["A. Adobe Acrobat | برنامج أدوبي لقراءة الـ PDF", "B. Google Docs | مستندات جوجل السحابية التعاونية", "C. Microsoft Publisher | برنامج بابلشر للتصميم المكتبي", "D. PowerPoint | برنامج العروض التقديمية"], c:1, t:"تطبيق يمكن للطالب استخدامه للتعاون مع زملائه وكتابة واجب مشترك:", e:"<div class='box-hint'>من تجميعات 1446: Google Docs يسمح للطلاب بالتواجد والتحرير والتعاون والكتابة معاً في نفس المستند في الوقت الفعلي.</div>"},
{q:"24. Grammarly program is used in ... skill.", o:["A. Writing | مهارة الكتابة وتدقيقها", "B. Speaking | مهارة التحدث", "C. Listening | مهارة الاستماع", "D. Reading | مهارة القراءة"], c:0, t:"برنامج 'جرامرلي' يُستخدم لدعم وتحسين مهارة ...", e:"<div class='box-hint'>من تجميعات 1446: Grammarly هو أداة ذكاء اصطناعي مخصصة للمساعدة في تصحيح القواعد اللغوية والإملاء أثناء (الكتابة).</div>"},
{q:"25. ........ is used when a student works with a teacher or a more advanced student.", o:["A. Scaffolding | السقالات / الدعم التدريجي التوجيهي", "B. Alignment | المواءمة والربط", "C. Peer assessment | تقييم الأقران المتبادل", "D. Self-monitoring | المراقبة الذاتية"], c:0, t:"........ يُستخدم عندما يعمل الطالب مع معلم أو طالب أكثر تقدماً لمساعدته على إنجاز مهمة.", e:"<div class='box-hint'>من تجميعات 1446: الدعم التدريجي المؤقت (Scaffolding) يساعد الطالب على عبور فجوة التعلم وتأدية مهام لا يستطيع إنجازها بمفرده.</div>"},
{q:"26. 'Previously, meanwhile, afterwards' are examples of ........ connectives.", o:["A. listing | روابط سرد وقوائم", "B. causal | روابط سببية للعلة والمعلول", "C. temporal | روابط زمنية للترتيب الزمني", "D. comparative | روابط مقارنة وتفضيل"], c:2, t:"كلمات (سابقاً، وفي نفس الوقت، وبعد ذلك) هي أمثلة على الروابط ........", e:"<div class='box-hint'>من تجميعات 1446: هذه الكلمات تُستخدم لربط وتوضيح تسلسل الأحداث بناءً على الزمن، لذا تُعتبر روابط زمنية (Temporal Connectives).</div>"},
{q:"27. According to Krashen, learners can learn best when they are highly motivated and confident. This is known as ... hypothesis.", o:["A. Affective filter | فرضية المرشح الوجداني (حاجز المشاعر)", "B. Input monitor | فرضية مراقب المدخلات", "C. Natural order | فرضية الترتيب الطبيعي للاكتساب", "D. Acquisition learning | فرضية الاكتساب والتعلم الواعي"], c:0, t:"وفقاً لكراشن، يتعلم الطلاب بشكل أفضل عندما يكونون متحفزين وواثقين من أنفسهم. تُعرف هذه بفرضية ...", e:"<div class='box-hint'>من تجميعات 1446: فرضية (المرشح العاطفي) تنص على أن الدافعية العالية والثقة وضعف القلق تسهل دخول اللغة للعقل وتسرع التعلم.</div>"},
{q:"28. How many sounds are there in the word 'sigh' ?", o:["A. 1 | صوت واحد", "B. 2 | صوتان", "C. 3 | ثلاثة أصوات", "D. 4 | أربعة أصوات"], c:1, t:"كم عدد الأصوات (الفونيمات) المنطوقة في كلمة 'sigh'؟", e:"<div class='box-hint'>من تجميعات 1446: رغم أنها 4 حروف، إلا أن كلمة 'sigh' تُنطق /saɪ/ وتحتوي على صوتين فقط هما الصوت الساكن /s/ والإدغام /aɪ/.</div>"},
{q:"29. Mr. Ahmed wants to teach his students a skill that will help them or motivate them to learn independently. Which of the following is the most appropriate skill?", o:["A. Collaborative planning | التخطيط التعاوني الجماعي", "B. Autonomy | الاستقلالية والتعلم الذاتي", "C. Dependency on teacher | الاعتمادية الكلية على المعلم"], c:1, t:"يريد الأستاذ أحمد تعليم طلابه مهارة تساعدهم أو تحفزهم على التعلم بشكل مستقل. أي من المهارات التالية هي الأنسب؟", e:"<div class='box-hint'>من تجميعات 1446: الاستقلالية (Autonomy) هي المهارة التي تمكّن الطالب من أخذ زمام المبادرة والتعلم بنفسه دون الاعتماد الدائم على المعلم.</div>"},
{q:"30. According to Krashen's theory, how should students learn scientific material in the early grades?", o:["A. From difficult to easy | من الصعب إلى السهل", "B. From easy to difficult | من السهل إلى الصعب (التقليدية)", "C. In natural sequences | في تسلسلات طبيعية فطرية", "D. From advanced to basic | من المتقدم إلى الأساسي"], c:2, t:"وفقاً لنظرية كراشن، كيف يجب أن يتعلم الطلاب المواد العلمية (واللغوية) في الصفوف المبكرة؟", e:"<div class='box-hint'>من تجميعات 1446: نظرية كراشن (Natural order) تشير إلى أن التعلم والاكتساب يجب أن يتبع تسلسلاً طبيعياً غير متكلف ليطابق تطور العقل.</div>"},
{q:"31. The list of words mean, men, main, and the list of words guess, gist, genius, ... are examples of learning ........", o:["A. Semantic | التعلم الدلالي (بناءً على المعاني)", "B. Phonetic | التعلم الصوتي (بناءً على النطق والأصوات)", "C. Morphology | التعلم الصرفي (بناءً على الجذور واللواحق)", "D. Syntax | التعلم النحوي (بناءً على ترتيب الجمل)"], c:1, t:"قوائم الكلمات المجمعة (mean, men, main) و (guess, gist, genius) هي أمثلة على التعلم ........", e:"<div class='box-hint'>من تجميعات 1446: تجميع الكلمات بناءً على تشابهها في النطق والصوت يوضح استراتيجية التعلم الصوتي (Phonetic).</div>"},
{q:"32. The teacher asked the students to watch a video about water pollution and its impact on marine life, then asked them to write what they saw in a text. This is an example of ........", o:["A. Comprehension | الفهم والاستيعاب البسيط", "B. Analysis | التحليل وتفكيك المحتوى", "C. Reproduction | إعادة الإنتاج (الاستنساخ التعبيري)"], c:2, t:"طلب المعلم من الطلاب مشاهدة فيديو عن تلوث المياه، ثم طلب منهم كتابة ما شاهدوه في نص. هذا مثال على ........", e:"<div class='box-hint'>من تجميعات 1446: عندما يطلب المعلم من الطلاب إعادة إنتاج أو استنساخ المعلومات التي استوعبوها بنفس المعنى يُسمى ذلك (Reproduction).</div>"},
{q:"33. Pre-writing activities involve:", o:["A. Drafting | كتابة المسودة المتصلة", "B. Revising | المراجعة والتعديل الجوهري", "C. Proofreading | التدقيق الإملائي النهائي", "D. Free writing | الكتابة الحرة العشوائية لتوليد الأفكار"], c:3, t:"أنشطة ما قبل الكتابة (Pre-writing) تتضمن:", e:"<div class='box-hint'>من تجميعات 1446: الكتابة الحرة (Free writing) والعصف الذهني هي أنشطة تسبق الكتابة الرسمية لتدفق الأفكار دون قيود أو تركيز على الأخطاء.</div>"},
{q:"34. In the reading passage entitled 'Healthy Coffee,' students are asked to write the advantages and disadvantages in a table. This refers to ........ skill.", o:["A. Scanning | المسح السريع لاستخراج معلومة محددة", "B. Skimming | التصفح السريع لأخذ فكرة عامة", "C. Intensive reading | القراءة المكثفة للتحليل الدقيق"], c:0, t:"في قطعة القراءة بعنوان 'القهوة الصحية'، يُطلب من الطلاب كتابة المزايا والعيوب في جدول. هذا يشير إلى مهارة ........", e:"<div class='box-hint'>من تجميعات 1446: البحث عن تفاصيل دقيقة ومعلومات محددة (مثل المزايا والعيوب) لملء جدول هو تطبيق مباشر لمهارة الـ Scanning.</div>"},
{q:"35. The Cornell method is a ............ technique that helps in listening skill", o:["A. paraphrasing | إعادة صياغة المعنى بأسلوب مختلف", "B. previewing | المراجعة والنظرة المسبقة", "C. summarizing | التلخيص السريع", "D. note-taking | تدوين وتسجيل الملاحظات المنظم"], c:3, t:"طريقة كورنيل هي تقنية لـ ............ تساعد في مهارة الاستماع والمحاضرات.", e:"<div class='box-hint'>من تجميعات 1446: طريقة Cornell هي تقنية عالمية وفعالة جداً لترتيب وتدوين الملاحظات (note-taking) أثناء الاستماع للمحاضرات.</div>"},
{q:"36. The final exam is considered as ................. assessment", o:["A. diagnostic | تقييم تشخيصي مبدئي", "B. formative | تقييم تكويني/بنائي مستمر", "C. summative | تقييم ختامي/نهائي شامل", "D. placement | تقييم لتحديد المستوى الدراسي"], c:2, t:"يُعتبر الاختبار النهائي بمثابة تقييم .................", e:"<div class='box-hint'>من تجميعات 1446: الاختبار النهائي الذي يُعطى في نهاية الفصل للحكم على مستوى الطالب ونجاحه يُعتبر تقييماً ختامياً (Summative).</div>"},
{q:"37. An L2 learner may experience ............ in which incorrect language becomes a habit and cannot be easily corrected.", o:["A. laziness | كسل دراسي مؤقت", "B. a plateau | ركود وثبات في المستوى", "C. fossilization | تحجر لغوي وتجمد الأخطاء", "D. loss of interest | فقدان الاهتمام والدافعية"], c:2, t:"قد يواجه متعلم اللغة الثانية ............ حيث تصبح اللغة غير الصحيحة (الأخطاء) عادة ولا يمكن تصحيحها بسهولة.", e:"<div class='box-hint'>من تجميعات 1446: التحجر اللغوي (Fossilization) هو الحالة التي يرسخ فيها الخطأ اللغوي ويصبح عادة دائمة في ذهن المتعلم يصعب جداً تصحيحها.</div>"},
{q:"38. When the teacher gives students words and asks them to break them down into their original parts, what is the teacher teaching them?", o:["A. Semantic | علم الدلالة والمعاني الشاملة", "B. Morphology | علم الصرف وتكوين أجزاء الكلمة", "C. Phonetic | علم الصوتيات ونطق الحروف", "D. Syntax | علم النحو وبناء الجمل"], c:1, t:"عندما يعطي المعلم الطلاب كلمات ويطلب منهم تفكيكها إلى أجزائها الأصلية (جذور ولواحق)، فماذا يعلمهم المعلم؟", e:"<div class='box-hint'>من تجميعات 1446: المورفولوجيا (Morphology) هي دراسة بنية الكلمات وتفكيكها إلى أجزائها الأصلية مثل الجذور، البوادي، واللواحق.</div>"}
];

let synth = window.speechSynthesis, isExam = false, tooltip = document.getElementById('word-tooltip');

function formatInteractive(text) {
    return text.split(/([a-zA-Z0-9'-]+)/).map(tok => {
        if(/^[a-zA-Z0-9'-]+$/.test(tok)) {
            let clean = tok.toLowerCase();
            return `<b class="w-int" onclick="spk(this, event, '${clean}')">${tok}</b>`;
        }
        return tok;
    }).join('');
}

window.spk = function(el, ev, word) {
    ev.stopPropagation();
    if(!synth) return;
    synth.cancel();
    document.querySelectorAll('.w-int.active-speak').forEach(e => e.classList.remove('active-speak'));
    el.classList.add('active-speak');
    tooltip.textContent = dict[word] || "معنى سياقي";
    let rect = el.getBoundingClientRect();
    tooltip.style.left = (rect.left + window.scrollX) + 'px';
    tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
    tooltip.style.display = 'block';
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
        el.classList.remove('active-speak');
        setTimeout(() => { tooltip.style.display = 'none'; }, 1200);
    };
    synth.speak(u);
};

function build() {
    let cont = document.getElementById('q-container'); cont.innerHTML = '';
    db.forEach((qObj, idx) => {
        let row = document.createElement('div');
        row.className = 'question-row';
        row.setAttribute('data-ans', qObj.c);
        row.setAttribute('data-orig', idx);
        let opts = qObj.o.map((opt, i) => {
            let p = opt.split('|');
            return `<div class="opt-item" data-i="${i}" onclick="sel(this, event)"><div class="choice-badge">${["A","B","C","D"][i]}</div><div class="choice-content"><div class="choice-en" dir="ltr">${formatInteractive(p[0].trim())}</div>${p[1]?`<div class="choice-ar" dir="rtl">${p[1].trim()}</div>`:''}</div></div>`;
        }).join('');
        row.innerHTML = `<div class="q-text-container"><div class="q-number-lbl">${idx + 1}. </div><div class="q-text" dir="ltr">${formatInteractive(qObj.q)}</div></div>${qObj.t?`<div class="full-sentence-translation">📝 ${qObj.t}</div>`:''}<div class="options-inline">${opts}</div><button class="btn-answer" onclick="rev(this)">👁️ إظهار الشرح والمفاتيح</button><div class="answer-box"><div class="grammar-explanation">${qObj.e}</div></div>`;
        cont.appendChild(row);
    });
}

window.sel = function(optItem, event) {
    if(event.target.classList.contains('w-int')) return;
    let row = optItem.closest('.question-row');
    if(row.classList.contains('answered')) return; 
    let correctIndex = row.getAttribute('data-ans');
    let selectedIndex = optItem.getAttribute('data-i');
    row.classList.add('answered'); optItem.classList.add('selected');
    row.querySelectorAll('.opt-item').forEach(item => { if (item.getAttribute('data-i') === correctIndex) item.classList.add('correct'); });
    if (selectedIndex !== correctIndex) optItem.classList.add('wrong');
    if (!isExam) { let btn = row.querySelector('.btn-answer'); if (btn) btn.click(); }
};

window.rev = function(btn) {
    let box = btn.nextElementSibling;
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; btn.innerHTML = '🙈 إخفاء الشرح والمفاتيح'; } 
    else { box.style.display = 'none'; btn.innerHTML = '👁️ إظهار الشرح والمفاتيح'; }
};

window.setMode = function(m) {
    isExam = (m === 'exam');
    let c = document.getElementById('q-container');
    document.getElementById('btn-study').className = `mode-btn btn-study ${!isExam?'active-mode':''}`;
    document.getElementById('btn-exam').className = `mode-btn btn-exam ${isExam?'active-mode':''}`;
    document.getElementById('btn-result').style.display = isExam ? 'block' : 'none';
    document.getElementById('res-box').style.display = 'none';
    c.className = isExam ? 'questions-container exam-mode' : 'questions-container train-mode';
    if(synth) synth.cancel(); tooltip.style.display = 'none';
    
    let rows = Array.from(c.querySelectorAll('.question-row'));
    rows.forEach(r => {
        r.classList.remove('answered');
        r.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected','correct','wrong'));
        r.querySelector('.answer-box').style.display = 'none';
        r.querySelector('.btn-answer').innerHTML = '👁️ إظهار الشرح والمفاتيح';
    });

    if(isExam) {
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort(() => Math.random() - 0.5).forEach(o => optsCont.appendChild(o));
        });
        rows.sort(() => Math.random() - 0.5).forEach(r => c.appendChild(r));
    } else {
        rows.sort((a,b) => a.getAttribute('data-orig') - b.getAttribute('data-orig'));
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort((a,b) => a.getAttribute('data-i') - b.getAttribute('data-i')).forEach(o => optsCont.appendChild(o));
            c.appendChild(r);
        });
    }
};

window.showResult = function() {
    let rows = document.querySelectorAll('.question-row'), corr = 0, ans = 0;
    rows.forEach(r => { let s = r.querySelector('.opt-item.selected'); if(s) { ans++; if(s.classList.contains('correct')) corr++; } });
    let res = document.getElementById('res-box');
    res.innerHTML = ans < rows.length ? `⚠️ أجبت على ${ans} من ${rows.length}.<br> نتيجتك: ${corr} / ${rows.length}` : `النتيجة النهائية: ${corr} / ${rows.length}<br>🏆 ممتاز يا أستاذ حمادة!`;
    res.style.display = "block"; window.scrollTo({ top: res.offsetTop - 100, behavior: 'smooth' });
};

document.addEventListener('click', e => { if(!e.target.classList.contains('w-int')) { tooltip.style.display = 'none'; if(document.querySelector('.w-int.active-speak')) document.querySelector('.w-int.active-speak').classList.remove('active-speak'); } });
build();
})();
</script>
</body>
