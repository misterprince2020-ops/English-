{q:"9. One use knowledge, to affixation the understanding of the reading text relies on identifying specific details rather than individual elements like letters and words, and from there reaching a higher level:", o:["A. Top-down | المعالجة من أعلى لأسفل", "B. Bottom-up | المعالجة من أسفل لأعلى", "C. deduction | الاستنتاج", "D. scanning | المسح السريع"], c:0, t:"الفهم الذي يعتمد على المعنى الكلي والتفاصيل المحددة بدلاً من الحروف والكلمات المفردة يسمى:", e:"<span class='box-hint'>الاعتماد على المعنى الكلي والخلفية المعرفية لفهم النص يُسمى (Top-down processing).</span>"},
{q:"10. Inter-rater reliability assessment can be evaluated by", o:["A. Multiple teachers | معلمين متعددين يقيمون نفس الأداء", "B. Student and teacher | الطالب والمعلم", "C. Student and rest of the class | الطالب وباقي الفصل", "D. Student with his peer | الطالب وزميله"], c:0, t:"تقييم موثوقية المقيمين (Inter-rater reliability) يتم تقييمها من خلال:", e:"<span class='box-hint'>تقييم نفس الأداء أو العمل بواسطة مقيمين (معلمين) مختلفين لضمان الثبات والموضوعية.</span>"},
{q:"11. Which option is best suited for presenting information along with a chart, and less text on a single page?", o:["A. PowerPoint | باوربوينت", "B. Infographic | إنفوجرافيك", "C. Excel | إكسل", "D. Word | وورد"], c:1, t:"أي خيار هو الأنسب لتقديم معلومات مع رسم بياني، ونص أقل في صفحة واحدة؟", e:"<span class='box-hint'>الإنفوجرافيك (Infographic) يختصر المعلومات المعقدة ويعرضها بنظرة بصرية شاملة في صفحة واحدة.</span>"},
{q:"12. Which of the following concepts refers to the scientific study of language and its structure?", o:["A. Rhetoric | البلاغة", "B. Semantics | الدلالة المعجمية", "C. Pragmatics | التداولية", "D. Linguistics | اللغويات"], c:3, t:"أي من المفاهيم التالية يشير إلى الدراسة العلمية للغة وبنيتها؟", e:"<span class='box-hint'>المصطلح الشامل للدراسة العلمية للغة وتراكيبها هو اللغويات (Linguistics).</span>"},
{q:"13. In grammar lesson about the past tense which of the following achieves a high level of thinking?", o:["A. students will be able to list some irregular past tense verbs | أن يعدد الطلاب بعض الأفعال الشاذة", "B. students will be able to compose sentences describing past events | أن يكتب (يؤلف) الطلاب جملاً تصف أحداثاً ماضية", "C. students will be able to identify the difference between the past and the present | أن يحدد الطلاب الفرق", "D. students will be able to memorize rules | أن يحفظ الطلاب القواعد"], c:1, t:"في درس قواعد عن الماضي، أي الأهداف يحقق مستوى أعلى من التفكير (حسب هرم بلوم)؟", e:"<span class='box-hint'>التأليف والإنتاج (Compose) يمثل مستوى التركيب/الإنشاء وهو من مهارات التفكير العليا.</span>"},
{q:"14. Teachers usually activate students' background knowledge about a topic through ........ activates.", o:["A. Collaborative | الأنشطة التعاونية", "B. Problem-solving | أنشطة حل المشكلات", "C. The warm-up | أنشطة الإحماء والتهيئة", "D. Challenging | الأنشطة الصعبة والتحديات"], c:2, t:"عادة ما ينشط المعلمون المعرفة السابقة للطلاب حول موضوع ما من خلال أنشطة ........", e:"<span class='box-hint'>تنشيط المعرفة السابقة وتهيئة العقل لدرس جديد يتم عبر أنشطة الإحماء (Warm-up).</span>"},
{q:"15. In ........ lesson, students practice using 'hence,' 'in addition', and 'beside' in their writing.", o:["A. Essay organization | تنظيم المقال", "B. Transitions word | كلمات الانتقال والروابط", "C. Outline creation | إنشاء المخطط", "D. Creative writing | الكتابة الإبداعية"], c:1, t:"في درس ........، يمارس الطلاب استخدام كلمات مثل 'ومن ثم'، 'بالإضافة إلى'، و 'بجانب' في كتاباتهم.", e:"<span class='box-hint'>هذه الكلمات التي تربط الأفكار والفقرات ببعضها تسمى الروابط الانتقالية (Transitions words).</span>"},
{q:"16. In the early stages of language acquisition, what is a characteristic feature commonly observed?", o:["A. Nodding yes or no | الإيماء بنعم أو لا", "B. Limited production | الإنتاج اللغوي المحدود (مرحلة الصمت)", "C. Advanced syntactical structures | استخدام تراكيب نحوية متقدمة", "D. Fluent conversation | محادثة طليقة"], c:1, t:"في المراحل المبكرة جداً من اكتساب اللغة، ما هي السمة المميزة التي تُلاحظ عادةً؟", e:"<span class='box-hint'>المبتدئون يمرون بفترة صمت أو استجابات قصيرة جداً تسمى مرحلة الإنتاج المحدود (Limited production).</span>"},
{q:"17. The main purpose of teaching speaking is to teach students efficient ........", o:["A. Grammar | قواعد نحوية", "B. Enunciation | لفظ واضح وضوح الحروف", "C. Pronunciation | نطق الكلمات", "D. Communication | تواصل فعال"], c:3, t:"الغرض الرئيسي والأساسي من تدريس التحدث هو تعليم الطلاب ........ فعال.", e:"<span class='box-hint'>الهدف الأسمى لتعلم أي مهارة إنتاجية كالتحدث هو القدرة على تحقيق التواصل الفعال (Communication).</span>"},
{q:"18. According to Krashen, learners can learn best when they are highly motivated and confident. This is known as ........ hypothesis.", o:["A. An affective filter | فرضية المرشح الوجداني", "B. An input monitor | مراقب المدخلات", "C. A natural order | الترتيب الطبيعي", "D. The acquisition of learning | الاكتساب والتعلم"], c:0, t:"وفقاً لكراشن، يتعلم الطلاب بشكل أفضل عندما يكونون متحفزين وواثقين. تُعرف هذه بفرضية:", e:"<span class='box-hint'>الثقة والدافعية المرتفعة تخفضان حاجز القلق 'المرشح الوجداني' (Affective filter) فتسهل التعلم.</span>"},
{q:"19. The linguistic theory which suggests that all languages share a model of principles and basic properties is called........", o:["A. Universal Grammar | النحو الكلي (العالمي)", "B. Systemic Grammar | النحو النظامي", "C. Input Hypothesis | فرضية المدخلات", "D. Competition Model | نموذج المنافسة"], c:0, t:"النظرية اللغوية التي تقترح أن جميع اللغات تشترك في نموذج من المبادئ والخصائص الأساسية تسمى:", e:"<span class='box-hint'>تشومسكي افترض وجود قواعد كلية فطرية في دماغ الإنسان تشترك فيها كل اللغات وتُعرف بـ (Universal Grammar).</span>"},
{q:"20. Cornell method is a ........ technique used in listening classes.", o:["A. Previewing | مراجعة مسبقة", "B. Note-taking | تدوين الملاحظات", "C. Summarizing | تلخيص", "D. Paraphrasing | إعادة صياغة"], c:1, t:"طريقة كورنيل هي تقنية لـ ........ تُستخدم غالباً في فصول الاستماع أو المحاضرات.", e:"<span class='box-hint'>طريقة كورنيل مصممة خصيصاً لتنظيم وتدوين الملاحظات بشكل احترافي (Note-taking).</span>"},
{q:"21. The combination of both online and face-to-face education is known as ........", o:["A. Blended learning | التعلم المدمج", "B. Exclusive online learning | تعلم حصري عبر الإنترنت", "C. Conventional learning | تعلم تقليدي", "D. Technological isolation | عزلة تكنولوجية"], c:0, t:"الجمع بين التعليم عبر الإنترنت والتعليم وجهاً لوجه يُعرف بـ ........", e:"<span class='box-hint'>الدمج بين الحضور الواقعي والتقنية الإلكترونية يسمى التعلم المدمج (Blended learning).</span>"},
{q:"22. Which one of the following is not applicable to communicative competence?", o:["A. Effective use of language in social context. | الاستخدام الفعال للغة في السياق الاجتماعي", "B. The ability to be appropriate, to know the right thing at the right time | القدرة على أن تكون مناسباً وتقول الشيء الصحيح", "C. The ability to produce sentences for communicative effect | القدرة على إنتاج جمل للتأثير التواصلي", "D. The knowledge of linguistic competence is the same as communicative competence | المعرفة بالكفاءة اللغوية هي نفسها الكفاءة التواصلية"], c:3, t:"أي مما يلي لا ينطبق على الكفاءة التواصلية؟", e:"<span class='box-hint'>الخطأ هو اعتبار الكفاءة اللغوية البحتة (القواعد) مطابقة تماماً للكفاءة التواصلية الشاملة للمواقف.</span>"},
{q:"23. L2 instruction ideally focuses on what:", o:["A. Teaching speaking and listening, then reading and writing | تدريس التحدث والاستماع، ثم القراءة والكتابة", "B. teaching the four skills together at different levels | تدريس المهارات الأربع معاً بمستويات مختلفة", "C. Speaking and writing, then reading | التحدث والكتابة، ثم القراءة", "D. Speaking and reading, then writing | التحدث والقراءة، ثم الكتابة"], c:1, t:"تعليم اللغة الثانية يركز بشكل مثالي على ماذا:", e:"<span class='box-hint'>المنهج التكاملي الحديث يركز على دمج وتدريس المهارات الأربع معاً في سياق واحد.</span>"},
{q:"24. Within the Communicative Language Teaching approach, ........ Competence is not a Communicative competence.", o:["A. Integrative | تكاملية", "B. Discourse | خطابية", "C. Linguistic | لغوية نحوية", "D. Strategic or sociolinguistic | استراتيجية أو اجتماعية لغوية"], c:0, t:"ضمن منهج التدريس التواصلي، الكفاءة ........ ليست من مكونات الكفاءة التواصلية.", e:"<span class='box-hint'>الكفاءة التكاملية (Integrative) ليست من المكونات الأربعة الأساسية لنموذج كانال وسواين الشهير للغة.</span>"},
{q:"25. ........ method overlooked speaking skill?", o:["A. Grammar Translation Method | طريقة القواعد والترجمة", "B. Communication method | الطريقة التواصلية", "C. Direct method | الطريقة المباشرة", "D. Audiolingual | الطريقة السمعية الشفوية"], c:0, t:"الطريقة ........ تجاهلت مهارة التحدث تماماً؟", e:"<span class='box-hint'>طريقة القواعد والترجمة الكلاسيكية ركزت على حفظ القواعد وقراءة النصوص وأهملت التحدث كلياً.</span>"},
{q:"26. Language is a/an ........ system of vocal symbols.", o:["A. Rational | عقلاني", "B. Arbitrary | اعتباطي (عشوائي بلا رابط منطقي)", "C. Logical | منطقي", "D. Small | صغير"], c:1, t:"اللغة هي نظام ........ من الرموز الصوتية.", e:"<span class='box-hint'>العلاقة بين اللفظ والمعنى في اللغة هي علاقة اعتباطية (Arbitrary) فلا يوجد سبب منطقي لتسمية التفاحة تفاحة.</span>"},
{q:"27. An activity that best helps practice skimming is ........", o:["A. Summarizing | التلخيص", "B. Comparing two text | مقارنة نصين", "C. Overviewing a chapter | أخذ نظرة عامة على فصل", "D. Reporting on an article | إعداد تقرير عن مقال"], c:2, t:"النشاط الذي يساعد بشكل أفضل في ممارسة التصفح السريع (skimming) هو ........", e:"<span class='box-hint'>أخذ نظرة عامة سريعة (Overviewing) لاستخراج الفكرة العامة يمثل جوهر التصفح السريع Skimming.</span>"},
{q:"28. Activities which elicit physical action from the students are known as ........", o:["A. Imperative drills | التدريبات الأمرية الحركية", "B. Pair-work activities | أنشطة العمل الثنائي", "C. Group-work activities | أنشطة العمل الجماعي", "D. Conversational dialogues | حوارات المحادثة"], c:0, t:"الأنشطة التي تستدعي استجابة وحركة جسدية من الطلاب تُعرف بـ ........", e:"<span class='box-hint'>التدريبات الأمرية (افتح الباب، اجلس) هي أساس منهج الاستجابة الجسدية الشاملة TPR.</span>"},
{q:"29. ........ Motivation is an inner drive for students to engage in an activity for its own sake because it is interesting and satisfying in itself.", o:["A. Intrinsic | دافعية داخلية (ذاتية)", "B. Extrinsic | دافعية خارجية", "C. Intensive | مكثفة", "D. Exhaustive | شاملة/مرهقة"], c:0, t:"الدافع ........ هو دفع ذاتي يجعل الطلاب يندمجون للتمتع والرضا الذاتي بالنشاط.", e:"<span class='box-hint'>الدافعية النابعة من حب العمل ذاته دون انتظار مكافأة خارجية هي الدافعية الداخلية Intrinsic.</span>"},
{q:"30. ........ is also known as the natural method. It was developed as a reaction to the grammar-translation method.", o:["A. Direct Method | الطريقة المباشرة", "B. Silent Way | الطريقة الصامتة", "C. Communicative Method | الطريقة التواصلية", "D. Audiolingual Method | الطريقة السمعية الشفوية"], c:0, t:"تُعرف أيضاً بالطريقة الطبيعية، وتطورت كرد فعل على طريقة القواعد والترجمة.", e:"<span class='box-hint'>الطريقة المباشرة (Direct Method) تسمى أحياناً بالطريقة الطبيعية وتمنع استخدام الترجمة ولغة الأم.</span>"},
{q:"31. Arab student from another culture does not know the word 'fish', he describes it as 'Animal live in the water', he/she uses:", o:["A. Semantic competence | كفاءة دلالية", "B. Grammatical competence | كفاءة نحوية", "C. Strategic competence | كفاءة استراتيجية (تعويضية)", "D. Communicative competence | كفاءة تواصلية عامة"], c:2, t:"طالب لا يعرف كلمة (fish) فوصفها بـ (حيوان يعيش في الماء)، إنه يستخدم استراتيجية:", e:"<span class='box-hint'>استخدام الحيل اللغوية (كالالتفاف اللفظي) لتعويض النقص اللغوي يسمى الكفاءة الاستراتيجية Strategic.</span>"},
{q:"32. C-test is used to assist which skill?", o:["A. Reading | مهارة القراءة", "B. Writing | مهارة الكتابة", "C. Speaking | مهارة التحدث", "D. Listening | مهارة الاستماع"], c:0, t:"اختبار C-test يُستخدم لتقييم أي مهارة؟", e:"<span class='box-hint'>اختبار C-test (حذف أنصاف الكلمات) يُستخدم لتقييم مهارة القراءة (Reading) والفهم الشامل.</span>"},
{q:"33. Integrative test items have only one set of correct responses and therefore:", o:["A. Could be scored reliably and slowly | تُصحح بموثوقية وبطء", "B. Could be scored reliably and rapidly | يمكن تصحيحها بموثوقية وسرعة عالية", "C. Could be scored unreliably and slowly | تُصحح بلا موثوقية وبطء", "D. Could be scored unreliably and rapidly | تُصحح بلا موثوقية وسرعة"], c:1, t:"الأسئلة التكاملية (الموضوعية) لها مجموعة واحدة من الإجابات الصحيحة، ولذلك:", e:"<span class='box-hint'>لأن الإجابة محددة سلفاً ولا تحتمل التأويل، يمكن تصحيحها آلياً بسرعة عالية وبموثوقية تامة.</span>"},
{q:"34. Co-constructing rubrics with learners allows them to:", o:["A. set the easiest possible standards to achieve high grades | وضع أسهل المعايير", "B. view assessment as an effective educational tool | رؤية التقييم كأداة تعليمية فعالة", "C. feel confident in their language abilities | الشعور بالثقة", "D. feel insurance in their abilities | الشعور بالضمان"], c:1, t:"البناء المشترك لسلالم التقييم (rubrics) مع المتعلمين يتيح لهم:", e:"<span class='box-hint'>إشراك الطلاب في بناء المعايير يجعل التقييم أداة تعليمية فعالة وشفافة ومحفزة.</span>"},
{q:"35. Closed-ended questions are designed:", o:["A. To encourage creativity | لتشجيع الإبداع المفتوح", "B. To discuss arguments | لمناقشة الحجج المعقدة", "C. To ensure objectivity | لضمان الموضوعية والحياد في التقييم", "D. To express opinions | للتعبير عن الآراء الشخصية"], c:2, t:"الأسئلة المغلقة (Closed-ended) مُصممة لـ:", e:"<span class='box-hint'>الأسئلة المغلقة (مثل الاختيار من متعدد) تضمن التقييم الموضوعي والحيادي (Objectivity) لعدم تدخل رأي المصحح.</span>"},
{q:"36. ........ is a grammatical device used in writing and speech to connect ideas by referring back to something previously mentioned. For example, 'The movie had a great plot twist. It really surprised the audience.' The pronoun 'it' is ........", o:["A. cataphoric | إحالة بعدية", "B. inferring | استنتاج", "C. repetition | تكرار", "D. anaphoric | إحالة قبلية"], c:3, t:"أداة نحوية تستخدم لربط الأفكار بالإشارة إلى شيء سبق ذكره. مثال: الضمير 'it' يُعتبر:", e:"<span class='box-hint'>الإحالة القبلية لضمير يعود على عنصر سبق ذكره في النص تسمى (Anaphoric).</span>"},
{q:"37. In a reading class, A teacher divides a reading passages to his students. Students read their assigned section carefully, taking notes, highlighting key points, and preparing to explain it to others.", o:["A. gamification | التلعيب", "B. word puzzle | لغز كلمات", "C. jigsaw | استراتيجية الجيجسو (التعلم التعاوني المقسم)", "D. brainstorming | عصف ذهني"], c:2, t:"يقسم المعلم القطع على الطلاب ليقرأ كل منهم جزءاً ثم يشرحه للآخرين. تسمى:", e:"<span class='box-hint'>نشاط التعلم التعاوني المقسم لفرق عمل تكمل بعضها البعض يسمى Jigsaw.</span>"},
{q:"38. A teacher asks his students to write in Microsoft Word and to make sure their word spelling is correct. Which tool do they need?", o:["A. word count | عد الكلمات", "B. translate | ترجمة", "C. thesaurus | قاموس مرادفات", "D. spelling checker | المدقق الإملائي"], c:3, t:"أداة مايكروسوفت وورد المستخدمة للتحقق من الإملاء وتصحيح الكلمات هي:", e:"<span class='box-hint'>أداة التصحيح الإملائي التي تنبهك للأخطاء تسمى Spelling checker.</span>"},
{q:"39. This activity combines practicing your L2 (second language) with fun and entertainment:", o:["A. discussion | نقاش جاد", "B. problem-solving | حل المشكلات", "C. debate | مناظرة", "D. role playing | لعب الأدوار (التمثيل)"], c:3, t:"النشاط الذي يجمع بين ممارسة اللغة الشفهية والمرح والتسلية هو:", e:"<span class='box-hint'>لعب الأدوار (Role playing) يحاكي مواقف حقيقية ممتعة وتفاعلية تكسر الجليد بالفصل.</span>"},
{q:"40. Dementia is a general term that represents a group of diseases and illnesses that affect your thinking, memory, reasoning, personality, mood and behavior. The decline in mental function interferes with your daily life and activities. It's estimated that about 50% of people age 85 and older have dementia. Current medications may help slow the mental decline. What do you think the next paragraph will be about? this question is about which strategies?", o:["A. anticipating | التوقع والتنبؤ", "B. comprehension | الفهم", "C. scanning | المسح السريع", "D. skimming | التصفح السريع"], c:0, t:"سؤال 'عما تعتقد أن الفقرة التالية ستتحدث عنه؟' يمثل استراتيجية:", e:"<span class='box-hint'>سؤال الطالب عن توقعاته للأحداث أو المواضيع القادمة بالنص يسمى التوقع أو التنبؤ (Anticipating/Predicting).</span>"},
{q:"41. The difference between Arabic and English is that the Arabic language is additive, generalization-oriented, repetitive, while English is non-additive, text-based, and specific.", o:["A. grammar | القواعد النحوية", "B. cohesion | التماسك والترابط النصي", "C. morphology | علم الصرف", "D. Orthography | الإملاء"], c:1, t:"الفرق بين العربية والإنجليزية في الميل للتعميم والتكرار مقابل المباشرة يتعلق بـ:", e:"<span class='box-hint'>الاختلاف في أسلوب تنظيم الأفكار وربطها (الروابط الإضافية والتكرار) يمثل الاختلاف في التماسك (Cohesion).</span>"},
{q:"42. Students failed in pronouncing of these sounds /f/ and /v/ due to", o:["A. negative transfer | النقل السلبي (التداخل اللغوي للغة الأم)", "B. positive transfer | النقل الإيجابي", "C. overgeneralization | التعميم المفرط", "D. error avoidance | تجنب الأخطاء"], c:0, t:"فشل الطلاب في نطق الصوتين /f/ و /v/ يُعزى إلى ........", e:"<span class='box-hint'>عدم وجود أصوات معينة في لغة الأم يسبب تدخلاً ونقلاً سلبياً (Negative transfer) يعيق نطق اللغة الثانية.</span>"},

let synth = window.speechSynthesis, isExam = false, tooltip = document.getElementById('word-tooltip');

function formatInteractive(text) {
    return text.split(/([a-zA-Z0-9'-]+)/).map(tok => {
        if(/^[a-zA-Z0-9'-]+$/.test(tok)) {
            let clean = tok.toLowerCase();
            return `<b class="w-int" onclick="spk(this, event, '${clean}')">${tok}</b>`;
        }
        return tok;
    }).join('');
}

window.spk = function(el, ev, word) {
    ev.stopPropagation();
    if(!synth) return;
    synth.cancel();
    document.querySelectorAll('.w-int.active-speak').forEach(e => e.classList.remove('active-speak'));
    el.classList.add('active-speak');
    tooltip.textContent = dict[word] || "معنى سياقي";
    let rect = el.getBoundingClientRect();
    tooltip.style.left = (rect.left + window.scrollX) + 'px';
    tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
    tooltip.style.display = 'block';
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
        el.classList.remove('active-speak');
        setTimeout(() => { tooltip.style.display = 'none'; }, 1200);
    };
    synth.speak(u);
};

function build() {
    let cont = document.getElementById('q-container'); cont.innerHTML = '';
    db.forEach((qObj, idx) => {
        let row = document.createElement('div');
        row.className = 'question-row';
        row.setAttribute('data-ans', qObj.c);
        row.setAttribute('data-orig', idx);
        let opts = qObj.o.map((opt, i) => {
            let p = opt.split('|');
            return `<div class="opt-item" data-i="${i}" onclick="sel(this, event)"><div class="choice-badge">${["A","B","C","D"][i]}</div><div class="choice-content"><div class="choice-en" dir="ltr">${formatInteractive(p[0].trim())}</div>${p[1]?`<div class="choice-ar" dir="rtl">${p[1].trim()}</div>`:''}</div></div>`;
        }).join('');
        row.innerHTML = `<div class="q-text-container"><div class="q-number-lbl">${idx + 1}. </div><div class="q-text" dir="ltr">${formatInteractive(qObj.q.replace(/^\d+\.\s*/, ''))}</div></div>${qObj.t?`<div class="full-sentence-translation">📝 ${qObj.t}</div>`:''}<div class="options-inline">${opts}</div><button class="btn-answer" onclick="rev(this)">👁️ إظهار الشرح والمفاتيح</button><div class="answer-box"><div class="grammar-explanation">${qObj.e}</div></div>`;
        cont.appendChild(row);
    });
}

window.sel = function(optItem, event) {
    if(event.target.classList.contains('w-int')) return;
    let row = optItem.closest('.question-row');
    if(row.classList.contains('answered')) return; 
    let correctIndex = row.getAttribute('data-ans');
    let selectedIndex = optItem.getAttribute('data-i');
    row.classList.add('answered'); optItem.classList.add('selected');
    row.querySelectorAll('.opt-item').forEach(item => { if (item.getAttribute('data-i') === correctIndex) item.classList.add('correct'); });
    if (selectedIndex !== correctIndex) optItem.classList.add('wrong');
    if (!isExam) { let btn = row.querySelector('.btn-answer'); if (btn) btn.click(); }
};

window.rev = function(btn) {
    let box = btn.nextElementSibling;
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; btn.innerHTML = '🙈 إخفاء الشرح والمفاتيح'; } 
    else { box.style.display = 'none'; btn.innerHTML = '👁️ إظهار الشرح والمفاتيح'; }
};

window.setMode = function(m) {
    isExam = (m === 'exam');
    let c = document.getElementById('q-container');
    document.getElementById('btn-study').className = `mode-btn btn-study ${!isExam?'active-mode':''}`;
    document.getElementById('btn-exam').className = `mode-btn btn-exam ${isExam?'active-mode':''}`;
    document.getElementById('btn-result').style.display = isExam ? 'block' : 'none';
    document.getElementById('res-box').style.display = 'none';
    c.className = isExam ? 'questions-container exam-mode' : 'questions-container train-mode';
    if(synth) synth.cancel(); tooltip.style.display = 'none';
    
    let rows = Array.from(c.querySelectorAll('.question-row'));
    rows.forEach(r => {
        r.classList.remove('answered');
        r.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected','correct','wrong'));
        r.querySelector('.answer-box').style.display = 'none';
        r.querySelector('.btn-answer').innerHTML = '👁️ إظهار الشرح والمفاتيح';
    });

    if(isExam) {
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort(() => Math.random() - 0.5).forEach(o => optsCont.appendChild(o));
        });
        rows.sort(() => Math.random() - 0.5).forEach(r => c.appendChild(r));
    } else {
        rows.sort((a,b) => a.getAttribute('data-orig') - b.getAttribute('data-orig'));
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort((a,b) => a.getAttribute('data-i') - b.getAttribute('data-i')).forEach(o => optsCont.appendChild(o));
            c.appendChild(r);
        });
    }
};

window.showResult = function() {
    let rows = document.querySelectorAll('.question-row'), corr = 0, ans = 0;
    rows.forEach(r => { let s = r.querySelector('.opt-item.selected'); if(s) { ans++; if(s.classList.contains('correct')) corr++; } });
    let res = document.getElementById('res-box');
    res.innerHTML = ans < rows.length ? `⚠️ أجبت على ${ans} من ${rows.length}.<br> نتيجتك: ${corr} / ${rows.length}` : `النتيجة النهائية: ${corr} / ${rows.length}<br>🏆 ممتاز يا أستاذ حمادة!`;
    res.style.display = "block"; window.scrollTo({ top: res.offsetTop - 100, behavior: 'smooth' });
};

document.addEventListener('click', e => { if(!e.target.classList.contains('w-int')) { tooltip.style.display = 'none'; if(document.querySelector('.w-int.active-speak')) document.querySelector('.w-int.active-speak').classList.remove('active-speak'); } });
build();
})();
</script>
