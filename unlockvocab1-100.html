        .word {

            display: inline-block; 
            cursor: pointer; 
            margin: 0 2px;
        }
        .word-ar { 
            display: none; 
            position: absolute; 
            bottom: 110%; 
            left: 50%; 
            transform: translateX(-50%); 
            background: transparent !important; 
            color: #dc2626; 
            border: none !important; 
            font-size: 0.85em; 
            font-weight: 900; 
            white-space: nowrap; 
            pointer-events: none; 
            direction: rtl;
            z-index: 100;

        .word-en {

            border-radius: 4px; 
            padding: 0 2px;

        body.test-mode-active { background: linear-gradient(135deg, #fef2f2, #fee2e2); }

        /* شلل التتبع والترجمة الفردية للكلمات */
        body.test-mode-active .word { pointer-events: none !important; cursor: default !important; }
        body.test-mode-active .word-ar { display: none !important; }
        body.test-mode-active .phrasal .word-en { border-bottom: none !important; }
        body.test-mode-active .options-list { margin-left: 15px; }

// ==========================================
// توليد التبويبات والأسئلة
// ==========================================
function renderQuestions() {
    const tabsContainer = document.getElementById('tabs-buttons');
    const contentsContainer = document.getElementById('tabs-contents');
    
    let htmlTabs = '';
    let htmlContents = '';
    
    const chunkSize = 20; 
    const chunks = [];
    for (let i = 0; i < questionsData.length; i += chunkSize) {
        chunks.push(questionsData.slice(i, i + chunkSize));
    }
    
    const letters = ['A', 'B', 'C', 'D'];

    chunks.forEach((chunk, chunkIndex) => {
        const tabId = `tab${chunkIndex}`;
        const isActive = chunkIndex === 0 ? 'active' : '';
        
        htmlTabs += `<button class="tab-btn ${isActive}" onclick="openTab(event, '${tabId}')">المجموعة ${chunkIndex + 1}</button>`;
        
        htmlContents += `
        <div id="${tabId}" class="tab-content ${isActive}">
            <div class="group-control-bar">
                <button class="control-action-btn" onclick="showSectionResult('container${chunkIndex}', 'res${chunkIndex}')">📋 عرض النتيجة</button>
                <span class="section-result" id="res${chunkIndex}"></span>
                <button class="reset-shuffle-btn" onclick="resetAndShuffle('container${chunkIndex}', 'res${chunkIndex}')">🔄 تصفير وخلط المجموعة</button>
            </div>
            <div class="questions-container" id="container${chunkIndex}">
        `;
        
        chunk.forEach((qItem, idx) => {
            let globalNum = (chunkIndex * chunkSize) + idx + 1;
            htmlContents += `<div class="question-row" data-ans="${qItem.ans}">`;
            
            htmlContents += `
                <div class="q-header-wrapper">
                    <button class="read-row-btn" onclick="readRowAloud(this)">🔊</button>
                    <div class="q-text-container">
                        <div class="q-text">
                            <span class="q-number">${globalNum}- </span><span class="q-content">${qItem.q}</span>
                        </div>
                        <div class="q-translation" dir="rtl">${qItem.ar}</div>
                    </div>
                </div>
            `;

            htmlContents += `<div class="options-list">`;
            
            let shuffledOpts = [...qItem.opts];
            shuffledOpts.sort(() => Math.random() - 0.5);
            
            shuffledOpts.forEach((opt, oIdx) => {
                htmlContents += `
                    <div class="opt-item" onclick="selectOption(this)">
                        <div class="choice-badge">${letters[oIdx]}</div>
                        <div class="choice-text">${opt}</div>
                    </div>
                `;
            });
            htmlContents += `</div></div>`;
        });
        
        htmlContents += `</div></div>`;
    });

    tabsContainer.innerHTML = htmlTabs;
    contentsContainer.innerHTML = htmlContents;
}

function toggleTestMode() {
    const body = document.body;
    const btn = document.getElementById('testModeBtn');
    const helpText = document.getElementById('help-text');
    
    body.classList.toggle('test-mode-active');
    
    if (body.classList.contains('test-mode-active')) {
        btn.innerHTML = '🛑 إنهاء وضع الاختبار (تشغيل المساعدات)';
        btn.classList.add('active');
        helpText.innerHTML = '⚠️ وضع الاختبار مفعل: المساعدات الصوتية والترجمة مغلقة تماماً.';
        helpText.style.color = '#dc2626';
        if(window.speechSynthesis) window.speechSynthesis.cancel(); 
        document.querySelectorAll('.active-word, .active-word-manual').forEach(el => el.classList.remove('active-word', 'active-word-manual'));
    } else {
        btn.innerHTML = '🎯 تفعيل وضع الاختبار (إيقاف المساعدات)';

        helpText.innerHTML = '💡 المساعدات مفعلة: الترجمة متاحة أسفل السؤال، ويمكنك الضغط على (🔊) للإملاء، أو النقر على أي كلمة لترجمتها ونطقها.';
        helpText.style.color = '#475569';
    }

function openTab(evt, tabId) {
    if(window.speechSynthesis) window.speechSynthesis.cancel();
    document.querySelectorAll('.word.active-word-manual, .word.active-word').forEach(n => n.classList.remove('active-word-manual', 'active-word'));
    
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    evt.currentTarget.classList.add('active');
}

// ==========================================
// المترجم الذكي 
// ==========================================
function initializeTranslator() {
    const phrasalKeys = Object.keys(multiWordPhrases).sort((a,b) => b.length - a.length);
    const phrasalRegex = new RegExp('\\b(' + phrasalKeys.join('|') + ')\\b', 'gi');

    document.querySelectorAll('.q-content, .choice-text').forEach(wrapper => {
        if (wrapper.querySelector('.word')) return;
        const walker = document.createTreeWalker(wrapper, NodeFilter.SHOW_TEXT, null, false);
        const textNodes = [];
        let node;
        while (node = walker.nextNode()) {
            if (node.parentNode.tagName !== 'SCRIPT' && !node.parentNode.classList.contains('word-en') && !node.parentNode.classList.contains('word-ar')) {
                textNodes.push(node);
            }
        }
        textNodes.forEach(textNode => {
            const text = textNode.nodeValue;
            if (!text.trim()) return; 

            let parts = [];
            let lastIndex = 0;
            
            text.replace(phrasalRegex, (match, p1, offset) => {
                if (offset > lastIndex) parts.push({text: text.slice(lastIndex, offset), isPhrasal: false});
                parts.push({text: match, isPhrasal: true});
                lastIndex = offset + match.length;
            });
            if (lastIndex < text.length) parts.push({text: text.slice(lastIndex), isPhrasal: false});

            const fragment = document.createDocumentFragment();

            parts.forEach(p => {
                if (p.isPhrasal) {
                    let cleanWord = p.text.toLowerCase();
                    let span = document.createElement('span');
                    span.className = 'word phrasal';
                    span.innerHTML = `<span class="word-ar">${multiWordPhrases[cleanWord]}</span><span class="word-en">${p.text}</span>`;
                    fragment.appendChild(span);
                } else {
                    let subParts = p.text.split(/([a-zA-Z0-9\-']+)/);
                    subParts.forEach(sp => {
                        const cleanWord = sp.toLowerCase().replace(/[^a-z0-9]/g, '');
                        if (cleanWord) { 
                            let span = document.createElement('span');
                            span.className = 'word';
                            let arText = wordDictionary[cleanWord] || "";
                            if(arText) span.innerHTML = `<span class="word-ar">${arText}</span><span class="word-en">${sp}</span>`;
                            else span.innerHTML = `<span class="word-en">${sp}</span>`;
                            fragment.appendChild(span);
                        } else {
                            fragment.appendChild(document.createTextNode(sp));
                        }
                    });
                }
            });
            if(textNode.parentNode) textNode.parentNode.replaceChild(fragment, textNode);
        });
    });
}

// ==========================================
// التصحيح والخلط الذكي
// ==========================================
function selectOption(optItem) {
    let row = optItem.closest('.question-row');
    row.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected'));
    optItem.classList.add('selected');
}

function showSectionResult(containerId, resId) {
    let container = document.getElementById(containerId);
    let rows = container.querySelectorAll('.question-row');
    let correctCount = 0;
    let totalCount = rows.length;

    rows.forEach(row => {
        let targetAns = row.getAttribute('data-ans').replace(/[\u200B-\u200D\uFEFF]/g, '').trim().toLowerCase();
        let selectedItem = row.querySelector('.opt-item.selected');
        let items = row.querySelectorAll('.opt-item');

        items.forEach(item => {
            item.classList.remove('correct', 'wrong');
            let textEl = item.querySelector('.choice-text');
            let enSpans = textEl.querySelectorAll('.word-en');
            let cleanText = enSpans.length > 0 ? Array.from(enSpans).map(sp => sp.textContent).join(" ") : textEl.textContent;
            if (cleanText.trim().toLowerCase() === targetAns) item.classList.add('correct');
        });

        if (selectedItem) {
            let textEl = selectedItem.querySelector('.choice-text');
            let enSpans = textEl.querySelectorAll('.word-en');
            let cleanText = enSpans.length > 0 ? Array.from(enSpans).map(sp => sp.textContent).join(" ") : textEl.textContent;
            if (cleanText.trim().toLowerCase() === targetAns) correctCount++;
            else selectedItem.classList.add('wrong');
        }
    });
    document.getElementById(resId).textContent = `النتيجة: ${correctCount} / ${totalCount}`;
}

function resetAndShuffle(containerId, resId) {
    let container = document.getElementById(containerId);
    document.getElementById(resId).textContent = '';
    
    let rows = Array.from(container.querySelectorAll('.question-row'));

    rows.forEach(row => {
        row.querySelectorAll('.opt-item').forEach(item => item.classList.remove('selected', 'correct', 'wrong'));
        let optContainer = row.querySelector('.options-list');
        if(optContainer) {
            let opts = Array.from(optContainer.querySelectorAll('.opt-item'));
            const letters = ["A", "B", "C", "D"];
            opts.sort(() => Math.random() - 0.5); 
            opts.forEach((opt, idx) => {
                opt.querySelector('.choice-badge').textContent = letters[idx];
                optContainer.appendChild(opt);
            });
        }
    });

    rows.sort(() => Math.random() - 0.5); 
    
    let tabIndex = parseInt(containerId.replace('container', ''));
    let chunkSize = 20;
    
    rows.forEach((row, idx) => {
        container.appendChild(row); 
        let numSpan = row.querySelector('.q-number');
        if(numSpan) {
            let currentNum = (tabIndex * chunkSize) + idx + 1;
            numSpan.textContent = currentNum + "- ";
        }
    });
}

// ==========================================
// خوارزمية الإملاء المباشر (تجاهل الترجمة السفلية)
// ==========================================
let currentUtterance = null;

function readRowAloud(btn) {
    if (document.body.classList.contains('test-mode-active')) return;

    if(window.speechSynthesis) window.speechSynthesis.cancel();
    document.querySelectorAll('.active-word').forEach(n => n.classList.remove('active-word'));
    
    let container = btn.closest('.question-row');
    let blocksToRead = [];
    
    // سحب الإنجليزي فقط وتجاهل الترجمة السفلية
    blocksToRead.push(container.querySelector('.q-content'));
    container.querySelectorAll('.opt-item').forEach(opt => blocksToRead.push(opt));

    let wordsQueue = [];

    blocksToRead.forEach(block => {
        if(!block) return;
        let words = Array.from(block.querySelectorAll('.word'));
        words.forEach(w => {
            let enNode = w.querySelector('.word-en');
            let text = enNode ? enNode.textContent.trim() : w.textContent.trim();
            if(text) {
                let cleanText = text.replace(/[\.\,\?\_]/g, '');
                if(cleanText.length > 0) {
                    wordsQueue.push({ el: w, text: cleanText });
                }
            }
        });
        wordsQueue.push({ el: null, text: "pause" });
    });

    let currentWordIndex = 0;

    function playNextWord() {
        if (currentWordIndex >= wordsQueue.length) {
            document.querySelectorAll('.active-word').forEach(n => n.classList.remove('active-word'));
            return;
        }

        let currentItem = wordsQueue[currentWordIndex];

        if (currentItem.text === "pause") {
            currentWordIndex++;
            setTimeout(playNextWord, 400); 
            return;
        }

        document.querySelectorAll('.active-word').forEach(n => n.classList.remove('active-word'));
        currentItem.el.classList.add('active-word');

        currentUtterance = new SpeechSynthesisUtterance(currentItem.text);
        currentUtterance.lang = 'en-US';
        currentUtterance.rate = 0.60; 

        currentUtterance.onend = function() {
            currentWordIndex++;
            setTimeout(playNextWord, 50);
        };

        currentUtterance.onerror = function() {
            currentWordIndex++;
            playNextWord();
        };

        window.speechSynthesis.speak(currentUtterance);
    }

    playNextWord();
}

// ==========================================
// النطق الفردي وإظهار الترجمة الحرة
// ==========================================
document.addEventListener('click', function(e) {
    if (document.body.classList.contains('test-mode-active')) return;

    const wordContainer = e.target.closest('.word');
    if (wordContainer) {
        e.stopPropagation(); 
        
        if(window.speechSynthesis) window.speechSynthesis.cancel();
        
        document.querySelectorAll('.word.active-word-manual, .word.active-word').forEach(w => w.classList.remove('active-word-manual', 'active-word'));
        wordContainer.classList.add('active-word-manual'); 
        
        const enTextElement = wordContainer.querySelector('.word-en');
        const textToSpeak = enTextElement ? enTextElement.textContent : wordContainer.textContent;
        
        let utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'en-US';
        utterance.rate = 0.7; 
        utterance.onend = () => wordContainer.classList.remove('active-word-manual');
        window.speechSynthesis.speak(utterance);
        
        setTimeout(() => wordContainer.classList.remove('active-word-manual'), 3000);
    } else {
        document.querySelectorAll('.word.active-word-manual').forEach(w => w.classList.remove('active-word-manual'));
    }
});

// التشغيل الأساسي
document.addEventListener("DOMContentLoaded", function() {
    renderQuestions();
    initializeTranslator();
});
