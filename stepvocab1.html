<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تدريب مفردات STEP - إعداد الأستاذ حمادة الديب</title>
    <style>
        :root {
            --primary: #1E3A8A; 
            --secondary: #3B82F6; 
            --success: #059669; 
            --danger: #DC2626; 
            --bg-color: #F1F5F9;
            --card-bg: #FFFFFF;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
        }

        .credits {
            font-size: 13px;
            color: #DBEAFE;
            margin-bottom: 15px;
        }

        .btn-list {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn-list:hover { background: rgba(255, 255, 255, 0.3); }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F8FAFC;
            padding: 10px 20px;
            border-bottom: 1px solid #E2E8F0;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-muted);
        }

        .progress-wrapper {
            flex-grow: 1;
            margin: 0 15px;
            background: #E2E8F0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .score-badge {
            background: var(--success);
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
        }

        .game-area {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .english-word {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px; 
            direction: ltr;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            padding: 10px 30px;
            border-radius: 12px;
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
        }

        .audio-icon {
            font-size: 24px;
            color: var(--secondary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; }
        }

        .example-sentence {
            font-size: 19px;
            color: #334155;
            margin-bottom: 25px;
            text-align: left;
            direction: ltr;
            background: #F1F5F9;
            padding: 12px 20px;
            border-radius: 8px;
            width: 90%;
            box-sizing: border-box;
            border: 1px solid #E2E8F0;
            border-left: 5px solid var(--secondary);
        }

        .highlight-word {
            color: var(--danger);
            font-weight: bold;
            text-decoration: underline;
        }

        .options-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid #CBD5E1;
            padding: 14px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--secondary);
            background: #EFF6FF;
        }

        .option-correct {
            background: #ECFDF5 !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
        }

        .option-wrong {
            background: #FEF2F2 !important;
            border-color: var(--danger) !important;
            color: var(--danger) !important;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
        }

        .controls button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            background: var(--secondary);
            color: white;
        }

        .controls button:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #E2E8F0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-header h2 { margin: 0; color: var(--primary); font-size: 18px; }

        .close-modal {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            cursor: pointer;
        }

        .word-list-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #F1F5F9;
            font-size: 15px;
        }
        .word-list-item:nth-child(even) { background: #F8FAFC; }
        .word-en { font-weight: bold; color: var(--primary); direction: ltr; }
    </style>
</head>
<body>

    <div id="wordsModal" class="modal-overlay">

                <h2>قائمة مفردات STEP (100 كلمة)</h2>
                <button class="close-modal" onclick="toggleModal()">إغلاق ✖</button>
            </div>
            <div id="wordsListContainer"></div>
        </div>
    </div>

    <div class="app-container">
        <div class="header">

            <h1>اختبار كفايات الإنجليزية (STEP)</h1>
            <div class="credits">

            </div>
        </div>

        <div class="stats-bar">
            <span id="wordCounter">1 / 100</span>
            <div class="progress-wrapper">

            </div>
            <span class="score-badge">النقاط: <span id="scoreDisplay">0</span></span>
        </div>

        <div class="game-area">
            <div id="englishWord" class="english-word" onclick="restartLoop()" title="اضغط لإعادة النطق الآن">
                <span id="theWordText">Word</span>

            <div id="exampleSentence" class="example-sentence" onclick="restartLoop()">

        <div class="controls">
            <button class="btn-next" onclick="nextWord()">التالي &laquo;</button>
            <button class="btn-prev" onclick="prevWord()">السابق &raquo;</button>
        </div>
    </div>

        let currentIndex = 0;
        let currentItem = null;
        let synth = window.speechSynthesis;
        let canPlay = true;
        let score = 0;
        let isLooping = false;
        let loopTimeout = null;

        function buildWordList() {
            const container = document.getElementById('wordsListContainer');
            stepVocabulary.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'word-list-item';
                div.innerHTML = `
                    <span><span style="color:#94A3B8; margin-left:8px;">${index + 1}-</span> ${item.ar}</span>
                    <span class="word-en">${item.en}</span>
                `;
                container.appendChild(div);
            });
        }

        function toggleModal() {
            const modal = document.getElementById('wordsModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function initGame() {
            stopAudioLoop();
            canPlay = true;
            currentItem = stepVocabulary[currentIndex];
            
            document.getElementById('theWordText').innerText = currentItem.en.toLowerCase();
            document.getElementById('theSentenceText').innerHTML = currentItem.ex; 
            document.getElementById('wordCounter').innerText = `${currentIndex + 1} / ${stepVocabulary.length}`;
            
            const progressPercent = ((currentIndex + 1) / stepVocabulary.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
            
            generateOptions();
            
            // بدء التكرار الصوتي المستمر
            isLooping = true;
            setTimeout(playAudioSequence, 300);
        }

        function generateOptions() {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            let options = [currentItem];
            let wrongOptionsPool = stepVocabulary.filter(v => v.en !== currentItem.en);
            
            wrongOptionsPool.sort(() => 0.5 - Math.random());
            options.push(wrongOptionsPool[0], wrongOptionsPool[1]);

            options.sort(() => 0.5 - Math.random());

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.ar;
                btn.onclick = () => checkAnswer(btn, opt.ar);
                container.appendChild(btn);
            });
        }

        function checkAnswer(btnElement, selectedAr) {
            if (!canPlay) return;

            if (selectedAr === currentItem.ar) {
                canPlay = false; // يمنع النقر مرة أخرى، لكن التكرار الصوتي سيستمر
                btnElement.classList.add('option-correct');
                
                score += 10;
                document.getElementById('scoreDisplay').innerText = score;
                // تم إلغاء النقل التلقائي! التكرار سيستمر حتى يضغط الطالب "التالي"
            } else {
                btnElement.classList.add('option-wrong');
                setTimeout(() => btnElement.classList.remove('option-wrong'), 400);
                if(score > 0) {
                    score -= 5;
                    document.getElementById('scoreDisplay').innerText = score;
                }
            }
        }

        // دالة التكرار (تقرأ الكلمة ثم الجملة، ثم تعيد)
        function playAudioSequence() {
            if (!isLooping || !currentItem) return;
            synth.cancel();

            let wordUtterance = new SpeechSynthesisUtterance(currentItem.en);
            let cleanText = currentItem.ex.replace(/<[^>]*>?/gm, '');
            let sentenceUtterance = new SpeechSynthesisUtterance(cleanText);

            wordUtterance.lang = 'en-US';
            sentenceUtterance.lang = 'en-US';
            
            wordUtterance.rate = 0.9;
            sentenceUtterance.rate = 0.85;

            // عندما تنتهي الجملة، انتظر ثانية ونصف ثم كرر
            sentenceUtterance.onend = function() {
                if (isLooping) {
                    loopTimeout = setTimeout(playAudioSequence, 1500); 
                }
            };

            synth.speak(wordUtterance);
            synth.speak(sentenceUtterance);
        }

        function stopAudioLoop() {
            isLooping = false;
            clearTimeout(loopTimeout);
            synth.cancel();
        }

        function restartLoop() {
            stopAudioLoop();
            isLooping = true;
            playAudioSequence();
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex >= stepVocabulary.length) {
                alert(`أكملت التدريب بنجاح! مجموع نقاطك: ${score}`);
                currentIndex = 0;
                score = 0;
                document.getElementById('scoreDisplay').innerText = score;
            }
            initGame(); // initGame ستقوم بإيقاف الصوت القديم وتبدأ الجديد تلقائياً
        }

        function prevWord() {
            currentIndex--;
            if (currentIndex < 0) currentIndex = stepVocabulary.length - 1;
            initGame();
        }

        window.onload = () => {
            buildWordList();
            initGame();
        };
    </script>
</body>
</html>
