        let currentIndex = 0;
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let isAutoMode = false;

        function startApp() {
            document.getElementById('startScreen').style.display = 'none';
            loadQuestion();
        }

        function getPreferredVoice() {
            const voices = synth.getVoices();
            return voices.find(v => v.lang === 'en-US' && /male|david|mark|alex|google us/i.test(v.name)) ||
                   voices.find(v => v.lang === 'en-US') ||
                   voices[0];
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function selectUnit(unitNumber) {
            const foundIndex = quizData.findIndex(item => item[0] === unitNumber);
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                loadQuestion();
            }
        }

        function updateUnitTabs(activeUnit) {
            [1, 2, 3].forEach(u => {
                const tab = document.getElementById(`tab-${u}`);
                if (u === activeUnit) tab.classList.add('active');
                else tab.classList.remove('active');
            });
        }

        function highlightTargetInSentence(sentence, word) {
            const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            let regex = new RegExp(`(${escaped}\\w*)`, 'gi');
            if (regex.test(sentence)) {
                return sentence.replace(regex, '<span class="word-in-sentence">$1</span>');
            }
            const firstPart = word.split(' ')[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const fallbackRegex = new RegExp(`(${firstPart}\\w*)`, 'i');
            return sentence.replace(fallbackRegex, '<span class="word-in-sentence">$1</span>');
        }

        function formatArabicWithBlank(arSentence) {
            return arSentence.replace('______', '<span class="ar-blank">______</span>');
        }

        function revealArabicBlank(arSentence, correctAr) {
            return arSentence.replace('______', `<span class="ar-filled">${correctAr}</span>`);
        }

        function toggleMode() {
            isAutoMode = !isAutoMode;
            const btn = document.getElementById('modeBtn');
            if (isAutoMode) {
                btn.innerHTML = 'الانتقال: تلقائي ⚡';
                btn.classList.add('auto-mode');
            } else {
                btn.innerHTML = 'الانتقال: يدوي ✋';
                btn.classList.remove('auto-mode');
            }
        }

        function loadQuestion() {
            synth.cancel();
            isSpeaking = false;

            const targetEl = document.getElementById('targetWord');
            const sentenceBox = document.getElementById('sentenceBox');
            targetEl.classList.remove('highlight-yellow');
            sentenceBox.classList.remove('highlight-yellow');

            const q = quizData[currentIndex];
            const unitNum = q[0];
            const cat = q[1];
            const enWord = q[2];
            const fullSentence = q[3];
            const arSentence = q[4];
            const correctAr = q[5];

            updateUnitTabs(unitNum);
            const unitStartIndex = quizData.findIndex(item => item[0] === unitNum);
            const indexInUnit = currentIndex - unitStartIndex + 1;

            document.getElementById('catBadge').innerText = cat;
            document.getElementById('wordCounter').innerText = `${indexInUnit} / 100`;
            document.getElementById('totalCounter').innerText = `${currentIndex + 1} / ${quizData.length}`;

            targetEl.innerText = enWord;
            sentenceBox.innerHTML = highlightTargetInSentence(fullSentence, enWord);
            document.getElementById('sentenceArBox').innerHTML = formatArabicWithBlank(arSentence);

            let options = shuffleArray([correctAr, q[6], q[7]]);
            const optionsBox = document.getElementById('optionsContainer');
            optionsBox.innerHTML = '';

            options.forEach(optionText => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(btn, optionText, correctAr, arSentence);
                optionsBox.appendChild(btn);
            });

            setTimeout(() => { playWordAndSentence(); }, 250);
        }

        function playWordAndSentence() {
            if (isSpeaking) synth.cancel();
            isSpeaking = true;

            const q = quizData[currentIndex];
            const enWord = q[2];
            const fullSentence = q[3];
            const targetEl = document.getElementById('targetWord');
            const sentenceBox = document.getElementById('sentenceBox');
            const voice = getPreferredVoice();

            let wordUtt = new SpeechSynthesisUtterance(enWord);
            wordUtt.lang = 'en-US';
            wordUtt.rate = 0.9;
            if (voice) wordUtt.voice = voice;

            let sentUtt = new SpeechSynthesisUtterance(fullSentence);
            sentUtt.lang = 'en-US';
            sentUtt.rate = 0.85;
            if (voice) sentUtt.voice = voice;

            wordUtt.onstart = () => {
                targetEl.classList.add('highlight-yellow');
                sentenceBox.classList.remove('highlight-yellow');
            };
            wordUtt.onend = () => {
                targetEl.classList.remove('highlight-yellow');
                synth.speak(sentUtt);
            };
            sentUtt.onstart = () => {
                sentenceBox.classList.add('highlight-yellow');
            };
            sentUtt.onend = () => {
                sentenceBox.classList.remove('highlight-yellow');
                isSpeaking = false;
            };

            synth.speak(wordUtt);
        }

        function checkAnswer(btn, selected, correct, arSentence) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.classList.add('option-disabled'));

            // إظهار المعنى الصحيح داخل الفراغ في الجملة العربية بعد الإجابة
            document.getElementById('sentenceArBox').innerHTML = revealArabicBlank(arSentence, correct);

            if (selected === correct) {
                btn.classList.add('option-correct');
                fireConfetti();
                if (isAutoMode) setTimeout(() => { nextWord(); }, 1800);
            } else {
                btn.classList.add('option-wrong');
                allBtns.forEach(b => {
                    if (b.innerText === correct) b.classList.add('option-correct');
                });
                if (isAutoMode) setTimeout(() => { nextWord(); }, 2800);
            }
        }

        function fireConfetti() {
            const container = document.getElementById('confetti-container');
            container.innerHTML = '';
            const emojis = ['⭐', '🎉', '🏆', '✨'];
            for (let i = 0; i < 30; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                piece.style.fontSize = Math.random() * 20 + 20 + 'px';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.top = -50 + 'px';
                piece.style.animation = `fall ${Math.random() * 2.5 + 1.5}s linear forwards`;
                container.appendChild(piece);
            }
        }

        function nextWord() {
            currentIndex++;
            if (currentIndex >= quizData.length) currentIndex = 0;
            loadQuestion();
        }

        function prevWord() {
            currentIndex--;
            if (currentIndex < 0) currentIndex = quizData.length - 1;
            loadQuestion();
        }
    </script>
