                sentences: [

            },
            {
                title: "المجموعة العاشرة",
                sentences: [
                    { en: "They travel and meet people.", ar: "هم يسافرون ويلتقون بالناس." },
                    { en: "What are the similarities and the differences?", ar: "ما هي أوجه التشابه والاختلاف؟" },
                    { en: "Teens seldom buy things online.", ar: "المراهقون نادراً ما يشترون الأشياء عبر الإنترنت." },
                    { en: "I don't know how to cook.", ar: "أنا لا أعرف كيف أطبخ." },
                    { en: "She studies French three times a week.", ar: "هي تدرس الفرنسية ثلاث مرات في الأسبوع." },
                    { en: "He knows how to climb very well.", ar: "هو يعرف كيف يتسلق جيداً جداً." },
                    { en: "I fly model airplanes.", ar: "أنا أطير طائرات نموذجية." },
                    { en: "People control the movement through radio signals.", ar: "يتحكم الناس في الحركة عبر إشارات الراديو." },
                    { en: "Fliers do maneuvers in the air.", ar: "الطيارون يقومون بمناورات في الهواء." },
                    { en: "I spend my free time working out at the gym.", ar: "أنا أقضي وقت فراغي في التمرن في الصالة الرياضية." }
                ]
            }
        ];

        function renderClickableHtml(text) {
            let pairs = text.split(' ').map(p => p.trim()).filter(p => p !== '');
            return pairs.map(pair => {
                let cleanW = pair.replace(/[^a-zA-Z0-9'-]/g, '');
                let arW = getTranslation(cleanW);
                let safeWord = cleanW.replace(/"/g, '&quot;').replace(/'/g, '&apos;');
                let arHtml = arW !== "" ? `<span class="ar">${arW}</span>` : `<span class="ar" style="display:none;"></span>`;
                return `<span class="word-group" data-speak="${safeWord}">${arHtml}<span class="en">${pair}</span></span>`;
            }).join(' ');
        }

        function buildApp() {
            let container = document.getElementById('content-container');
            container.innerHTML = '';

            groupsData.forEach((group, gIdx) => {
                let section = document.createElement('div');
                section.className = 'group-section';
                section.id = `group-${gIdx}`;
                
                let header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML = `<h2 class="group-title">${group.title}</h2>`;
                section.appendChild(header);

                let audioBar = document.createElement('div');
                audioBar.className = 'audio-controls-row';
                audioBar.innerHTML = `
                    <button class="btn-group" onclick="playGroup(this, 'group-${gIdx}')">🎧 قراءة المجموعة كاملة</button>
                    <button class="btn-test" onclick="toggleReadingTest(this, '#group-${gIdx}')">🎤 اختبر نفسك</button>
                `;
                section.appendChild(audioBar);

                let sentencesContainer = document.createElement('div');
                sentencesContainer.className = 'sentences-container';

                group.sentences.forEach((s, sIdx) => {
                    let rowId = `row-${gIdx}-${sIdx}`;
                    let row = document.createElement('div');
                    row.className = 'sentence-row';
                    row.id = rowId;
                    
                    row.innerHTML = `
                        <div class="ar-full-translation">${s.ar}</div>
                        <div class="en-sentence-part">
                            <div class="sentence-header">
                                <span class="num-badge">${(gIdx * 10) + sIdx + 1}</span>
                                <div class="words-wrapper">${renderClickableHtml(s.en)}</div>
                            </div>
                            <div class="sentence-actions">
                                <button class="btn-s-action btn-wbw" onclick="playSentenceWBW(this, '${rowId}')">🐢 قراءة كلمة كلمة</button>
                                <button class="btn-s-action btn-nat" onclick="playSentenceNatural(this, '${rowId}')">🗣️ قراءة طبيعية (تكرار)</button>
                            </div>
                        </div>
                    `;
                    sentencesContainer.appendChild(row);
                });

                section.appendChild(sentencesContainer);
                container.appendChild(section);
            });
        }

        window.toggleReadingTest = function(btn, groupSelector) {
            let groupEl = document.querySelector(groupSelector);
            if (groupEl.classList.contains('test-mode-active')) {
                groupEl.classList.remove('test-mode-active');
                btn.innerHTML = '🎤 اختبر نفسك';
                btn.classList.remove('active');
            } else {
                groupEl.classList.add('test-mode-active');
                btn.innerHTML = '👁️ إنهاء الاختبار';
                btn.classList.add('active');
            }
        };

        window.applyVoiceSettings = function(u) {
            u.pitch = 1.0;
            let voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                let engVoices = voices.filter(v => v.lang.startsWith('en'));
                if (engVoices.length > 0) {
                    let defaultVoice = engVoices.find(v => v.default) || engVoices.find(v => v.lang === 'en-US') || engVoices[0];
                    u.voice = defaultVoice;
                }
            }
        };

        window.currentAudio = { type: null, btn: null, targetId: null, queue: [], currentIndex: 0, text: '' };

        function stopAudio() {
            if(window.speechSynthesis) window.speechSynthesis.cancel();
            clearHighlights();
            if(window.currentAudio.btn) {
                window.currentAudio.btn.classList.remove('playing');
                if(window.currentAudio.btn.hasAttribute('data-original-text')) {
                    window.currentAudio.btn.innerHTML = window.currentAudio.btn.getAttribute('data-original-text');
                }
            }
            window.currentAudio.type = null;
            window.currentAudio.btn = null;
        }

        function setBtnPlaying(btn, type) {
            btn.classList.add('playing');
            if(!btn.hasAttribute('data-original-text')) {
                btn.setAttribute('data-original-text', btn.innerHTML);
            }
            btn.innerHTML = type === 'GROUP' ? '⏹ إيقاف القراءة' : '⏹ إيقاف';
        }

        function clearHighlights() {
            document.querySelectorAll('.audio-highlight').forEach(el => el.classList.remove('audio-highlight'));
            document.querySelectorAll('.sentence-row.line-highlight').forEach(el => el.classList.remove('line-highlight'));
        }

        window.playSentenceWBW = function(btn, rowId) {
            if (!window.speechSynthesis) return alert("متصفحك لا يدعم خاصية نطق الصوت.");
            if (window.currentAudio.btn === btn) { stopAudio(); return; }
            
            stopAudio();
            let queue = Array.from(document.getElementById(rowId).querySelectorAll('.word-group'));
            window.currentAudio = { type: 'WBW', btn: btn, targetId: rowId, queue: queue, currentIndex: 0 };
            setBtnPlaying(btn, 'WBW');
            speakNextWBW();
        };

        function speakNextWBW() {
            if(window.currentAudio.type !== 'WBW') return;
            
            if(window.currentAudio.currentIndex >= window.currentAudio.queue.length) {
                window.currentAudio.currentIndex = 0; 
                setTimeout(speakNextWBW, 1000); 
                return;
            }

            clearHighlights();
            let wordEl = window.currentAudio.queue[window.currentAudio.currentIndex];
            wordEl.classList.add('audio-highlight');
            
            let text = wordEl.querySelector('.en').textContent.trim();
            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.8;
            applyVoiceSettings(u);
            
            u.onend = function() {
                if(window.currentAudio.type === 'WBW') {
                    window.currentAudio.currentIndex++;
                    speakNextWBW();
                }
            };
            window.speechSynthesis.speak(u);
        }

        window.playSentenceNatural = function(btn, rowId) {
            if (!window.speechSynthesis) return alert("متصفحك لا يدعم خاصية نطق الصوت.");
            if (window.currentAudio.btn === btn) { stopAudio(); return; }
            
            stopAudio();
            let wordEls = Array.from(document.getElementById(rowId).querySelectorAll('.word-group .en'));
            let text = wordEls.map(w => w.textContent.trim()).join(' ');
            
            window.currentAudio = { type: 'NAT', btn: btn, targetId: rowId, text: text };
            setBtnPlaying(btn, 'NAT');
            speakNAT();
        };

        function speakNAT() {
            if(window.currentAudio.type !== 'NAT') return;
            
            clearHighlights();
            document.getElementById(window.currentAudio.targetId).classList.add('line-highlight');

            let u = new SpeechSynthesisUtterance(window.currentAudio.text);
            u.lang = 'en-US';
            u.rate = 0.9;
            applyVoiceSettings(u);
            
            u.onend = function() {
                if(window.currentAudio.type === 'NAT') {
                    setTimeout(speakNAT, 1000); 
                }
            };
            window.speechSynthesis.speak(u);
        }

        window.playGroup = function(btn, groupId) {
            if (!window.speechSynthesis) return alert("متصفحك لا يدعم خاصية نطق الصوت.");
            if (window.currentAudio.btn === btn) { stopAudio(); return; }
            
            stopAudio();
            let queue = Array.from(document.getElementById(groupId).querySelectorAll('.sentence-row'));
            window.currentAudio = { type: 'GROUP', btn: btn, targetId: groupId, queue: queue, currentIndex: 0 };
            setBtnPlaying(btn, 'GROUP');
            speakNextGroup();
        };

        function speakNextGroup() {
            if(window.currentAudio.type !== 'GROUP') return;
            
            if(window.currentAudio.currentIndex >= window.currentAudio.queue.length) {
                stopAudio(); 
                return;
            }

            clearHighlights();
            let rowEl = window.currentAudio.queue[window.currentAudio.currentIndex];
            rowEl.classList.add('line-highlight');
            rowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

            let wordEls = Array.from(rowEl.querySelectorAll('.word-group .en'));
            let text = wordEls.map(w => w.textContent.trim()).join(' ');

            let u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.9;
            applyVoiceSettings(u);
            
            u.onend = function() {
                if(window.currentAudio.type === 'GROUP') {
                    window.currentAudio.currentIndex++;
                    speakNextGroup();
                }
            };
            window.speechSynthesis.speak(u);
        }

        document.addEventListener('click', function(e) {
            let wg = e.target.closest('.word-group');
            if (wg && !e.target.closest('button')) {
                stopAudio(); 
                
                let speakTextAttr = wg.getAttribute('data-speak');
                if (speakTextAttr && window.speechSynthesis) {
                    wg.classList.add('highlight');
                    let txt = speakTextAttr.replace(/[\._\?\,]/g, '').trim();
                    if(txt) {
                        let u = new SpeechSynthesisUtterance(txt);
                        u.lang = 'en-US'; 
                        u.rate = 0.85;
                        applyVoiceSettings(u);
                        u.onend = () => wg.classList.remove('highlight');
                        u.onerror = () => wg.classList.remove('highlight');
                        window.speechSynthesis.speak(u);
                        setTimeout(() => wg.classList.remove('highlight'), 1200);
                    } else {
                        wg.classList.remove('highlight');
                    }
                }
            }
        });

        if(window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = function() {
                window.speechSynthesis.getVoices();
            };
        }

        buildApp();

    } catch (e) {
        document.body.innerHTML += '<div style="color:white; background:#e74c3c; padding:20px; font-size:18px; text-align:right; direction:rtl; margin-top:20px; border-radius:10px;"><b>خطأ برمجي:</b><br>' + e.message + '</div>';
    }
})();
</script>
