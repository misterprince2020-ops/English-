{q:"7. Which pair of words is a hyponym of another word?", o:["A. See - Sea | (متجانسات صوتية homophones)", "B. Hot - Cold | (متضادات antonyms)", "C. Big - Large | (مترادفات synonyms)", "D. Banana - Fruit | موز - فاكهة (اندراج: نوع من كل)"], c:3, t:"أي زوج من الكلمات يُعد 'hyponym' (علاقة اندراج / خاص وعام) لكلمة أخرى؟", e:"<div class='box-hint'>الاندراج (Hyponymy) هو علاقة المعنى حيث تكون كلمة نوعاً من كلمة أخرى أشمل، مثل الموز (Banana) الذي هو نوع من الفاكهة (Fruit).</div>"},
{q:"8. What is the teaching method where a teacher shares a video or learning material with students before class, and then uses class time for difficult tasks, discussions, and practical activities under the teacher's supervision?", o:["A. Flipped classroom | الفصل المقلوب", "B. Synchronous learning | التعلم المتزامن", "C. Direct instruction | التوجيه المباشر", "D. Distance learning | التعلم عن بعد"], c:0, t:"ما هي طريقة التدريس حيث يشارك المعلم مقطع فيديو مع الطلاب قبل الحصة، ثم يستخدم وقت الحصة للأنشطة العملية والمناقشة؟", e:"<div class='box-hint'>نقل شرح الدرس للمنزل (عبر فيديو) واستخدام وقت الحصة للتطبيق وحل المشكلات هو جوهر استراتيجية الفصل المقلوب (Flipped classroom).</div>"},
{q:"9. In which approach would a teacher be likely to focus on the whole meaning, students' interests, and students' background knowledge?", o:["A. Literature-based approach | منهج قائم على الأدب", "B. Interactive approach | منهج تفاعلي", "C. Top-down approach | منهج من أعلى إلى أسفل", "D. Bottom-up approach | منهج من أسفل إلى أعلى"], c:2, t:"في أي نهج من المرجح أن يركز المعلم على المعنى العام، واهتمامات الطلاب، وخلفيتهم المعرفية؟", e:"<div class='box-hint'>المنهج (Top-down) يركز على الفهم الشامل للنص باستخدام المعرفة السابقة قبل الخوض في التفاصيل الدقيقة للمفردات.</div>"},
{q:"10. Which activity involves 2 or 3 students practicing a dialogue of more than 10 words per sentence for an extended period of time?", o:["A. Presentation | العرض التقديمي الفردي", "B. Role-playing | لعب الأدوار (تمثيل حواري)", "C. Gap-filling | ملء الفراغات", "D. Show-and-tell | عرض وتحدث"], c:1, t:"أي نشاط يتضمن طالبين أو ثلاثة يمارسون حواراً (ديالوج) لفترة زمنية ممتدة؟", e:"<div class='box-hint'>لعب الأدوار (Role-playing) هو النشاط التفاعلي الذي يمارس فيه الطلاب حوارات واقعية مطولة ومستمرة.</div>"},
{q:"11. While teaching listening, which of the following techniques helps implement top-down listening strategies?", o:["A. Recognizing cognates | التعرف على الكلمات المتشابهة", "B. Listening for the main idea | الاستماع لاستخراج الفكرة الرئيسية", "C. Listening for specific details | الاستماع لتفاصيل محددة", "D. Recognizing word-order patterns | التعرف على أنماط ترتيب الكلمات"], c:1, t:"أثناء تدريس الاستماع، أي من التقنيات التالية تساعد في تنفيذ استراتيجيات الاستماع 'من أعلى إلى أسفل'؟", e:"<div class='box-hint'>استراتيجية 'Top-down' ترتكز على الفهم الكلي، لذا الاستماع للفكرة الرئيسية (Main idea) هو التطبيق الأمثل لها.</div>"},
{q:"12. Which of the following theories argues that language learning is a process of linguistic imitation and habit formation?", o:["A. The innatist Theory | النظرية الفطرية (العقلية)", "B. The Cognitivist Theory | النظرية المعرفية", "C. The Behaviorist Theory | النظرية السلوكية", "D. The Sociocultural Theory | النظرية الثقافية الاجتماعية"], c:2, t:"أي من النظريات التالية تجادل بأن تعلم اللغة هو عملية تقليد لغوي وتكوين عادات؟", e:"<div class='box-hint'>النظرية السلوكية (Behaviorist) ترى أن التعلم يحدث عبر تكرار الاستجابات وتقليدها حتى تصبح عادة (Habit formation).</div>"},
{q:"13. What does this acronym (TEFL) stand for?", o:["A. Testing English as foreign language | (خطأ)", "B. Teaching English as foreign language | تدريس الإنجليزية كلغة أجنبية", "C. Technology enhanced foreign learning | (خطأ)", "D. Training and Education for Future Leaders | (خطأ)"], c:1, t:"إلى ماذا يرمز اختصار (TEFL)؟", e:"<div class='box-hint'>TEFL هو اختصار لمصطلح 'Teaching English as a Foreign Language'.</div>"},
{q:"14. Repeating after the audio or native speaker at the same time is called:", o:["A. Echo | الصدى (الترديد بعد فترة)", "B. Shadowing | التتبع الظلي (الترديد المتزامن)", "C. Imitation | التقليد العام", "D. Reacting | التفاعل"], c:1, t:"الترديد مع المقطع الصوتي أو المتحدث الأصلي في نفس الوقت بالضبط يُسمى:", e:"<div class='box-hint'>تقنية الترديد المتزامن فور سماع الكلمة لتحسين النطق والطلاقة تُعرف بـ (Shadowing).</div>"},
{q:"15. The notion that the ability acquires language biologically linked to Age is called..........", o:["A. Stephen Krashen's theory | نظرية ستيفن كراشن", "B. Multilingualism | التعدد اللغوي", "C. Interlanguage | اللغة الوسيطة", "D. The critical period hypothesis | فرضية الفترة الحرجة"], c:3, t:"الفكرة القائلة بأن القدرة على اكتساب اللغة مرتبطة بيولوجياً بالعمر تسمى..........", e:"<div class='box-hint'>الفرضية التي تربط بين العمر والقدرة الفطرية لاكتساب اللغة بطلاقة تسمى (Critical period hypothesis).</div>"},
{q:"16. ........ is used to describe features of grammar, vocabulary, and pronunciation that identify where the speaker is from, both regionally and socially.", o:["A. Accent | اللكنة (طريقة النطق فقط)", "B. Dialect | اللهجة (نطق + قواعد + مفردات)", "C. phonology | علم الأصوات", "D. Slang | اللغة العامية"], c:1, t:"........ تُستخدم لوصف خصائص القواعد والمفردات والنطق التي تحدد من أين أتى المتحدث (إقليمياً واجتماعياً).", e:"<div class='box-hint'>اللهجة (Dialect) تشمل اختلافات متكاملة في القواعد والمفردات والنطق، عكس اللكنة التي تقتصر على النطق فقط.</div>"},
{q:"17. The cognitive stage that involves changing or altering existing knowledge structures in light of new information is known as ........", o:["A. Accommodation | التكييف / المواءمة (تغيير البنية السابقة)", "B. Assimilation | الاستيعاب (دمج دون تغيير)", "C. Activation | التنشيط", "D. Insertion | الإدراج"], c:0, t:"المرحلة المعرفية التي تتضمن تغيير أو تبديل الهياكل المعرفية الموجودة في ضوء معلومات جديدة تُعرف بـ ........", e:"<div class='box-hint'>في نظرية بياجيه، تعديل المخططات الذهنية القديمة لتناسب معلومة جديدة جذرياً يُسمى المواءمة (Accommodation).</div>"},
{q:"18. In a reading class, A teacher divides a reading passages to his students. Students read their assigned section carefully, taking notes, highlighting key points, and preparing to explain it to others.", o:["A. gamification | التلعيب", "B. word puzzle | لغز كلمات", "C. jigsaw | استراتيجية الجيجسو (التعلم التعاوني المقسم)", "D. brainstorming | العصف الذهني"], c:2, t:"يقسم المعلم القطع على الطلاب ليقرأ كل منهم جزءاً ثم يشرحه للآخرين. تسمى هذه الاستراتيجية:", e:"<div class='box-hint'>تقسيم النص على مجموعات ليصبح كل طالب خبيراً في جزئه ويشرحه لزملائه يُعرف باستراتيجية Jigsaw.</div>"},
{q:"19. The direct method places emphasis on ........", o:["A. Translation | الترجمة (ممنوعة في هذه الطريقة)", "B. Memorization | الحفظ الأصم", "C. The first language | اللغة الأم (ممنوعة)", "D. The target language | اللغة المستهدفة"], c:3, t:"الطريقة المباشرة تضع تأكيداً كبيراً على ........", e:"<div class='box-hint'>الطريقة المباشرة تمنع تماماً استخدام لغة الأم في الفصل وتركز حصرياً على التواصل باللغة المستهدفة (Target language).</div>"},
{q:"20. Words like croissant, cafe are English words of __ origin.", o:["A. Turkey | أصل تركي", "B. Italian | أصل إيطالي", "C. French | أصل فرنسي", "D. Greek | أصل يوناني"], c:2, t:"كلمات مثل croissant و cafe هي كلمات إنجليزية من أصل ........", e:"<div class='box-hint'>هاتان الكلمتان مستعارتان (Borrowing) من اللغة الفرنسية (French).</div>"},
{q:"21. 'Don't split infinitives'", o:["A. Generative | توليدي", "B. Universal | عالمي", "C. Descriptive | وصفي (يصف كيف يتحدث الناس فعلاً)", "D. Prescriptive | إلزامي / توجيهي (يملي كيف يجب أن يتحدثوا)"], c:3, t:"قاعدة 'لا تفصل بين to والفعل في صيغة المصدر' هي قاعدة:", e:"<div class='box-hint'>القواعد التي تُملي على المتحدث ما يصح وما لا يصح وتفرض قواعد صارمة تُسمى قواعد توجيهية إلزامية (Prescriptive).</div>"},
{q:"22. What does the input hypothesis primarily focus on?", o:["A. instruction | التعليمات المباشرة", "B. teaching | أساليب التدريس", "C. acquisition | اكتساب اللغة اللاواعي", "D. training | التدريب المتكرر"], c:2, t:"على ماذا تركز 'فرضية المدخلات' (لستيفن كراشن) في المقام الأول؟", e:"<div class='box-hint'>تتعلق فرضية المدخلات بشكل أساسي باكتساب اللغة (Acquisition) عندما يتعرض المتعلم لمدخلات أعلى قليلاً من مستواه (i+1).</div>"},
{q:"23. According to Piaget's theory of cognitive development, at which stage do memorization and imagination occur?", o:["A. 2-7 years | من 2 إلى 7 سنوات (مرحلة ما قبل العمليات)", "B. 7-11 years | من 7 إلى 11 سنة", "C. 11-15 years | من 11 إلى 15 سنة", "D. 18-20 years | من 18 إلى 20 سنة"], c:0, t:"وفقاً لنظرية بياجيه للتطور المعرفي، في أي مرحلة يظهر الحفظ والتخيل؟", e:"<div class='box-hint'>في مرحلة ما قبل العمليات (Preoperational) من عمر 2-7 سنوات، يتطور التخيل والذاكرة بشكل واضح عند الطفل.</div>"},
{q:"24. Why should a teacher explain the learning objectives to students at the start of the lesson?", o:["A. To help them understand how they are learning | كيف يتعلمون", "B. To help them know when they are learning | متى يتعلمون", "C. To help them know what they are learning | لمساعدتهم على معرفة ما الذي سيتعلمونه", "D. To help them know where they are learning | أين يتعلمون"], c:2, t:"لماذا يجب على المعلم شرح أهداف التعلم للطلاب في بداية الدرس؟", e:"<div class='box-hint'>توضيح الأهداف يضع خريطة ذهنية للطلاب ويساعدهم على معرفة المحتوى والغرض الذي سيركزون عليه (What they are learning).</div>"},
{q:"25. When the teacher asks students to change a passive sentence into an active sentence, which type of drill is being used?", o:["A. Repetition | تدريب التكرار فقط", "B. Substitution | استبدال كلمة بكلمة في نفس الجملة", "C. Transformation | تدريب التحويل (تغيير بنية الجملة)", "D. (خيار فارغ)"], c:2, t:"عندما يطلب المعلم من الطلاب تحويل جملة مبنية للمجهول إلى مبنية للمعلوم، فأي نوع من التدريبات يتم استخدامه؟", e:"<div class='box-hint'>تحويل الجملة من صيغة إلى أخرى (كمن المبني للمعلوم للمجهول، أو من إثبات لنفي) يسمى تدريب التحويل (Transformation drill).</div>"},
{q:"26. ........ A teaching method focus primarily on teaching reading and writing", o:["A. Direct method | الطريقة المباشرة", "B. GTM( Grammar translation method) | طريقة القواعد والترجمة", "C. Audio lingual method | الطريقة السمعية الشفوية", "D. Silent method | الطريقة الصامتة"], c:1, t:"........ طريقة تدريس تركز بشكل أساسي على تدريس القراءة والكتابة فقط.", e:"<div class='box-hint'>طريقة القواعد والترجمة (GTM) تعتمد على حفظ القواعد وقراءة النصوص المكتوبة وترجمتها، وتهمل التحدث تماماً.</div>"},
{q:"27. Students can write without worrying about their mistakes and grammar.", o:["A. Controlled writing | كتابة متحكم بها (صارمة)", "B. Guided writing | كتابة موجهة", "C. Open writing | كتابة مفتوحة", "D. Free writing | الكتابة الحرة"], c:3, t:"(في هذا النوع) يمكن للطلاب الكتابة بحرية دون القلق بشأن أخطائهم وقواعدهم النحوية.", e:"<div class='box-hint'>الكتابة الحرة (Free writing) تهدف لتدفق الأفكار والإبداع دون التوقف عند تدقيق الأخطاء الإملائية أو النحوية.</div>"},
{q:"28. A student can learn through touching and moving around the class this is the -------- method", o:["A. Audiolingual | الطريقة السمعية", "B. Kinaesthetic | الطريقة الحركية / اللمسية", "C. Suggestopedia | الإيحائية", "D. Community Language Learning | تعلم مجتمع اللغة"], c:1, t:"يمكن للطالب أن يتعلم من خلال اللمس والحركة داخل الفصل. هذا يمثل أسلوب التعلم --------", e:"<div class='box-hint'>المتعلم الذي يفضل التعلم عبر التجربة الجسدية واللمس والحركة يُصنف كمتعلم حركي (Kinaesthetic).</div>"},
{q:"29. How many morphemes in a word 'hospitalizations'?", o:["A. 3", "B. 4", "C. 5", "D. 6"], c:1, t:"كم عدد المورفيمات في كلمة 'hospitalizations'؟", e:"<div class='box-hint'>الكلمة تتكون من 4 أجزاء (مورفيمات): الجذر (hospital) + اللاحقة (ize) + اللاحقة (ation) + لاحقة الجمع (s).</div>"},
{q:"30. The words 'smog' , 'workaholic' as a result of one for morphological process called:", o:["A. borrowing | اقتراض كلمة كما هي", "B. compounding | تركيب كلمتين دون حذف", "C. Clipping | اقتطاع جزء من كلمة", "D. Blending | المزج (دمج مع حذف أجزاء)"], c:3, t:"الكلمتان 'smog' و 'workaholic' هما نتيجة لعملية صرفية تُسمى:", e:"<div class='box-hint'>المزج (Blending) يدمج أجزاء كلمتين لتكوين كلمة جديدة: smoke + fog = smog، و work + alcoholic = workaholic.</div>"},
{q:"31. In a controlled writing activity, what does the teacher usually ask students to do?", o:["A. Write an essay | كتابة مقال حر", "B. Write a paragraph | كتابة فقرة طويلة", "C. Do a dictation | الإملاء (كتابة نص محدد سلفاً)", "D. (خيار فارغ)"], c:2, t:"في نشاط الكتابة المُتحكم بها (controlled writing)، ماذا يطلب المعلم عادة من الطلاب أن يفعلوا؟", e:"<div class='box-hint'>الكتابة المتحكم بها تمنع الطالب من ارتكاب الأخطاء عبر تقييده بنص محدد، والإملاء (Dictation) هو أوضح مثال عليها.</div>"},
{q:"32. A teacher tells students: 'All your writing assignments, including drafts, revised drafts, and final assessments, should be collected throughout the semester and kept in one file.' This type of assignment is called a writing ........", o:["A. Flipbook | كتاب متحرك", "B. Portfolio | ملف الإنجاز", "C. Mind map | خريطة ذهنية", "D. Infographic | إنفوجرافيك"], c:1, t:"طلب المعلم تجميع كافة الواجبات والمسودات في ملف واحد طوال الفصل الدراسي. هذا التكليف يُسمى ........ الكتابة.", e:"<div class='box-hint'>تجميع أعمال الطالب وتطور مستواه عبر فترة زمنية في ملف واحد يُعرف بملف الإنجاز (Portfolio).</div>"},
{q:"33. The learners ability to write a gist of a given piece of reading material in their own words is known as......", o:["A. prediction | التنبؤ", "B. discussion | النقاش", "C. summarizing | التلخيص", "D. extracting | الاستخراج"], c:2, t:"قدرة المتعلمين على كتابة (الخلاصة الفكرة الرئيسية) لقطعة قراءة معينة بكلماتهم الخاصة تُعرف بـ......", e:"<div class='box-hint'>أخذ النص الطويل وصياغة فكرته الأساسية (gist) بإيجاز يُسمى التلخيص (Summarizing).</div>"},
{q:"34. In the English language, roots that cannot stand alone and must be connected to another morpheme to form a complete word are called:", o:["A. Inflectional morpheme | مورفيم إعرابي", "B. Bound morpheme | مورفيم مقيد (لا يقف وحده)", "C. Derivational morpheme | مورفيم اشتقاقي", "D. (خيار فارغ)"], c:1, t:"الجذور التي لا يمكن أن تقف بمفردها ككلمة تامة ويجب أن تتصل بمورفيم آخر تسمى:", e:"<div class='box-hint'>المورفيم الذي ليس له معنى مستقل إلا إذا ارتبط بغيره يُسمى (Bound morpheme).</div>"},
{q:"35. Which of the following is considered a major field of study in language learning?:", o:["A. Semantics | علم الدلالة (فرع)", "B. Linguistics | اللغويات (المجال الشامل)", "C. Literature | الأدب", "D. Culture | الثقافة"], c:1, t:"أي مما يلي يُعتبر مجالاً رئيسياً (شاملاً) للدراسة في تعلم اللغة؟", e:"<div class='box-hint'>اللغويات (Linguistics) هو المجال الرئيسي الذي يدرس اللغة كنظام شامل، بينما الدلالة (Semantics) هو مجرد فرع منه.</div>"},
{q:"36. According to the ........ teaching should be subordinated to learning.", o:["A. Audiolingual method | الطريقة السمعية الشفوية", "B. Direct method | الطريقة المباشرة", "C. Grammar translation method | طريقة القواعد والترجمة", "D. Silent way method | الطريقة الصامتة"], c:3, t:"وفقاً لطريقة ........ يجب أن يكون التدريس (دور المعلم) خاضعاً وتابعاً لعملية التعلم (دور الطالب النشط).", e:"<div class='box-hint'>الفكرة الأساسية في (Silent Way) هي تقليل تدخل المعلم لأقصى حد ليتمكن الطالب من الاكتشاف والتعلم الذاتي.</div>"},
{q:"37. Learning goal statements should begin with which type of word?", o:["A. Adverb | ظرف", "B. Action verbs | أفعال حركية/سلوكية", "C. Adjective | صفة", "D. Preposition | حرف جر"], c:1, t:"بأي نوع من الكلمات يجب أن تبدأ جمل أهداف التعلم (في الخطة الدراسية)؟", e:"<div class='box-hint'>يجب صياغة الأهداف بأفعال سلوكية قابلة للقياس والملاحظة (Action verbs) مثل: يكتب، يحلل، يصمم.</div>"},
{q:"38. At the end of the lesson students will be able to design advertisement. Which level of a bloom taxonomy?", o:["A. evaluation | التقييم (نقد وإصدار أحكام)", "B. Creating | الإبداع / الإنشاء", "C. application | التطبيق المباشر", "D. analyze | التحليل"], c:1, t:"'في نهاية الدرس سيتمكن الطلاب من تصميم إعلان'. أي مستوى من تصنيف بلوم يمثل هذا الهدف؟", e:"<div class='box-hint'>فعل (يصمم / يبتكر) يشير إلى بناء وإنتاج شيء جديد، وهو يمثل أعلى مستويات بلوم (Creating / Synthesis).</div>"},
{q:"39. A teacher started his lesson by presenting the rules first and then giving examples. Which teaching approach did he use?", o:["A. Inductive | استقرائي (من الأمثلة للقاعدة)", "B. Complex | معقد", "C. Deductive | استنتاجي / قياسي (من القاعدة للأمثلة)", "D. (خيار فارغ)"], c:2, t:"بدأ المعلم درسه بعرض القواعد أولاً ثم إعطاء الأمثلة. أي نهج تدريسي استخدم؟", e:"<div class='box-hint'>البدء بالقاعدة المباشرة ثم الانتقال للأمثلة التطبيقية يُسمى النهج الاستنتاجي (Deductive approach).</div>"},

{q:"46. Which type of adjective is used before a noun to describe it, as in the example expensive watch?", o:["A. Attributive adjective | صفة نعتية (تسبق الموصوف مباشرة)", "B. Passive adjective | صفة مبنية للمجهول", "C. Comparative adjective | صفة مقارنة", "D. Superlative adjective | صفة تفضيل أقصى"], c:0, t:"أي نوع من الصفات يُستخدم قبل الاسم مباشرة لوصفه، كما في مثال (ساعة غالية expensive watch)؟", e:"<div class='box-hint'>الصفة التي تأتي قبل الاسم مباشرة لتعدله تُسمى (Attributive adjective)، عكس الـ Predicative التي تأتي بعد الفعل.</div>"},

{q:"51. A teacher asks the students to identify the differences between two pictures. Which tense should they use?", o:["A. Past Perfect | الماضي التام", "B. Future Tense | المستقبل", "C. Present Tense | المضارع (البسيط / المستمر)", "D. Present Perfect Tense | المضارع التام"], c:2, t:"يطلب المعلم من الطلاب تحديد الاختلافات بين صورتين. أي زمن يجب أن يستخدموه؟", e:"<div class='box-hint'>لوصف الصور والأشياء الثابتة أو الأحداث الجارية فيها، نستخدم دائماً زمن المضارع (Present Tense).</div>"},

let synth = window.speechSynthesis, isExam = false, tooltip = document.getElementById('word-tooltip');

function formatInteractive(text) {
    return text.split(/([a-zA-Z0-9'-]+)/).map(tok => {
        if(/^[a-zA-Z0-9'-]+$/.test(tok)) {
            let clean = tok.toLowerCase();
            return `<b class="w-int" onclick="spk(this, event, '${clean}')">${tok}</b>`;
        }
        return tok;
    }).join('');
}

window.spk = function(el, ev, word) {
    ev.stopPropagation();
    if(!synth) return;
    synth.cancel();
    document.querySelectorAll('.w-int.active-speak').forEach(e => e.classList.remove('active-speak'));
    el.classList.add('active-speak');
    tooltip.textContent = dict[word] || "معنى سياقي";
    let rect = el.getBoundingClientRect();
    tooltip.style.left = (rect.left + window.scrollX) + 'px';
    tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
    tooltip.style.display = 'block';
    let u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-US'; u.rate = 0.85;
    u.onend = function() {
        el.classList.remove('active-speak');
        setTimeout(() => { tooltip.style.display = 'none'; }, 1200);
    };
    synth.speak(u);
};

function build() {
    let cont = document.getElementById('q-container'); cont.innerHTML = '';
    db.forEach((qObj, idx) => {
        let row = document.createElement('div');
        row.className = 'question-row';
        row.setAttribute('data-ans', qObj.c);
        row.setAttribute('data-orig', idx);
        let opts = qObj.o.map((opt, i) => {
            let p = opt.split('|');
            return `<div class="opt-item" data-i="${i}" onclick="sel(this, event)"><div class="choice-badge">${["A","B","C","D"][i]}</div><div class="choice-content"><div class="choice-en" dir="ltr">${formatInteractive(p[0].trim())}</div>${p[1]?`<div class="choice-ar" dir="rtl">${p[1].trim()}</div>`:''}</div></div>`;
        }).join('');
        row.innerHTML = `<div class="q-text-container"><b class="q-number-lbl">${idx + 1}. </b><div class="q-text" dir="ltr">${formatInteractive(qObj.q.replace(/^\d+\.\s*/, ''))}</div></div>${qObj.t?`<div class="full-sentence-translation">📝 ${qObj.t}</div>`:''}<div class="options-inline">${opts}</div><button class="btn-answer" onclick="rev(this)">👁️ إظهار الشرح والمفاتيح</button><div class="answer-box"><div class="grammar-explanation">${qObj.e}</div></div>`;
        cont.appendChild(row);
    });
}

window.sel = function(optItem, event) {
    if(event.target.classList.contains('w-int')) return;
    let row = optItem.closest('.question-row');
    if(row.classList.contains('answered')) return; 
    let correctIndex = row.getAttribute('data-ans');
    let selectedIndex = optItem.getAttribute('data-i');
    row.classList.add('answered'); optItem.classList.add('selected');
    row.querySelectorAll('.opt-item').forEach(item => { if (item.getAttribute('data-i') === correctIndex) item.classList.add('correct'); });
    if (selectedIndex !== correctIndex) optItem.classList.add('wrong');
    if (!isExam) { let btn = row.querySelector('.btn-answer'); if (btn) btn.click(); }
};

window.rev = function(btn) {
    let box = btn.nextElementSibling;
    if (box.style.display === 'none' || box.style.display === '') { box.style.display = 'block'; btn.innerHTML = '🙈 إخفاء الشرح والمفاتيح'; } 
    else { box.style.display = 'none'; btn.innerHTML = '👁️ إظهار الشرح والمفاتيح'; }
};

window.setMode = function(m) {
    isExam = (m === 'exam');
    let c = document.getElementById('q-container');
    document.getElementById('btn-study').className = `mode-btn btn-study ${!isExam?'active-mode':''}`;
    document.getElementById('btn-exam').className = `mode-btn btn-exam ${isExam?'active-mode':''}`;
    document.getElementById('btn-result').style.display = isExam ? 'block' : 'none';
    document.getElementById('res-box').style.display = 'none';
    c.className = isExam ? 'questions-container exam-mode' : 'questions-container train-mode';
    if(synth) synth.cancel(); tooltip.style.display = 'none';
    
    let rows = Array.from(c.querySelectorAll('.question-row'));
    rows.forEach(r => {
        r.classList.remove('answered');
        r.querySelectorAll('.opt-item').forEach(i => i.classList.remove('selected','correct','wrong'));
        r.querySelector('.answer-box').style.display = 'none';
        r.querySelector('.btn-answer').innerHTML = '👁️ إظهار الشرح والمفاتيح';
    });

    if(isExam) {
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort(() => Math.random() - 0.5).forEach(o => optsCont.appendChild(o));
        });
        rows.sort(() => Math.random() - 0.5).forEach(r => c.appendChild(r));
    } else {
        rows.sort((a,b) => a.getAttribute('data-orig') - b.getAttribute('data-orig'));
        rows.forEach(r => {
            let optsCont = r.querySelector('.options-inline'), optsArr = Array.from(optsCont.children);
            optsArr.sort((a,b) => a.getAttribute('data-i') - b.getAttribute('data-i')).forEach(o => optsCont.appendChild(o));
            c.appendChild(r);
        });
    }
};

window.showResult = function() {
    let rows = document.querySelectorAll('.question-row'), corr = 0, ans = 0;
    rows.forEach(r => { let s = r.querySelector('.opt-item.selected'); if(s) { ans++; if(s.classList.contains('correct')) corr++; } });
    let res = document.getElementById('res-box');
    res.innerHTML = ans < rows.length ? `⚠️ أجبت على ${ans} من ${rows.length}.<br> نتيجتك: ${corr} / ${rows.length}` : `النتيجة النهائية: ${corr} / ${rows.length}<br>🏆 ممتاز يا أستاذ حمادة!`;
    res.style.display = "block"; window.scrollTo({ top: res.offsetTop - 100, behavior: 'smooth' });
};

document.addEventListener('click', e => { if(!e.target.classList.contains('w-int')) { tooltip.style.display = 'none'; if(document.querySelector('.w-int.active-speak')) document.querySelector('.w-int.active-speak').classList.remove('active-speak'); } });
build();
})();
</script>
